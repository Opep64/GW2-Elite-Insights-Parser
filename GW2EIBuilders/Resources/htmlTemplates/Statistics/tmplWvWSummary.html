<template>
    <div ref="summaryRoot">
        <div v-if="summary" class="wvw-summary-panel">
            <div class="wvw-summary-header">
                <div class="wvw-summary-header-title">WvW Fight Summary</div>
                <div class="wvw-summary-header-layout">
                    <div class="wvw-summary-header-spotlight">
                        <div class="wvw-summary-header-kicker">Player Count</div>
                        <div class="wvw-summary-header-spotlight-row">
                            <span class="wvw-summary-header-status" :class="numbersStatusToneClass">{{playerCountStatusLabel}}</span>
                        </div>
                        <div class="wvw-summary-header-spotlight-value">{{playerCountSupporting}}</div>
                        <div class="wvw-summary-header-spotlight-note">Numbers context treats 3 friendlies as 1 squad player.</div>
                    </div>
                    <div class="wvw-summary-header-facts">
                        <div class="wvw-summary-header-fact">
                            <span class="wvw-summary-header-fact-label">Fight Time</span>
                            <span class="wvw-summary-header-fact-value">{{summary.fightTime}}</span>
                        </div>
                        <div class="wvw-summary-header-fact">
                            <span class="wvw-summary-header-fact-label">Enemy Group Formation</span>
                            <span class="wvw-summary-header-fact-value">{{enemyGroupFormation}}</span>
                        </div>
                        <div class="wvw-summary-header-fact">
                            <span class="wvw-summary-header-fact-label">Winner</span>
                            <span class="wvw-summary-header-fact-value">{{winnerLabel}}</span>
                        </div>
                        <div class="wvw-summary-header-fact">
                            <span class="wvw-summary-header-fact-label">Estimate Context</span>
                            <span class="wvw-summary-header-fact-value">{{numbersAdjustmentLabel}}</span>
                        </div>
                    </div>
                </div>
                <div class="wvw-summary-header-detail">{{summary.healStatsNotice}}</div>
            </div>
            <div class="wvw-summary-subtabs">
                <button type="button" class="wvw-summary-subtab" :class="{'active': activeSummaryTab === 'overview'}"
                    @click="setSummarySubTab('overview')">
                    Overview
                </button>
                <button type="button" class="wvw-summary-subtab" :class="{'active': activeSummaryTab === 'metrics'}"
                    @click="setSummarySubTab('metrics')">
                    Metrics
                </button>
                <button type="button" class="wvw-summary-subtab" :class="{'active': activeSummaryTab === 'downs'}"
                    @click="setSummarySubTab('downs')">
                    Downs
                </button>
                <button type="button" class="wvw-summary-subtab" :class="{'active': activeSummaryTab === 'moments'}"
                    @click="setSummarySubTab('moments')">
                    Moments
                </button>
            </div>
            <div v-if="activeSummaryTab === 'overview' && summary.squadGrade" class="wvw-summary-grade-panel">
                <div class="wvw-summary-grade-header">
                    <div class="wvw-summary-grade-copy">
                        <div class="wvw-summary-side-panel-title">Squad Skill</div>
                    </div>
                </div>
                <div class="wvw-summary-grade-grid">
                    <div v-for="subGrade in summary.squadGrade.subGrades" :key="'squad-grade-' + subGrade.label"
                        class="wvw-summary-grade-card">
                        <div class="wvw-summary-grade-card-header">
                            <div class="wvw-summary-grade-card-title">{{subGrade.label}}</div>
                        </div>
                        <div class="wvw-summary-grade-card-detail">{{subGrade.detail}}</div>
                    </div>
                </div>
            </div>
            <div v-if="activeSummaryTab === 'overview' && summary.oppositionEstimate" class="wvw-summary-grade-panel">
                <div class="wvw-summary-grade-header">
                    <div class="wvw-summary-grade-copy">
                        <div class="wvw-summary-side-panel-title">Opposition Skill</div>
                    </div>
                </div>
                <div class="wvw-summary-grade-grid">
                    <div v-for="subGrade in summary.oppositionEstimate.subGrades" :key="'opposition-grade-' + subGrade.label"
                        class="wvw-summary-grade-card">
                        <div class="wvw-summary-grade-card-header">
                            <div class="wvw-summary-grade-card-title">{{subGrade.label}}</div>
                        </div>
                        <div class="wvw-summary-grade-card-detail">{{subGrade.detail}}</div>
                    </div>
                </div>
            </div>
            <div v-if="activeSummaryTab === 'overview' && summary.playerStandouts && summary.playerStandouts.hasEntries" class="wvw-summary-side-panel wvw-summary-standouts-panel">
                <div class="wvw-summary-standouts-header">
                    <div class="wvw-summary-side-panel-title">Player Standouts</div>
                    <button type="button" class="combat-replay-overview-help-button" title="Player standouts help" aria-label="Show player standouts help" @click="showStandoutsHelp = true">?</button>
                </div>
                <div class="wvw-summary-side-panel-subtitle">{{summary.playerStandouts.summary}}</div>
                <div class="wvw-summary-standouts-grid">
                    <div v-for="category in summary.playerStandouts.categories" :key="'standout-' + category.key" class="wvw-summary-standout-card">
                        <div class="wvw-summary-standout-card-title">{{category.label}}</div>
                        <div class="wvw-summary-standout-card-detail">{{category.detail}}</div>
                        <button v-for="(entry, index) in category.entries" :key="'standout-entry-' + category.key + '-' + entry.playerIndex"
                            type="button"
                            class="wvw-summary-standout-entry"
                            @click="openPlayerSummary(entry.playerIndex)">
                            <div class="wvw-summary-standout-entry-head">
                                <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                                <img :src="entry.icon" :alt="entry.profession" class="icon"
                                    :data-original-title="entry.profession">
                                <span class="wvw-summary-top-player-name" :data-original-title="entry.account ? (entry.name + ' - ' + entry.account) : entry.name">{{entry.name}}</span>
                            </div>
                            <div class="wvw-summary-standout-entry-meta">
                                <span class="wvw-summary-standout-role">{{entry.roleLabel}}</span>
                                <span class="wvw-summary-standout-text">{{entry.whyLine}}</span>
                                <div v-if="entry.evidenceTags && entry.evidenceTags.length > 0" class="wvw-summary-standout-tags">
                                    <span v-for="(tag, tagIndex) in entry.evidenceTags" :key="'standout-tag-' + category.key + '-' + entry.playerIndex + '-' + tagIndex" class="wvw-summary-standout-tag">{{tag}}</span>
                                </div>
                            </div>
                        </button>
                        <div v-if="category.entries.length === 0" class="wvw-summary-side-panel-empty">
                            No standout players were identified for this category.
                        </div>
                    </div>
                </div>
                <div v-if="showStandoutsHelp" class="wvw-summary-modal-backdrop" @click.self="showStandoutsHelp = false">
                    <div class="wvw-summary-modal combat-replay-overview-help-modal" role="dialog" aria-modal="true" aria-label="Player standouts help">
                        <button type="button" class="wvw-summary-modal-close" aria-label="Close player standouts help" @click="showStandoutsHelp = false">&times;</button>
                        <div class="wvw-summary-modal-title">Player Standouts Help</div>
                        <div class="wvw-summary-modal-subtitle">
                            Player standouts recognize who mattered most in the fight's key moments. These are timed, fight-context highlights, not raw-stat leaderboards and not player grades.
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Categories</div>
                            <ul class="combat-replay-overview-help-list">
                                <li><strong>Fight Impact</strong>: the most influential overall timed contribution across the fight's high-leverage windows</li>
                                <li><strong>Offensive Impact</strong>: burst pressure, focus fire, and damage that mattered during successful pressure windows</li>
                                <li><strong>Control Impact</strong>: boon strips and effective crowd control timed around conversions and swings</li>
                                <li><strong>Support Impact</strong>: healing, cleanses, and rez contribution during pressure and stabilization windows</li>
                                <li><strong>Hybrid Impact</strong>: meaningful combined value across multiple roles in the same fight</li>
                            </ul>
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Entry Breakdown</div>
                            <ul class="combat-replay-overview-help-list">
                                <li><strong>Role label</strong> is inferred from what the player actually contributed in this fight, rather than from profession expectations</li>
                                <li><strong>Why line</strong> is the short explanation for why the player stood out in that category</li>
                                <li><strong>Evidence tags</strong> are compact clues about the types of moments the player influenced, such as key windows, bomb windows, conversion windows, or support stabilization</li>
                            </ul>
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Important Notes</div>
                            <ul class="combat-replay-overview-help-list">
                                <li>Standouts are weighted toward contributions during important fight windows identified from the Moments timeline</li>
                                <li>Players can appear in multiple categories if they both performed their role well and had broad fight impact</li>
                                <li>Meaningless raw output is de-emphasized compared with timed contribution in the right windows</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <div v-if="activeSummaryTab === 'metrics'" class="wvw-summary-layout">
                <div class="wvw-summary-table-wrap">
                    <table class="table table-sm table-striped table-hover wvw-summary-table" cellspacing="0" width="100%">
                        <thead>
                            <tr>
                                <th class="text-left wvw-summary-metric-column">Metric</th>
                                <th class="text-right">{{summary.squad.label}}</th>
                                <th class="text-right">{{summary.enemy.label}}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="row in summary.metricRows" :key="row.label">
                                <td class="text-left wvw-summary-metric-column">{{row.label}}</td>
                                <td class="text-right" :class="getValueClass(row, 'squad')">{{formatRowValue(row.squadValue, row)}}</td>
                                <td class="text-right" :class="getValueClass(row, 'enemy')">{{formatRowValue(row.enemyValue, row)}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="wvw-summary-side-panels">
                    <div class="wvw-summary-side-column">
                        <div class="wvw-summary-side-panel">
                            <div class="wvw-summary-side-panel-title">Top 5 Squad Player Damage</div>
                            <div class="wvw-summary-side-panel-subtitle">Damage to enemy players. Click a player to see details.</div>
                            <button v-for="(player, index) in summary.topDamagePlayers" :key="'squad-' + player.playerIndex"
                                type="button" class="wvw-summary-top-player"
                                @click="openPlayerSummary(player.playerIndex)">
                                <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                                <img :src="player.icon" :alt="player.profession" class="icon"
                                    :data-original-title="player.profession">
                                <span class="wvw-summary-top-player-name" :data-original-title="getSquadPlayerTooltip(player)">{{player.name}}</span>
                                <span class="wvw-summary-top-player-damage">{{integerWithSpaces(player.amount)}}</span>
                            </button>
                            <div v-if="summary.topDamagePlayers.length === 0" class="wvw-summary-side-panel-empty">
                                No squad players were active for this phase.
                            </div>
                        </div>
                        <div class="wvw-summary-side-panel">
                            <div class="wvw-summary-side-panel-title">Top 5 Squad Player Boon Strips</div>
                            <div class="wvw-summary-side-panel-subtitle">Offensive boon strips. Click a player to see details.</div>
                            <button v-for="(player, index) in summary.topStripPlayers" :key="'squad-strip-' + player.playerIndex"
                                type="button" class="wvw-summary-top-player"
                                @click="openPlayerSummary(player.playerIndex)">
                                <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                                <img :src="player.icon" :alt="player.profession" class="icon"
                                    :data-original-title="player.profession">
                                <span class="wvw-summary-top-player-name" :data-original-title="getSquadPlayerTooltip(player)">{{player.name}}</span>
                                <span class="wvw-summary-top-player-damage">{{integerWithSpaces(player.amount)}}</span>
                            </button>
                            <div v-if="summary.topStripPlayers.length === 0" class="wvw-summary-side-panel-empty">
                                No squad players were active for this phase.
                            </div>
                        </div>
                    </div>
                    <div class="wvw-summary-side-column">
                        <div class="wvw-summary-side-panel">
                            <div class="wvw-summary-side-panel-title">Top 5 Enemy Player Damage</div>
                            <div class="wvw-summary-side-panel-subtitle">Damage to squad players. Click an enemy to see details.</div>
                            <button v-for="(player, index) in summary.topEnemyDamagePlayers" :key="'enemy-' + player.playerIndex"
                                type="button" class="wvw-summary-top-player"
                                @click="openTargetSummary(player.playerIndex)">
                                <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                                <img :src="player.icon" :alt="player.profession" class="icon"
                                    :data-original-title="player.profession">
                                <span class="wvw-summary-top-player-name" :data-original-title="player.name">{{player.name}}</span>
                                <span class="wvw-summary-top-player-damage">{{integerWithSpaces(player.amount)}}</span>
                            </button>
                            <div v-if="summary.topEnemyDamagePlayers.length === 0" class="wvw-summary-side-panel-empty">
                                No enemy players were active for this phase.
                            </div>
                        </div>
                        <div class="wvw-summary-side-panel">
                            <div class="wvw-summary-side-panel-title">Top 5 Enemy Player Boon Strips</div>
                            <div class="wvw-summary-side-panel-subtitle">Offensive boon strips. Click an enemy to see details.</div>
                            <button v-for="(player, index) in summary.topEnemyStripPlayers" :key="'enemy-strip-' + player.playerIndex"
                                type="button" class="wvw-summary-top-player"
                                @click="openTargetSummary(player.playerIndex)">
                                <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                                <img :src="player.icon" :alt="player.profession" class="icon"
                                    :data-original-title="player.profession">
                                <span class="wvw-summary-top-player-name" :data-original-title="player.name">{{player.name}}</span>
                                <span class="wvw-summary-top-player-damage">{{integerWithSpaces(player.amount)}}</span>
                            </button>
                            <div v-if="summary.topEnemyStripPlayers.length === 0" class="wvw-summary-side-panel-empty">
                                No enemy players were active for this phase.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div v-if="activeSummaryTab === 'metrics'" class="wvw-summary-bottom-panels">
                <div class="wvw-summary-side-panel">
                    <div class="wvw-summary-side-panel-title">Top 5 Squad Player Cleanses</div>
                    <div class="wvw-summary-side-panel-subtitle">Outgoing cleanses. Click a player to open Support Stats sorted by cleanses on squad mates.</div>
                    <button v-for="(player, index) in summary.topCleansePlayers" :key="'squad-cleanse-' + player.playerIndex"
                        type="button" class="wvw-summary-top-player"
                        @click="openSupportSummary(player.playerIndex)">
                        <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                        <img :src="player.icon" :alt="player.profession" class="icon"
                            :data-original-title="player.profession">
                        <span class="wvw-summary-top-player-name" :data-original-title="getSquadPlayerTooltip(player)">{{player.name}}</span>
                        <span class="wvw-summary-top-player-damage">{{integerWithSpaces(player.amount)}}</span>
                    </button>
                    <div v-if="summary.topCleansePlayers.length === 0" class="wvw-summary-side-panel-empty">
                        No squad players were active for this phase.
                    </div>
                </div>
                <div class="wvw-summary-side-panel">
                    <div class="wvw-summary-side-panel-title">Top 5 Squad Player Barrier</div>
                    <div class="wvw-summary-side-panel-subtitle">Outgoing barrier production. Click a player to open Player Healing Summary.</div>
                    <button v-for="(player, index) in summary.topBarrierPlayers" :key="'squad-barrier-' + player.playerIndex"
                        type="button" class="wvw-summary-top-player"
                        @click="openHealingSummary(player.playerIndex)">
                        <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                        <img :src="player.icon" :alt="player.profession" class="icon"
                            :data-original-title="player.profession">
                        <span class="wvw-summary-top-player-name" :data-original-title="getSquadPlayerTooltip(player)">{{player.name}}</span>
                        <span class="wvw-summary-top-player-damage">{{integerWithSpaces(player.amount)}}</span>
                    </button>
                    <div v-if="summary.hasBarrierData && summary.topBarrierPlayers.length === 0" class="wvw-summary-side-panel-empty">
                        No squad players were active for this phase.
                    </div>
                    <div v-if="!summary.hasBarrierData" class="wvw-summary-side-panel-empty">
                        Barrier add-on data is unavailable for this log.
                    </div>
                </div>
                <div class="wvw-summary-side-panel">
                    <div class="wvw-summary-side-panel-title">Top 5 Squad Healers</div>
                    <div class="wvw-summary-side-panel-subtitle">Outgoing healing. Click a player to open Player Healing Summary.</div>
                    <button v-for="(player, index) in summary.topHealingPlayers" :key="'squad-heal-' + player.playerIndex"
                        type="button" class="wvw-summary-top-player"
                        @click="openHealingSummary(player.playerIndex)">
                        <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                        <img :src="player.icon" :alt="player.profession" class="icon"
                            :data-original-title="player.profession">
                        <span class="wvw-summary-top-player-name" :data-original-title="getSquadPlayerTooltip(player)">{{player.name}}</span>
                        <span class="wvw-summary-top-player-damage">{{integerWithSpaces(player.amount)}}</span>
                    </button>
                    <div v-if="summary.hasHealingData && summary.topHealingPlayers.length === 0" class="wvw-summary-side-panel-empty">
                        No squad players were active for this phase.
                    </div>
                    <div v-if="!summary.hasHealingData" class="wvw-summary-side-panel-empty">
                        Healing add-on data is unavailable for this log.
                    </div>
                </div>
                <div class="wvw-summary-side-panel">
                    <div class="wvw-summary-side-panel-title">Top 5 Squad Player CC</div>
                    <div class="wvw-summary-side-panel-subtitle">Outgoing CC effects onto enemy players. Click a player to see the CCs used.</div>
                    <button v-for="(player, index) in summary.topCrowdControlPlayers" :key="'squad-cc-' + player.playerIndex"
                        type="button" class="wvw-summary-top-player"
                        @click="openCrowdControlDetails(player, 'Squad CC Details', false)">
                        <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                        <img :src="player.icon" :alt="player.profession" class="icon"
                            :data-original-title="player.profession">
                        <span class="wvw-summary-top-player-name" :data-original-title="getSquadPlayerTooltip(player)">{{player.name}}</span>
                        <span class="wvw-summary-top-player-damage">{{integerWithSpaces(player.amount)}}</span>
                    </button>
                    <div v-if="summary.hasCrowdControlData && summary.topCrowdControlPlayers.length === 0" class="wvw-summary-side-panel-empty">
                        No squad CC effects onto enemy players were recorded for this phase.
                    </div>
                    <div v-if="!summary.hasCrowdControlData" class="wvw-summary-side-panel-empty">
                        Crowd control event data is unavailable for this log.
                    </div>
                </div>
                <div class="wvw-summary-side-panel">
                    <div class="wvw-summary-side-panel-title">Top 5 Enemy Player CC</div>
                    <div class="wvw-summary-side-panel-subtitle">Outgoing CC effects onto squad players. Showing total and inferred effective CC. Click an enemy to see the CCs used.</div>
                    <button v-for="(player, index) in summary.topEnemyCrowdControlPlayers" :key="'enemy-cc-' + player.playerIndex"
                        type="button" class="wvw-summary-top-player"
                        @click="openCrowdControlDetails(player, 'Enemy CC Details', true)">
                        <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                        <img :src="player.icon" :alt="player.profession" class="icon"
                            :data-original-title="player.profession">
                        <span class="wvw-summary-top-player-name" :data-original-title="player.name">{{player.name}}</span>
                        <span class="wvw-summary-top-player-cc-values">
                            <span class="wvw-summary-top-player-damage">{{integerWithSpaces(player.amount)}} total</span>
                            <span class="wvw-summary-top-player-subvalue">{{integerWithSpaces(player.effectiveAmount)}} effective</span>
                        </span>
                    </button>
                    <div v-if="summary.hasCrowdControlData && summary.topEnemyCrowdControlPlayers.length === 0" class="wvw-summary-side-panel-empty">
                        No enemy CC effects onto squad players were recorded for this phase.
                    </div>
                    <div v-if="!summary.hasCrowdControlData" class="wvw-summary-side-panel-empty">
                        Crowd control event data is unavailable for this log.
                    </div>
                </div>
                <div v-for="section in topGroupBoonGenerationSections" :key="'boon-group-' + section.buffId" class="wvw-summary-side-panel">
                    <div class="wvw-summary-side-panel-title wvw-summary-boon-panel-title">
                        <img :src="section.icon" :alt="section.name" class="icon icon-hover">
                        <span>Top 5 Group {{section.name}} Generation</span>
                    </div>
                    <div class="wvw-summary-side-panel-subtitle">Click a player to open Buffs, Uptimes, Boons, Generation Group sorted by {{section.name}}.</div>
                    <button v-for="(player, index) in section.players" :key="'boon-group-' + section.buffId + '-' + player.playerIndex"
                        type="button" class="wvw-summary-top-player"
                        @click="openBoonGenerationSummary(player.playerIndex, section.buffId)">
                        <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                        <img :src="player.icon" :alt="player.profession" class="icon"
                            :data-original-title="player.profession">
                        <span class="wvw-summary-top-player-name" :data-original-title="getSquadPlayerTooltip(player)">{{player.name}}</span>
                        <span class="wvw-summary-top-player-damage">{{formatBoonGenerationValue(section, player.amount)}}</span>
                    </button>
                    <div v-if="section.players.length === 0" class="wvw-summary-side-panel-empty">
                        No squad players generated {{section.name}} for their group in this phase.
                    </div>
                </div>
            </div>
            <div v-if="activeSummaryTab === 'downs'" class="wvw-summary-downs-layout">
                <div class="wvw-summary-side-panel">
                    <div class="wvw-summary-side-panel-title">Down Outcomes</div>
                    <div class="wvw-summary-side-panel-subtitle">Tracks how often downs were converted into kills or rezzed back to alive, along with the timing of those outcomes.</div>
                    <table class="table table-sm table-striped table-hover wvw-summary-table" cellspacing="0" width="100%">
                        <thead>
                            <tr>
                                <th class="text-left wvw-summary-metric-column">Metric</th>
                                <th class="text-right">{{downsSquadLabel}}</th>
                                <th class="text-right">{{downsEnemyLabel}}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="row in summary.downsOutcomeRows" :key="'downs-outcome-' + row.label">
                                <td class="text-left wvw-summary-metric-column">{{row.label}}</td>
                                <td class="text-right" :class="getValueClass(row, 'squad')">
                                    <button v-if="hasDownsOutcomeEntries(row.label, 'squad')" type="button"
                                        class="wvw-summary-inline-link"
                                        @click.stop.prevent="openDownsOutcomePopup(row.label, 'squad')">
                                        {{formatRowValue(row.squadValue, row)}}
                                    </button>
                                    <span v-else>{{formatRowValue(row.squadValue, row)}}</span>
                                </td>
                                <td class="text-right" :class="getValueClass(row, 'enemy')">
                                    <button v-if="hasDownsOutcomeEntries(row.label, 'enemy')" type="button"
                                        class="wvw-summary-inline-link"
                                        @click.stop.prevent="openDownsOutcomePopup(row.label, 'enemy')">
                                        {{formatRowValue(row.enemyValue, row)}}
                                    </button>
                                    <span v-else>{{formatRowValue(row.enemyValue, row)}}</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="wvw-summary-side-panel">
                    <div class="wvw-summary-side-panel-title">Downed State Conditions</div>
                    <div class="wvw-summary-side-panel-subtitle">Shows which conditions were present when players entered downstate, including stack ranges for Vulnerability and Burning.</div>
                    <table class="table table-sm table-striped table-hover wvw-summary-table" cellspacing="0" width="100%">
                        <thead>
                            <tr>
                                <th class="text-left wvw-summary-metric-column">Metric</th>
                                <th class="text-right">{{downsSquadLabel}}</th>
                                <th class="text-right">{{downsEnemyLabel}}</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="row in summary.downedStateRows" :key="'down-state-' + row.label">
                                <td class="text-left wvw-summary-metric-column">{{row.label}}</td>
                                <td class="text-right" :class="getValueClass(row, 'squad')">
                                    <button v-if="hasDownDetailEntries(row.label, 'squad')" type="button"
                                        class="wvw-summary-inline-link"
                                        @click.stop.prevent="openDownDetailPopup(row.label, 'squad')">
                                        {{formatRowValue(row.squadValue, row)}}
                                    </button>
                                    <span v-else>{{formatRowValue(row.squadValue, row)}}</span>
                                </td>
                                <td class="text-right" :class="getValueClass(row, 'enemy')">
                                    <button v-if="hasDownDetailEntries(row.label, 'enemy')" type="button"
                                        class="wvw-summary-inline-link"
                                        @click.stop.prevent="openDownDetailPopup(row.label, 'enemy')">
                                        {{formatRowValue(row.enemyValue, row)}}
                                    </button>
                                    <span v-else>{{formatRowValue(row.enemyValue, row)}}</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div v-if="activeSummaryTab === 'moments'" class="wvw-summary-moments-layout">
                <div class="wvw-summary-side-panel wvw-summary-moments-panel">
                    <div class="wvw-summary-side-panel-title">Fight Turning Points</div>
                    <div class="wvw-summary-side-panel-subtitle">
                        <span v-if="combatReplayAvailable">Click a moment to jump Combat Replay to that point in the fight.</span>
                        <span v-else>Combat Replay is unavailable for this log, so moments cannot be jumped to.</span>
                    </div>
                    <div v-if="hasMoments()" class="wvw-summary-moments-body">
                        <div class="wvw-summary-moments-list">
                            <div v-for="(moment, index) in summary.moments"
                                :key="'moment-' + moment.time + '-' + index"
                                class="wvw-summary-moment-entry"
                                :class="[
                                    getMomentToneClass(moment),
                                    {'wvw-summary-moment-entry-highlighted': hoveredMomentIndex === index},
                                    {'wvw-summary-moment-entry-clickable': combatReplayAvailable}
                                ]"
                                :tabindex="combatReplayAvailable ? 0 : -1"
                                role="button"
                                @click="jumpToCombatReplay(moment)"
                                @keydown.enter.prevent="jumpToCombatReplay(moment)"
                                @keydown.space.prevent="jumpToCombatReplay(moment)">
                                <div class="wvw-summary-moment-side">
                                    <div class="wvw-summary-moment-odds" :title="getMomentWinOddsTitle(moment)">
                                        <div class="wvw-summary-moment-odds-ring" :style="getMomentWinOddsStyle(moment)">
                                            <div class="wvw-summary-moment-odds-core" :class="getMomentWinOddsClass(moment)">
                                                <span class="wvw-summary-moment-odds-value">{{getMomentWinOdds(moment)}}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="wvw-summary-moment-time">{{moment.timeLabel}}</div>
                                </div>
                                <div class="wvw-summary-moment-copy">
                                    <div class="wvw-summary-moment-line">
                                        <span class="wvw-summary-moment-label">{{moment.label}}</span>
                                        <span v-if="moment.detail" class="wvw-summary-moment-separator">&middot;</span>
                                        <span v-if="moment.detail" class="wvw-summary-moment-detail">{{moment.detail}}</span>
                                        <span v-if="moment.stateSummary" class="wvw-summary-moment-separator">&middot;</span>
                                        <span v-if="moment.stateSummary" class="wvw-summary-moment-state">{{moment.stateSummary}}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="wvw-summary-moments-timeline">
                            <div class="wvw-summary-moments-timeline-rail"></div>
                            <div v-for="tick in getTimelineTicks()"
                                :key="'moment-tick-' + tick.index"
                                class="wvw-summary-moments-timeline-tick"
                                :style="{ left: tick.left }">
                                <div class="wvw-summary-moments-timeline-tick-mark"></div>
                                <div class="wvw-summary-moments-timeline-tick-label">{{tick.label}}</div>
                            </div>
                            <template v-for="marker in getTimelineMarkers(summary.moments)">
                                <button
                                    :key="'moment-marker-' + marker.index"
                                    type="button"
                                    class="wvw-summary-moments-timeline-marker"
                                    :class="'wvw-summary-moments-timeline-marker-' + (marker.moment.tone || 'neutral')"
                                    :style="getTimelineMarkerStyle(marker)"
                                    @mouseenter="setHoveredMomentIndex(marker.index)"
                                    @mouseleave="clearHoveredMomentIndex()"
                                    @focus="setHoveredMomentIndex(marker.index)"
                                    @blur="clearHoveredMomentIndex()"
                                    @click="jumpToCombatReplay(marker.moment)">
                                </button>
                                <div
                                    :key="'moment-bubble-' + marker.index"
                                    class="wvw-summary-moments-timeline-bubble"
                                    :class="[
                                        'wvw-summary-moments-timeline-bubble-' + marker.side,
                                        'wvw-summary-moments-timeline-bubble-' + (marker.moment.tone || 'neutral'),
                                        {'wvw-summary-moments-timeline-bubble-highlighted': hoveredMomentIndex === marker.index}
                                    ]"
                                    :style="getTimelineBubbleStyle(marker)">
                                    {{marker.moment.label}}
                                </div>
                            </template>
                        </div>
                    </div>
                    <div v-if="!hasMoments()" class="wvw-summary-side-panel-empty">
                        No major turning points were identified for this phase.
                    </div>
                </div>
            </div>
            <div ref="downsModalBackdrop" class="wvw-summary-modal-backdrop" style="display: none;" @click.self="closeDownsModal">
                <div class="wvw-summary-modal">
                    <button type="button" class="wvw-summary-modal-close" @click="closeDownsModal" aria-label="Close">
                        &times;
                    </button>
                    <div ref="downsModalTitle" class="wvw-summary-modal-title"></div>
                    <div ref="downsModalSubtitle" class="wvw-summary-modal-subtitle"></div>
                    <div ref="downsModalList" class="wvw-summary-modal-list"></div>
                </div>
            </div>
            <div v-if="crowdControlPopup" class="wvw-summary-modal-backdrop" @click.self="closeCrowdControlDetails">
                <div class="wvw-summary-modal">
                    <button type="button" class="wvw-summary-modal-close" @click="closeCrowdControlDetails" aria-label="Close">
                        &times;
                    </button>
                    <div class="wvw-summary-modal-title">{{crowdControlPopup.title}}</div>
                    <div class="wvw-summary-modal-subtitle">
                        {{crowdControlPopup.player.name}} applied {{integerWithSpaces(crowdControlPopup.player.amount)}} CC effects
                        <span v-if="crowdControlPopup.showEffectiveCounts">and {{integerWithSpaces(crowdControlPopup.player.effectiveAmount)}} were inferred to affect the target</span>
                        for {{formatSeconds(crowdControlPopup.player.totalDuration)}} of total CC duration in this phase.
                    </div>
                    <div v-if="crowdControlPopup.player.skillDetails && crowdControlPopup.player.skillDetails.length > 0" class="wvw-summary-modal-list">
                        <div v-for="detail in crowdControlPopup.player.skillDetails" :key="'cc-detail-' + detail.skillId" class="wvw-summary-modal-row">
                            <div class="wvw-summary-modal-skill">
                                <img :src="detail.icon" :alt="detail.name" class="icon icon-hover">
                                <span class="wvw-summary-modal-skill-name">{{detail.name}}</span>
                            </div>
                            <div class="wvw-summary-modal-values">
                                <span class="wvw-summary-modal-count">{{integerWithSpaces(detail.count)}}<span v-if="crowdControlPopup.showEffectiveCounts"> total</span></span>
                                <span v-if="crowdControlPopup.showEffectiveCounts" class="wvw-summary-modal-effective">{{integerWithSpaces(detail.effectiveCount)}} effective</span>
                                <span class="wvw-summary-modal-duration">{{formatSeconds(detail.totalDuration)}}</span>
                            </div>
                        </div>
                    </div>
                    <div v-else class="wvw-summary-side-panel-empty">
                        Detailed CC skill information is unavailable for this player.
                    </div>
                    <div v-if="crowdControlPopup.showEffectiveCounts" class="wvw-summary-modal-note">
                        Effective CC is inferred from the target not having Stability at the CC timestamp.
                    </div>
                </div>
            </div>
        </div>
        <div v-else class="wvw-summary-empty">
            Summary data is unavailable for this phase.
        </div>
    </div>
</template>

<script>
    Vue.component("wvw-summary-component", {
        props: ["phaseindex"],
        template: `${template}`,
        mixins: [numberComponent, encounterPhaseComponent],
        beforeDestroy: function() {
            if (this.downsModalElements && this.downsModalElements.backdrop && this.downsModalElements.backdrop.parentNode) {
                this.downsModalElements.backdrop.parentNode.removeChild(this.downsModalElements.backdrop);
            }
            this.downsModalElements = null;
        },
        data: function() {
            return {
                activeSummaryTab: "overview",
                crowdControlPopup: null,
                downDetailPopup: null,
                downsOutcomePopup: null,
                hoveredMomentIndex: null,
                showStandoutsHelp: false,
            };
        },
        methods: {
            setSummarySubTab: function(tab) {
                this.activeSummaryTab = tab;
                if (tab !== "metrics") {
                    this.closeCrowdControlDetails();
                }
                if (tab !== "downs") {
                    this.closeDownDetailPopup();
                    this.closeDownsOutcomePopup();
                }
            },
            getBoonGenerationValue: function(buffData) {
                if (buffData instanceof Array) {
                    return buffData[0] || 0;
                }
                return 0;
            },
            getSquadPlayerTooltip: function(player) {
                if (player && player.acc) {
                    return player.name + " - " + player.acc;
                }
                if (player && player.account) {
                    return player.name + " - " + player.account;
                }
                return player ? player.name : "";
            },
            formatSeconds: function(value) {
                return this.round1(value) + "s";
            },
            formatEffectiveCount: function(value) {
                if (value == null || isNaN(value)) {
                    return "0";
                }
                return Math.abs(value - Math.round(value)) < 0.05
                    ? this.integerWithSpaces(Math.round(value))
                    : this.round1(value).toString();
            },
            formatBoonGenerationValue: function(section, value) {
                if (section.stacking) {
                    return Number.isInteger(value) ? this.integerWithSpaces(value) : this.round1(value).toString();
                }
                return this.round1(value) + "%";
            },
            formatRowValue: function(value, row) {
                if (row.equalValues) {
                    return value;
                }
                const parsed = parseFloat(value);
                if (isNaN(parsed)) {
                    return value;
                }
                let formatted = "";
                if (row.integerWithSpaces) {
                    formatted = this.integerWithSpaces(this.round(parsed));
                } else if (row.decimals === 1) {
                    formatted = this.round1(parsed).toString();
                } else if (row.decimals === 2) {
                    formatted = this.round2(parsed).toString();
                } else if (row.decimals === 3) {
                    formatted = this.round3(parsed).toString();
                } else {
                    formatted = this.integerWithSpaces(this.round(parsed));
                }
                return row.percentage ? formatted + "%" : formatted;
            },
            getMomentToneClass: function(moment) {
                if (!moment || !moment.tone) {
                    return "";
                }
                return "wvw-summary-moment-tone-" + moment.tone;
            },
            hasMoments: function() {
                return !!(this.summary && this.summary.moments && this.summary.moments.length > 0);
            },
            getMomentWinOdds: function(moment) {
                const squadAlive = moment && moment.squadAlive ? moment.squadAlive : 0;
                const enemyAlive = moment && moment.enemyAlive ? moment.enemyAlive : 0;
                const totalAlive = squadAlive + enemyAlive;
                const squadPercent = totalAlive <= 0 ? 50 : Math.round((squadAlive / totalAlive) * 100);
                return squadPercent + "%";
            },
            getMomentWinOddsStyle: function(moment) {
                const squadAlive = moment && moment.squadAlive ? moment.squadAlive : 0;
                const enemyAlive = moment && moment.enemyAlive ? moment.enemyAlive : 0;
                const totalAlive = squadAlive + enemyAlive;
                const squadPercent = totalAlive <= 0 ? 50 : (squadAlive / totalAlive) * 100;
                return {
                    background: "conic-gradient(from -90deg, rgba(74, 132, 100, 0.98) 0 " + squadPercent.toFixed(1) + "%, rgba(142, 72, 72, 0.98) " + squadPercent.toFixed(1) + "% 100%)"
                };
            },
            getMomentWinOddsClass: function(moment) {
                const squadAlive = moment && moment.squadAlive ? moment.squadAlive : 0;
                const enemyAlive = moment && moment.enemyAlive ? moment.enemyAlive : 0;
                if (squadAlive === enemyAlive) {
                    return "wvw-summary-moment-odds-core-even";
                }
                return squadAlive > enemyAlive ? "wvw-summary-moment-odds-core-our" : "wvw-summary-moment-odds-core-enemy";
            },
            getMomentWinOddsTitle: function(moment) {
                const squadAlive = moment && moment.squadAlive ? moment.squadAlive : 0;
                const enemyAlive = moment && moment.enemyAlive ? moment.enemyAlive : 0;
                return "Our Squad win odds from alive count: " + this.getMomentWinOdds(moment) + " (" + squadAlive + " alive vs " + enemyAlive + " alive)";
            },
            getTimelineMoments: function(moments) {
                if (!moments) {
                    return [];
                }
                return moments
                    .map(function(moment, index) {
                        return { moment: moment, index: index };
                    })
                    .filter(function(marker) {
                        return !marker.moment.category || marker.moment.category.indexOf("first-down") !== 0;
                    });
            },
            getTimelinePercent: function(moment) {
                const fightDurationMs = ((this.summary && this.summary.fightTimeSeconds) || 0) * 1000;
                const relativeTime = moment && moment.relativeTime ? moment.relativeTime : 0;
                return fightDurationMs <= 0 ? 0 : Math.max(0, Math.min(100, (relativeTime / fightDurationMs) * 100));
            },
            getTimelineMarkers: function(moments) {
                const filtered = this.getTimelineMoments(moments)
                    .map((marker) => {
                        const bubbleWidth = Math.max(4.6, Math.min(15.5, marker.moment.label.length * 0.42 + 1.6));
                        const rawLeft = this.getTimelinePercent(marker.moment);
                        const clampedLeft = Math.max(bubbleWidth / 2, Math.min(100 - bubbleWidth / 2, rawLeft));
                        return {
                            index: marker.index,
                            moment: marker.moment,
                            rawLeft: rawLeft,
                            left: clampedLeft,
                            bubbleWidth: bubbleWidth,
                        };
                    })
                    .sort((left, right) => left.left - right.left);
                if (filtered.length === 0) {
                    return [];
                }

                const laneGap = 1.0;
                const maxLanes = 6;
                const laneEnds = {
                    top: new Array(maxLanes).fill(-Infinity),
                    bottom: new Array(maxLanes).fill(-Infinity),
                };

                filtered.forEach((marker, index) => {
                    const preferredSide = index % 2 === 0 ? "top" : "bottom";
                    let bestPlacement = null;
                    ["top", "bottom"].forEach((side) => {
                        for (let lane = 0; lane < maxLanes; lane++) {
                            const start = marker.left - marker.bubbleWidth / 2;
                            const end = marker.left + marker.bubbleWidth / 2;
                            if (start >= laneEnds[side][lane] + laneGap) {
                                const penalty = lane * 10 + (side === preferredSide ? 0 : 1);
                                if (!bestPlacement || penalty < bestPlacement.penalty) {
                                    bestPlacement = {
                                        side: side,
                                        lane: lane,
                                        start: start,
                                        end: end,
                                        penalty: penalty,
                                    };
                                }
                                break;
                            }
                        }
                    });

                    if (!bestPlacement) {
                        const fallbackSide = preferredSide;
                        const fallbackLane = maxLanes - 1;
                        bestPlacement = {
                            side: fallbackSide,
                            lane: fallbackLane,
                            start: marker.left - marker.bubbleWidth / 2,
                            end: marker.left + marker.bubbleWidth / 2,
                        };
                    }

                    laneEnds[bestPlacement.side][bestPlacement.lane] = bestPlacement.end;
                    marker.side = bestPlacement.side;
                    marker.lane = bestPlacement.lane;
                });

                return filtered.sort((left, right) => left.index - right.index);
            },
            getTimelineMarkerStyle: function(marker) {
                return { left: marker.left.toFixed(2) + "%" };
            },
            getTimelineTicks: function() {
                const tickCount = 7;
                const fightDurationMs = ((this.summary && this.summary.fightTimeSeconds) || 0) * 1000;
                const ticks = [];
                for (let index = 0; index < tickCount; index++) {
                    const ratio = tickCount <= 1 ? 0 : index / (tickCount - 1);
                    ticks.push({
                        index: index,
                        left: (ratio * 100).toFixed(2) + "%",
                        label: this.formatTimelineTickTime(fightDurationMs * ratio),
                    });
                }
                return ticks;
            },
            formatTimelineTickTime: function(timeMs) {
                const totalSeconds = Math.max(0, Math.round(timeMs / 1000));
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                return minutes + ":" + seconds.toString().padStart(2, "0");
            },
            getTimelineBubbleStyle: function(marker) {
                const lineTop = 10.8;
                const laneOffset = 1.65;
                const bubbleOffset = marker.side === "top"
                    ? lineTop - (2.0 + marker.lane * laneOffset)
                    : lineTop + (1.45 + marker.lane * laneOffset);
                return {
                    left: marker.left.toFixed(2) + "%",
                    width: marker.bubbleWidth.toFixed(2) + "%",
                    top: bubbleOffset.toFixed(2) + "rem",
                };
            },
            setHoveredMomentIndex: function(index) {
                this.hoveredMomentIndex = index;
            },
            clearHoveredMomentIndex: function() {
                this.hoveredMomentIndex = null;
            },
            getValueClass: function(row, side) {
                if (row.equalValues) {
                    return {};
                }
                const squadValue = parseFloat(row.squadValue);
                const enemyValue = parseFloat(row.enemyValue);
                if (isNaN(squadValue) || isNaN(enemyValue) || squadValue === enemyValue) {
                    return {};
                }
                const squadLead = row.higherIsBetter ? squadValue > enemyValue : squadValue < enemyValue;
                return {
                    "wvw-summary-table-value-lead": (side === "squad" && squadLead) || (side === "enemy" && !squadLead),
                };
            },
            openPlayerSummary: function(playerIndex) {
                this.$emit("select-player", playerIndex);
            },
            openSupportSummary: function(playerIndex) {
                this.$emit("select-player-support", playerIndex);
            },
            openHealingSummary: function(playerIndex) {
                this.$emit("select-player-healing", playerIndex);
            },
            openBoonGenerationSummary: function(playerIndex, buffId) {
                this.$emit("select-player-boon-generation", {
                    playerIndex: playerIndex,
                    buffId: buffId,
                });
            },
            openCrowdControlDetails: function(player, title, showEffectiveCounts) {
                this.$set(this, "crowdControlPopup", {
                    title: title,
                    player: player,
                    showEffectiveCounts: !!showEffectiveCounts,
                });
                this.$forceUpdate();
            },
            closeCrowdControlDetails: function() {
                this.$set(this, "crowdControlPopup", null);
                this.$forceUpdate();
            },
            ensureDownsModalElements: function() {
                if (this.downsModalElements && this.downsModalElements.backdrop) {
                    return this.downsModalElements;
                }
                if (this.$refs && this.$refs.downsModalBackdrop && this.$refs.downsModalTitle && this.$refs.downsModalSubtitle && this.$refs.downsModalList) {
                    this.downsModalElements = {
                        backdrop: this.$refs.downsModalBackdrop,
                        title: this.$refs.downsModalTitle,
                        subtitle: this.$refs.downsModalSubtitle,
                        list: this.$refs.downsModalList,
                    };
                    return this.downsModalElements;
                }

                const backdrop = document.createElement("div");
                backdrop.className = "wvw-summary-modal-backdrop";
                backdrop.style.display = "none";
                backdrop.addEventListener("click", (event) => {
                    if (event.target === backdrop) {
                        this.closeDownsModal();
                    }
                });

                const modal = document.createElement("div");
                modal.className = "wvw-summary-modal";
                backdrop.appendChild(modal);

                const close = document.createElement("button");
                close.type = "button";
                close.className = "wvw-summary-modal-close";
                close.setAttribute("aria-label", "Close");
                close.innerHTML = "&times;";
                close.addEventListener("click", () => {
                    this.closeDownsModal();
                });
                modal.appendChild(close);

                const title = document.createElement("div");
                title.className = "wvw-summary-modal-title";
                modal.appendChild(title);

                const subtitle = document.createElement("div");
                subtitle.className = "wvw-summary-modal-subtitle";
                modal.appendChild(subtitle);

                const list = document.createElement("div");
                list.className = "wvw-summary-modal-list";
                modal.appendChild(list);

                document.body.appendChild(backdrop);
                this.downsModalElements = {
                    backdrop: backdrop,
                    title: title,
                    subtitle: subtitle,
                    list: list,
                };
                return this.downsModalElements;
            },
            clearDownsModalList: function() {
                const modalElements = this.ensureDownsModalElements();
                const list = modalElements ? modalElements.list : null;
                if (!list) {
                    return;
                }
                while (list.firstChild) {
                    list.removeChild(list.firstChild);
                }
            },
            setDownsModalVisible: function(visible) {
                const modalElements = this.ensureDownsModalElements();
                const backdrop = modalElements ? modalElements.backdrop : null;
                if (!backdrop) {
                    return;
                }
                backdrop.style.display = visible ? "" : "none";
            },
            showDownsModalEmptyState: function(message) {
                const modalElements = this.ensureDownsModalElements();
                const list = modalElements ? modalElements.list : null;
                if (!list) {
                    return;
                }
                const empty = document.createElement("div");
                empty.className = "wvw-summary-side-panel-empty";
                empty.textContent = message;
                list.appendChild(empty);
            },
            createDownsModalSkillElement: function(entry, tooltip) {
                const skill = document.createElement("div");
                skill.className = "wvw-summary-modal-skill";

                const icon = document.createElement("img");
                icon.src = entry.icon;
                icon.alt = entry.profession;
                icon.className = "icon";
                icon.setAttribute("data-original-title", entry.profession);
                skill.appendChild(icon);

                const name = document.createElement("span");
                name.className = "wvw-summary-modal-skill-name";
                name.textContent = entry.name;
                if (tooltip) {
                    name.setAttribute("data-original-title", tooltip);
                }
                skill.appendChild(name);
                return skill;
            },
            showDownsOutcomeModal: function(entries, popup) {
                const modalElements = this.ensureDownsModalElements();
                const title = modalElements ? modalElements.title : null;
                const subtitle = modalElements ? modalElements.subtitle : null;
                const list = modalElements ? modalElements.list : null;
                if (!title || !subtitle || !list) {
                    return;
                }
                title.textContent = popup.title;
                subtitle.textContent = popup.subtitle;
                this.clearDownsModalList();
                if (!entries || entries.length === 0) {
                    this.showDownsModalEmptyState("No events are available for this metric.");
                    this.setDownsModalVisible(true);
                    return;
                }
                entries.forEach((entry) => {
                    const row = document.createElement("div");
                    row.className = "wvw-summary-modal-row";
                    row.appendChild(this.createDownsModalSkillElement(entry, this.getDownsOutcomeEntryTooltip(entry, popup.side)));

                    const values = document.createElement("div");
                    values.className = "wvw-summary-modal-values";
                    if (entry.detailLabel) {
                        const secondary = document.createElement("span");
                        secondary.className = "wvw-summary-modal-secondary";
                        secondary.textContent = entry.detailLabel;
                        values.appendChild(secondary);
                    }
                    const duration = document.createElement("span");
                    duration.className = "wvw-summary-modal-duration";
                    duration.textContent = entry.timeLabel;
                    values.appendChild(duration);
                    row.appendChild(values);
                    list.appendChild(row);
                });
                this.setDownsModalVisible(true);
            },
            showDownDetailModal: function(entries, popup) {
                const modalElements = this.ensureDownsModalElements();
                const title = modalElements ? modalElements.title : null;
                const subtitle = modalElements ? modalElements.subtitle : null;
                const list = modalElements ? modalElements.list : null;
                if (!title || !subtitle || !list) {
                    return;
                }
                title.textContent = popup.title;
                subtitle.textContent = "Highest recorded stack value: "
                    + this.integerWithSpaces(popup.stackCount)
                    + ". "
                    + (this.combatReplayAvailable
                        ? "Click an entry to jump to Combat Replay at that down timestamp."
                        : "Combat Replay is unavailable for this log.");
                this.clearDownsModalList();
                if (!entries || entries.length === 0) {
                    this.showDownsModalEmptyState("No entries are available for this stack maximum.");
                    this.setDownsModalVisible(true);
                    return;
                }
                entries.forEach((entry) => {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "wvw-summary-modal-entry-button";
                    button.disabled = !this.combatReplayAvailable;
                    button.addEventListener("click", () => {
                        this.jumpToCombatReplay(entry);
                    });
                    button.appendChild(this.createDownsModalSkillElement(entry, this.getSquadPlayerTooltip(entry)));

                    const values = document.createElement("div");
                    values.className = "wvw-summary-modal-values";

                    const count = document.createElement("span");
                    count.className = "wvw-summary-modal-count";
                    count.textContent = this.integerWithSpaces(entry.stackCount) + " stacks";
                    values.appendChild(count);

                    const duration = document.createElement("span");
                    duration.className = "wvw-summary-modal-duration";
                    duration.textContent = entry.timeLabel;
                    values.appendChild(duration);

                    button.appendChild(values);
                    list.appendChild(button);
                });
                this.setDownsModalVisible(true);
            },
            closeDownsModal: function() {
                this.clearDownsModalList();
                this.setDownsModalVisible(false);
                this.$set(this, "downsOutcomePopup", null);
                this.$set(this, "downDetailPopup", null);
                this.$forceUpdate();
            },
            getDownDetailEntries: function(rowLabel, side) {
                if (!this.summary) {
                    return [];
                }
                if (rowLabel === "Vulnerability Max Stacks") {
                    return side === "enemy" ? (this.summary.enemyMaximumVulnerabilityEntries || []) : (this.summary.squadMaximumVulnerabilityEntries || []);
                }
                if (rowLabel === "Burning Max Stacks") {
                    return side === "enemy" ? (this.summary.enemyMaximumBurningEntries || []) : (this.summary.squadMaximumBurningEntries || []);
                }
                return [];
            },
            hasDownDetailEntries: function(rowLabel, side) {
                return this.getDownDetailEntries(rowLabel, side).length > 0;
            },
            getDownsOutcomeEntryTooltip: function(entry, side) {
                return side === "squad" ? this.getSquadPlayerTooltip(entry) : entry.name;
            },
            getDownsOutcomeEntries: function(rowLabel, side) {
                if (!this.summary) {
                    return [];
                }
                if (side === "squad") {
                    if (rowLabel === "Downs") {
                        return this.summary.squadDownEntries || [];
                    }
                    if (rowLabel === "Kill Conversions") {
                        return this.summary.squadKillConversionEntries || [];
                    }
                    if (rowLabel === "Rezzes") {
                        return this.summary.squadRezEntries || [];
                    }
                    return [];
                }
                if (rowLabel === "Downs") {
                    return this.summary.enemyDownEntries || [];
                }
                if (rowLabel === "Kill Conversions") {
                    return this.summary.enemyKillConversionEntries || [];
                }
                if (rowLabel === "Rezzes") {
                    return this.summary.enemyRezEntries || [];
                }
                return [];
            },
            hasDownsOutcomeEntries: function(rowLabel, side) {
                return this.getDownsOutcomeEntries(rowLabel, side).length > 0;
            },
            openDownsOutcomePopup: function(rowLabel, side) {
                const entries = this.getDownsOutcomeEntries(rowLabel, side);
                const sideLabel = side === "enemy" ? this.downsEnemyLabel : this.downsSquadLabel;
                this.closeCrowdControlDetails();
                this.$set(this, "downDetailPopup", null);
                this.$set(this, "downsOutcomePopup", {
                    key: rowLabel + "-" + side,
                    side: side,
                    title: rowLabel + " - " + sideLabel,
                    subtitle: rowLabel === "Kill Conversions"
                        ? sideLabel + " that ended in a kill. Each entry shows the kill time and when the player first went down."
                        : rowLabel === "Rezzes"
                            ? sideLabel + " that were rezzed back to alive. Each entry shows the rez time and when the player first went down."
                            : sideLabel + " recorded during this phase.",
                    entries: entries,
                });
                this.showDownsOutcomeModal(entries, this.downsOutcomePopup);
            },
            closeDownsOutcomePopup: function() {
                this.closeDownsModal();
            },
            openDownDetailPopup: function(rowLabel, side) {
                const entries = this.getDownDetailEntries(rowLabel, side);
                const sideLabel = side === "enemy" ? this.downsEnemyLabel : this.downsSquadLabel;
                this.closeCrowdControlDetails();
                this.$set(this, "downsOutcomePopup", null);
                this.$set(this, "downDetailPopup", {
                    key: rowLabel + "-" + side,
                    title: rowLabel + " - " + sideLabel,
                    stackCount: entries.length > 0 ? entries[0].stackCount : 0,
                    entries: entries,
                });
                this.showDownDetailModal(entries, this.downDetailPopup);
            },
            closeDownDetailPopup: function() {
                this.closeDownsModal();
            },
            jumpToCombatReplay: function(entry) {
                const component = this;
                if (!entry || !this.combatReplayAvailable) {
                    return;
                }
                this.$root.mode = 1;
                this.$root.$nextTick(function() {
                    setTimeout(function() {
                        if (!animator) {
                            return;
                        }
                        animator.stopAnimate(true);
                        if (entry.uniqueId != null && entry.uniqueId > 0) {
                            animator.selectActor(entry.uniqueId);
                        }
                        animator.updateTime(entry.time);
                        animator.updateTextInput();
                        component.closeDownDetailPopup();
                    }, 0);
                });
            },
            openTargetSummary: function(targetIndex) {
                this.$emit("select-target", targetIndex);
            }
        },
        computed: {
            phase: function() {
                return logData.phases[this.phaseindex];
            },
            summary: function() {
                return this.phase.wvwSummary;
            },
            enemyGroupFormation: function() {
                if (!this.summary || !this.summary.oppositionEstimate || !this.summary.oppositionEstimate.formationLabel) {
                    return "Unavailable";
                }
                return this.summary.oppositionEstimate.formationLabel;
            },
            playerCountStatusKey: function() {
                if (!this.summary || !this.summary.squad || !this.summary.enemy) {
                    return "unknown";
                }
                const alliedEffectiveCount = this.summary.effectiveAlliedPlayerCount || this.summary.squad.playerCount;
                const difference = alliedEffectiveCount - this.summary.enemy.playerCount;
                if (Math.abs(difference) <= 5) {
                    return "even";
                }
                return difference > 0 ? "superior" : "outnumbered";
            },
            playerCountStatusLabel: function() {
                if (this.playerCountStatusKey === "superior") {
                    return "Superior Numbers";
                }
                if (this.playerCountStatusKey === "outnumbered") {
                    return "Outnumbered";
                }
                if (this.playerCountStatusKey === "even") {
                    return "Even Numbers";
                }
                return "Unavailable";
            },
            numbersStatusToneClass: function() {
                if (this.playerCountStatusKey === "superior") {
                    return "wvw-summary-header-status-strong";
                }
                if (this.playerCountStatusKey === "outnumbered") {
                    return "wvw-summary-header-status-weak";
                }
                if (this.playerCountStatusKey === "even") {
                    return "wvw-summary-header-status-even";
                }
                return "";
            },
            playerCountSupporting: function() {
                if (!this.summary || !this.summary.squad || !this.summary.enemy) {
                    return "Unavailable";
                }
                const squadCount = this.summary.squad.playerCount || 0;
                const friendlyCount = this.summary.friendlyPlayerCount || 0;
                const alliedEffectiveCount = this.summary.effectiveAlliedPlayerCount || squadCount;
                const enemyCount = this.summary.enemy.playerCount || 0;
                const alliedSummary = friendlyCount > 0
                    ? squadCount + " squad + " + friendlyCount + " friendlies (" + this.formatEffectiveCount(alliedEffectiveCount) + " effective)"
                    : squadCount + " squad";
                return alliedSummary + " vs " + enemyCount + " enemy";
            },
            numbersAdjustmentLabel: function() {
                if (!this.summary || !this.summary.squadGrade) {
                    return "Unavailable";
                }
                const adjustment = this.summary.squadGrade.countAdjustment || 0;
                if (adjustment > 0) {
                    return "+" + adjustment + " to squad estimate";
                }
                if (adjustment < 0) {
                    return adjustment + " to squad estimate";
                }
                return "No numbers adjustment";
            },
            winnerLabel: function() {
                if (!this.summary || !this.summary.squad || !this.summary.enemy) {
                    return "Unavailable";
                }
                if (this.summary.squad.kills !== this.summary.enemy.kills) {
                    return this.summary.squad.kills > this.summary.enemy.kills ? this.summary.squad.label : this.summary.enemy.label;
                }
                if (this.summary.squad.downs !== this.summary.enemy.downs) {
                    return this.summary.squad.downs > this.summary.enemy.downs ? this.summary.squad.label : this.summary.enemy.label;
                }
                if (this.summary.squad.deaths !== this.summary.enemy.deaths) {
                    return this.summary.squad.deaths < this.summary.enemy.deaths ? this.summary.squad.label : this.summary.enemy.label;
                }
                if (this.summary.squad.damage !== this.summary.enemy.damage) {
                    return this.summary.squad.damage > this.summary.enemy.damage ? this.summary.squad.label : this.summary.enemy.label;
                }
                return "Draw";
            },
            combatReplayAvailable: function() {
                return !!crData;
            },
            downsSquadLabel: function() {
                return "Our Squad's Downs";
            },
            downsEnemyLabel: function() {
                return "Enemy Team's Downs";
            },
            topGroupBoonGenerationSections: function() {
                if (!this.summary || !this.phase.buffsStatContainer) {
                    return [];
                }

                const players = getActiveNonFakePlayersForPhase(this.encounterPhase);
                const groupStats = this.phase.buffsStatContainer.boonGenGroupStats || [];
                const sections = [];

                for (let i = 0; i < logData.boons.length; i++) {
                    const buffId = logData.boons[i];
                    const buff = findSkill(true, buffId);
                    if (!buff || buff.name === "Alacrity") {
                        continue;
                    }

                    const topPlayers = [];
                    for (let j = 0; j < groupStats.length && j < players.length; j++) {
                        const player = players[j];
                        if (!player || player.notInSquad) {
                            continue;
                        }

                        const playerBuffData = groupStats[j] && groupStats[j].data ? groupStats[j].data[i] : null;
                        const amount = this.getBoonGenerationValue(playerBuffData);
                        if (amount <= 0) {
                            continue;
                        }

                        topPlayers.push({
                            playerIndex: typeof player.id === "number" ? player.id : j,
                            name: player.name,
                            acc: player.acc,
                            profession: player.profession,
                            icon: player.icon,
                            amount: amount,
                        });
                    }

                    topPlayers.sort((a, b) => (b.amount - a.amount) || a.name.localeCompare(b.name));
                    if (topPlayers.length > 0) {
                        sections.push({
                            buffId: buffId,
                            name: buff.name,
                            icon: buff.icon,
                            stacking: !!buff.stacking,
                            players: topPlayers.slice(0, 5),
                        });
                    }
                }

                return sections;
            }
        }
    });
</script>
