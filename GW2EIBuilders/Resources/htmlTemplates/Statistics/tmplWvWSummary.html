        computed: {
            phase: function() {
                return logData.phases[this.phaseindex];
            },
            phaseIndexValue: function() {
                return parseInt(this.phaseindex, 10) || 0;
            },
            phaseList: function() {
                if (!logData || !logData.phases) {
                    return [];
                }
                return logData.phases.map(function(phase, index) {
                    return {
                        index: index,
                        name: phase && phase.name ? phase.name : ("Phase " + (index + 1)),
                    };
                });
            },
            summary: function() {
                return this.phase.wvwSummary;
            },
            overviewStandoutCards: function() {
                const cards = [];
                const overallEntries = this.getOverallImpactStandoutEntries();
                if (overallEntries.length > 0) {
                    cards.push({
                        key: "overallImpact",
                        label: "Fight Impact",
                        detail: "Top demand-adjusted visible contribution across all replay contribution lanes in this fight.",
                        entries: overallEntries,
                    });
                }
                const laneCards = [
                    { key: "pressure", label: "Pressure", detail: "Top pre-down pressure on live targets before enemy players fell." },
                    { key: "conversion", label: "Conversion", detail: "Top visible contribution to turning enemy downs into kills." },
                    { key: "strip", label: "Strip", detail: "Top boon removal timed into pressure and conversion windows." },
                    { key: "control", label: "Control", detail: "Top effective crowd control and control-condition disruption." },
                    { key: "boonSupport", label: "Boon Support", detail: "Top offensive and defensive boon support in key windows." },
                    { key: "recovery", label: "Recovery", detail: "Top healing, cleansing, and response-window stabilization after damage landed." },
                    { key: "prevention", label: "Prevention", detail: "Top barrier, attributed negation, pet/minion absorption, and other pre-hit mitigation." },
                    { key: "rez", label: "Rez", detail: "Top help on successful ally recoveries after downstate." },
                ];
                laneCards.forEach(card => {
                    const entries = this.getOverviewStandoutEntriesForLane(card.key);
                    if (entries.length > 0) {
                        cards.push({
                            key: card.key,
                            label: card.label,
                            detail: card.detail,
                            entries: entries,
                        });
                    }
                });
                return cards;
            },
            overviewStandoutsSummary: function() {
                if (this.overviewStandoutCards.length === 0) {
                    return "";
                }
                return "Top 3 players by replay-visible contribution lane, plus demand-adjusted fight impact.";
            },
            fightDemand: function() {
                const analysis = typeof crData !== "undefined" && crData && crData.analysis ? crData.analysis : null;
                return analysis && analysis.fightDemand ? analysis.fightDemand : null;
            },
            specCapabilities: function() {
                const analysis = typeof crData !== "undefined" && crData && crData.analysis ? crData.analysis : null;
                if (!analysis || !analysis.specCapabilities) {
                    return [];
                }
                return [...analysis.specCapabilities].sort((left, right) => {
                    if (right.activeSharePercent !== left.activeSharePercent) {
                        return right.activeSharePercent - left.activeSharePercent;
                    }
                    return left.label.localeCompare(right.label);
                });
            },
            weightedBoonProviderSections: function() {
                const analysis = typeof crData !== "undefined" && crData && crData.analysis ? crData.analysis : null;
                const threatBoons = analysis && analysis.threatBoons ? analysis.threatBoons : null;
                if (!threatBoons || !threatBoons.boons || !this.phase || !this.phase.buffsStatContainer || !logData || !logData.boons) {
                    return [];
                }

                const players = getActiveNonFakePlayersForPhase(this.encounterPhase);
                const squadStats = this.phase.buffsStatContainer.boonGenSquadStats || [];
                const buffIndexById = new Map();
                for (let i = 0; i < logData.boons.length; i++) {
                    buffIndexById.set(logData.boons[i], i);
                }

                return threatBoons.boons
                    .filter(boon => boon && boon.name !== "Alacrity")
                    .map(boon => {
                        const buffIndex = buffIndexById.has(boon.id) ? buffIndexById.get(boon.id) : -1;
                        const providersBySpec = new Map();

                        if (buffIndex >= 0) {
                            for (let i = 0; i < players.length && i < squadStats.length; i++) {
                                const player = players[i];
                                if (!player || player.notInSquad) {
                                    continue;
                                }

                                const playerBuffData = squadStats[i] && squadStats[i].data ? squadStats[i].data[buffIndex] : null;
                                const amount = this.getBoonGenerationValue(playerBuffData);
                                if (amount <= 0) {
                                    continue;
                                }

                                const key = player.profession || "Unknown";
                                if (!providersBySpec.has(key)) {
                                    providersBySpec.set(key, {
                                        key: key,
                                        label: key,
                                        icon: player.icon || "",
                                        amount: 0,
                                    });
                                }
                                providersBySpec.get(key).amount += amount;
                            }
                        }

                        const sectionShape = { stacking: !!boon.stackBased };
                        const providers = Array.from(providersBySpec.values())
                            .sort((left, right) => {
                                if (right.amount !== left.amount) {
                                    return right.amount - left.amount;
                                }
                                return left.label.localeCompare(right.label);
                            });
                        const totalAmount = providers.reduce((sum, provider) => sum + provider.amount, 0);

                        return {
                            buffId: boon.id,
                            name: boon.name,
                            icon: boon.icon,
                            stacking: !!boon.stackBased,
                            summaryCoverage: boon.summaryCoverage || 0,
                            summaryAverageStacks: boon.summaryAverageStacks || 0,
                            providers: providers.map(provider => ({
                                key: provider.key,
                                label: provider.label,
                                icon: provider.icon,
                                amount: provider.amount,
                                formattedAmount: this.formatBoonGenerationValue(sectionShape, provider.amount),
                                sharePercent: totalAmount > 0 ? (provider.amount * 100.0 / totalAmount) : 0,
                                color: this.getBoonProviderColor(provider.label),
                            })),
                        };
                    });
            },
            boonProviderProfiles: function() {
                if (!this.weightedBoonProviderSections || this.weightedBoonProviderSections.length === 0) {
                    return [];
                }
                const profilesByKey = new Map();
                const boonOrder = new Map();
                this.weightedBoonProviderSections.forEach((section, index) => {
                    boonOrder.set(section.buffId, index);
                    section.providers.forEach(provider => {
                        if (!profilesByKey.has(provider.key)) {
                            profilesByKey.set(provider.key, {
                                key: provider.key,
                                label: provider.label,
                                icon: provider.icon,
                                totalSharePercent: 0,
                                boonsById: new Map(),
                            });
                        }
                        const profile = profilesByKey.get(provider.key);
                        profile.totalSharePercent += provider.sharePercent;
                        profile.boonsById.set(section.buffId, {
                            buffId: section.buffId,
                            name: section.name,
                            icon: section.icon,
                            sharePercent: provider.sharePercent,
                        });
                    });
                });

                return Array.from(profilesByKey.values())
                    .map(profile => {
                        const boons = this.weightedBoonProviderSections
                            .map(section => profile.boonsById.get(section.buffId) || {
                                buffId: section.buffId,
                                name: section.name,
                                icon: section.icon,
                                sharePercent: 0,
                            })
                            .sort((left, right) => {
                                if (right.sharePercent !== left.sharePercent) {
                                    return right.sharePercent - left.sharePercent;
                                }
                                return (boonOrder.get(left.buffId) || 0) - (boonOrder.get(right.buffId) || 0);
                            });
                        return {
                            key: profile.key,
                            label: profile.label,
                            icon: profile.icon,
                            totalSharePercent: profile.totalSharePercent,
                            boons: boons,
                            topBoons: boons.filter(boon => boon.sharePercent > 0).slice(0, 3),
                        };
                    })
                    .sort((left, right) => {
                        if (right.totalSharePercent !== left.totalSharePercent) {
                            return right.totalSharePercent - left.totalSharePercent;
                        }
                        return left.label.localeCompare(right.label);
                    });
            },
            selectedBoonProviderProfiles: function() {
                if (!this.boonProviderProfiles || this.boonProviderProfiles.length === 0) {
                    return [];
                }
                const selectedKeys = Array.isArray(this.selectedBoonProviderKeys) ? this.selectedBoonProviderKeys : [];
                const selectedProfiles = this.boonProviderProfiles.filter(profile => selectedKeys.includes(profile.key));
                return selectedProfiles.length > 0 ? selectedProfiles : [this.boonProviderProfiles[0]];
            },
            boonProviderComparisonRows: function() {
                if (!this.selectedBoonProviderProfiles || this.selectedBoonProviderProfiles.length === 0) {
                    return [];
                }
                return this.weightedBoonProviderSections
                    .map(section => {
                        const entries = this.selectedBoonProviderProfiles.map(profile => {
                            const boon = profile.boons.find(candidate => candidate.buffId === section.buffId) || {
                                buffId: section.buffId,
                                name: section.name,
                                icon: section.icon,
                                sharePercent: 0,
                            };
                            return {
                                key: profile.key,
                                label: profile.label,
                                icon: profile.icon,
                                sharePercent: boon.sharePercent || 0,
                            };
                        });
                        return {
                            buffId: section.buffId,
                            name: section.name,
                            icon: section.icon,
                            maxSharePercent: entries.reduce((maxValue, entry) => Math.max(maxValue, entry.sharePercent || 0), 0),
                            entries: entries.sort((left, right) => {
                                if (right.sharePercent !== left.sharePercent) {
                                    return right.sharePercent - left.sharePercent;
                                }
                                return left.label.localeCompare(right.label);
                            }),
                        };
                    })
                    .sort((left, right) => {
                        if (right.maxSharePercent !== left.maxSharePercent) {
                            return right.maxSharePercent - left.maxSharePercent;
                        }
                        return left.name.localeCompare(right.name);
                    });
            },
            selectedBoonProviderProfile: function() {
                if (!this.boonProviderProfiles || this.boonProviderProfiles.length === 0) {
                    return null;
                }
                return this.boonProviderProfiles.find(profile => profile.key === this.selectedBoonProviderKey) || this.boonProviderProfiles[0];
            },
            fightDemandSummary: function() {
                if (!this.fightDemand || !this.fightDemand.lanes || this.fightDemand.lanes.length === 0) {
                    return "";
                }
                const lanes = this.fightDemand.lanes;
                const highDemandLanes = lanes.filter(lane => lane.demandScorePercent >= 55);
                if (highDemandLanes.length > 0) {
                    return "Higher replay-visible demand: " + highDemandLanes.slice(0, 3).map(lane => lane.label).join(", ") + ".";
                }
                const relativeLanes = lanes.slice(0, 3).map(lane => lane.label);
                if ((lanes[0].demandScorePercent || 0) >= 30) {
                    return "Demand was fairly even, with the most relative emphasis on " + relativeLanes.join(", ") + ".";
                }
                return "Replay-visible demand stayed low across all lanes; the badges show relative emphasis rather than absolute priority.";
            },
            playerCountStatusKey: function() {
                if (!this.summary || !this.summary.squad || !this.summary.enemy) {
                    return "unknown";
                }
                const alliedEffectiveCount = this.summary.effectiveAlliedPlayerCount || this.summary.squad.playerCount;
                const difference = alliedEffectiveCount - this.summary.enemy.playerCount;
                if (Math.abs(difference) <= 5) {
                    return "even";
                }
                return difference > 0 ? "superior" : "outnumbered";
            },
            playerCountStatusLabel: function() {
                if (this.playerCountStatusKey === "superior") {
                    return "Superior Numbers";
                }
                if (this.playerCountStatusKey === "outnumbered") {
                    return "Outnumbered";
                }
                if (this.playerCountStatusKey === "even") {
                    return "Even Numbers";
                }
                return "Unavailable";
            },
            numbersStatusToneClass: function() {
                if (this.playerCountStatusKey === "superior") {
                    return "wvw-summary-header-status-strong";
                }
                if (this.playerCountStatusKey === "outnumbered") {
                    return "wvw-summary-header-status-weak";
                }
                if (this.playerCountStatusKey === "even") {
                    return "wvw-summary-header-status-even";
                }
                return "";
            },
            playerCountSupporting: function() {
                if (!this.summary || !this.summary.squad || !this.summary.enemy) {
                    return "Unavailable";
                }
                const squadCount = this.summary.squad.playerCount || 0;
                const friendlyCount = this.summary.friendlyPlayerCount || 0;
                const alliedEffectiveCount = this.summary.effectiveAlliedPlayerCount || squadCount;
                const enemyCount = this.summary.enemy.playerCount || 0;
                const alliedSummary = friendlyCount > 0
                    ? squadCount + " squad + " + friendlyCount + " friendlies (" + this.formatEffectiveCount(alliedEffectiveCount) + " effective)"
                    : squadCount + " squad";
                return alliedSummary + " vs " + enemyCount + " enemy";
            },
            winnerLabel: function() {
                if (!this.summary || !this.summary.squad || !this.summary.enemy) {
                    return "Unavailable";
                }
                if (this.summary.squad.kills !== this.summary.enemy.kills) {
                    return this.summary.squad.kills > this.summary.enemy.kills ? this.summary.squad.label : this.summary.enemy.label;
                }
                if (this.summary.squad.downs !== this.summary.enemy.downs) {
                    return this.summary.squad.downs > this.summary.enemy.downs ? this.summary.squad.label : this.summary.enemy.label;
                }
                if (this.summary.squad.deaths !== this.summary.enemy.deaths) {
                    return this.summary.squad.deaths < this.summary.enemy.deaths ? this.summary.squad.label : this.summary.enemy.label;
                }
                if (this.summary.squad.damage !== this.summary.enemy.damage) {
                    return this.summary.squad.damage > this.summary.enemy.damage ? this.summary.squad.label : this.summary.enemy.label;
                }
                return "Draw";
            },
            combatReplayAvailable: function() {
                return !!crData;
            },
            downsSquadLabel: function() {
                return "Our Squad's Downs";
            },
            downsEnemyLabel: function() {
                return "Enemy Team's Downs";
            },
            topGroupBoonGenerationSections: function() {
                if (!this.summary || !this.phase.buffsStatContainer) {
                    return [];
                }

                const players = getActiveNonFakePlayersForPhase(this.encounterPhase);
                const groupStats = this.phase.buffsStatContainer.boonGenGroupStats || [];
                const sections = [];

                for (let i = 0; i < logData.boons.length; i++) {
                    const buffId = logData.boons[i];
                    const buff = findSkill(true, buffId);
                    if (!buff || buff.name === "Alacrity") {
                        continue;
                    }

                    const topPlayers = [];
                    for (let j = 0; j < groupStats.length && j < players.length; j++) {
                        const player = players[j];
                        if (!player || player.notInSquad) {
                            continue;
                        }

                        const playerBuffData = groupStats[j] && groupStats[j].data ? groupStats[j].data[i] : null;
                        const amount = this.getBoonGenerationValue(playerBuffData);
                        if (amount <= 0) {
                            continue;
                        }

                        topPlayers.push({
                            playerIndex: typeof player.id === "number" ? player.id : j,
                            name: player.name,
                            acc: player.acc,
                            profession: player.profession,
                            icon: player.icon,
                            amount: amount,
                        });
                    }

                    topPlayers.sort((a, b) => (b.amount - a.amount) || a.name.localeCompare(b.name));
                    if (topPlayers.length > 0) {
                        sections.push({
                            buffId: buffId,
                            name: buff.name,
                            icon: buff.icon,
                            stacking: !!buff.stacking,
                            players: topPlayers.slice(0, 5),
                        });
                    }
                }

                return sections;
            }
        }
    });
</script>
