<script>
    Vue.component("wvw-summary-component", {
        props: ["phaseindex"],
        template: `${template}`,
        mixins: [numberComponent, encounterPhaseComponent],
        methods: {
            getBoonGenerationValue: function(buffData) {
                if (buffData instanceof Array) {
                    return buffData[0] || 0;
                }
                return 0;
            },
            formatBoonGenerationValue: function(section, value) {
                if (section.stacking) {
                    return Number.isInteger(value) ? this.integerWithSpaces(value) : this.round1(value).toString();
                }
                return this.round1(value) + "%";
            },
            formatRowValue: function(value, row) {
                if (row.equalValues) {
                    return value;
                }
                const parsed = parseFloat(value);
                if (isNaN(parsed)) {
                    return value;
                }
                let formatted = "";
                if (row.integerWithSpaces) {
                    formatted = this.integerWithSpaces(this.round(parsed));
                } else if (row.decimals === 1) {
                    formatted = this.round1(parsed).toString();
                } else if (row.decimals === 2) {
                    formatted = this.round2(parsed).toString();
                } else if (row.decimals === 3) {
                    formatted = this.round3(parsed).toString();
                } else {
                    formatted = this.integerWithSpaces(this.round(parsed));
                }
                return row.percentage ? formatted + "%" : formatted;
            },
            getValueClass: function(row, side) {
                if (row.equalValues) {
                    return {};
                }
                const squadValue = parseFloat(row.squadValue);
                const enemyValue = parseFloat(row.enemyValue);
                if (isNaN(squadValue) || isNaN(enemyValue) || squadValue === enemyValue) {
                    return {};
                }
                const squadLead = row.higherIsBetter ? squadValue > enemyValue : squadValue < enemyValue;
                return {
                    "wvw-summary-table-value-lead": (side === "squad" && squadLead) || (side === "enemy" && !squadLead),
                };
            },
            openPlayerSummary: function(playerIndex) {
                this.$emit("select-player", playerIndex);
            },
            openSupportSummary: function(playerIndex) {
                this.$emit("select-player-support", playerIndex);
            },
            openHealingSummary: function(playerIndex) {
                this.$emit("select-player-healing", playerIndex);
            },
            openBoonGenerationSummary: function(playerIndex, buffId) {
                this.$emit("select-player-boon-generation", {
                    playerIndex: playerIndex,
                    buffId: buffId,
                });
            },
            openTargetSummary: function(targetIndex) {
                this.$emit("select-target", targetIndex);
            }
        },
        computed: {
            phase: function() {
                return logData.phases[this.phaseindex];
            },
            summary: function() {
                return this.phase.wvwSummary;
            },
            topGroupBoonGenerationSections: function() {
                if (!this.summary || !this.phase.buffsStatContainer) {
                    return [];
                }

                const players = getActiveNonFakePlayersForPhase(this.encounterPhase);
                const groupStats = this.phase.buffsStatContainer.boonGenGroupStats || [];
                const sections = [];

                for (let i = 0; i < logData.boons.length; i++) {
                    const buffId = logData.boons[i];
                    const buff = findSkill(true, buffId);
                    if (!buff || buff.name === "Alacrity") {
                        continue;
                    }

                    const topPlayers = [];
                    for (let j = 0; j < groupStats.length && j < players.length; j++) {
                        const player = players[j];
                        if (!player || player.notInSquad) {
                            continue;
                        }

                        const playerBuffData = groupStats[j] && groupStats[j].data ? groupStats[j].data[i] : null;
                        const amount = this.getBoonGenerationValue(playerBuffData);
                        if (amount <= 0) {
                            continue;
                        }

                        topPlayers.push({
                            playerIndex: typeof player.id === "number" ? player.id : j,
                            name: player.name,
                            profession: player.profession,
                            icon: player.icon,
                            amount: amount,
                        });
                    }

                    topPlayers.sort((a, b) => (b.amount - a.amount) || a.name.localeCompare(b.name));
                    if (topPlayers.length > 0) {
                        sections.push({
                            buffId: buffId,
                            name: buff.name,
                            icon: buff.icon,
                            stacking: !!buff.stacking,
                            players: topPlayers.slice(0, 5),
                        });
                    }
                }

                return sections;
            }
        }
    });
</script>
