<template>
    <div ref="summaryRoot">
        <div v-if="summary" class="wvw-summary-panel">
            <div class="wvw-summary-header">
                <div class="wvw-summary-header-title">WvW Fight Summary</div>
                <div class="wvw-summary-header-layout">
                    <div class="wvw-summary-header-spotlight">
                        <div class="wvw-summary-header-kicker">Player Count</div>
                        <div class="wvw-summary-header-spotlight-row">
                            <span class="wvw-summary-header-status" :class="numbersStatusToneClass">{{playerCountStatusLabel}}</span>
                        </div>
                        <div class="wvw-summary-header-spotlight-value">{{playerCountSupporting}}</div>
                        <div class="wvw-summary-header-spotlight-note">Numbers context treats 3 friendlies as 1 squad player.</div>
                    </div>
                    <div class="wvw-summary-header-facts">
                        <div class="wvw-summary-header-fact">
                            <span class="wvw-summary-header-fact-label">Fight Time</span>
                            <span class="wvw-summary-header-fact-value">{{summary.fightTime}}</span>
                        </div>
                        <div class="wvw-summary-header-fact">
                            <span class="wvw-summary-header-fact-label">Winner</span>
                            <span class="wvw-summary-header-fact-value">{{winnerLabel}}</span>
                        </div>
                    </div>
                </div>
                <div class="wvw-summary-header-detail">{{summary.healStatsNotice}}</div>
                <div v-if="phaseList.length > 0" class="wvw-summary-header-phases">
                    <span class="wvw-summary-header-phases-label">Phases</span>
                    <div class="wvw-summary-header-phase-list">
                        <span v-for="phaseEntry in phaseList" :key="'wvw-summary-phase-' + phaseEntry.index"
                            class="wvw-summary-header-phase-chip"
                            :class="{'active': phaseEntry.index === phaseIndexValue}">
                            {{phaseEntry.name}}
                        </span>
                    </div>
                </div>
            </div>
            <div class="wvw-summary-subtabs">
                <button type="button" class="wvw-summary-subtab" :class="{'active': activeSummaryTab === 'overview'}"
                    @click="setSummarySubTab('overview')">
                    Overview
                </button>
                <button type="button" class="wvw-summary-subtab" :class="{'active': activeSummaryTab === 'specs'}"
                    @click="setSummarySubTab('specs')">
                    Specs
                </button>
                <button type="button" class="wvw-summary-subtab" :class="{'active': activeSummaryTab === 'boons'}"
                    @click="setSummarySubTab('boons')">
                    Boons
                </button>
                <button type="button" class="wvw-summary-subtab" :class="{'active': activeSummaryTab === 'metrics'}"
                    @click="setSummarySubTab('metrics')">
                    Metrics
                </button>
                <button type="button" class="wvw-summary-subtab" :class="{'active': activeSummaryTab === 'downs'}"
                    @click="setSummarySubTab('downs')">
                    Downs
                </button>
                <button type="button" class="wvw-summary-subtab" :class="{'active': activeSummaryTab === 'moments'}"
                    @click="setSummarySubTab('moments')">
                    Moments
                </button>
            </div>
            <div v-if="activeSummaryTab === 'overview' && summary.fightExecutionScore" class="wvw-summary-grade-panel">
                <div class="wvw-summary-grade-header">
                    <div class="wvw-summary-grade-copy">
                        <div class="wvw-summary-side-panel-title">Fight Execution Score</div>
                        <div class="wvw-summary-side-panel-subtitle">{{summary.fightExecutionScore.summary}}</div>
                    </div>
                    <div v-if="summary.fightExecutionScore.scoreAvailable"
                        class="wvw-summary-grade-badge"
                        :class="getExecutionToneClass(summary.fightExecutionScore.overallScore)">
                        <div class="wvw-summary-grade-letter">{{summary.fightExecutionScore.overallScore}}</div>
                        <div class="wvw-summary-grade-score">{{summary.fightExecutionScore.grade}} raw</div>
                    </div>
                    <div v-else class="wvw-summary-grade-badge wvw-summary-grade-tone-even">
                        <div class="wvw-summary-grade-letter">n/a</div>
                        <div class="wvw-summary-grade-score">Replay Required</div>
                    </div>
                </div>
                <div class="wvw-summary-grade-card-detail">{{summary.fightExecutionScore.detail}}</div>
                <div v-if="fightDemand && fightDemand.lanes && fightDemand.lanes.length > 0" class="wvw-summary-demand-panel">
                    <div class="wvw-summary-demand-header">
                        <div class="wvw-summary-side-panel-title">Replay Fight Demand</div>
                        <div class="wvw-summary-side-panel-subtitle">Fight-level lane demand is shared across all player evaluations and reflects replay-visible structure, not individual assignments.</div>
                    </div>
                    <div class="wvw-summary-demand-summary">{{fightDemandSummary}}</div>
                    <div class="wvw-summary-demand-badges">
                        <span
                            v-for="lane in fightDemand.lanes"
                            :key="'wvw-summary-fight-demand-' + lane.key"
                            class="wvw-summary-demand-badge"
                            :data-original-title="lane.evidenceLine + ' ' + lane.responseLine"
                            :class="getDemandToneClass(lane.demandLabel)">
                            <span class="wvw-summary-demand-badge-label">{{lane.label}}</span>
                            <span class="wvw-summary-demand-badge-value">{{formatDemandLabel(lane.demandLabel)}}</span>
                            <span v-if="lane.responseLabel" class="wvw-summary-demand-badge-answer" :class="getDemandAnswerToneClass(lane.responseTone)">{{lane.responseLabel}}</span>
                        </span>
                    </div>
                </div>
                <div class="wvw-summary-execution-layout">
                    <div v-if="summary.fightExecutionScore.scoreAvailable" class="wvw-summary-side-panel">
                        <div class="wvw-summary-grade-card-header">
                            <div>
                                <div class="wvw-summary-side-panel-title">Numbers-Adjusted Interpretation</div>
                                <div class="wvw-summary-side-panel-subtitle">{{summary.fightExecutionScore.numbersAdjustment.summary}}</div>
                            </div>
                            <span class="wvw-summary-grade-card-badge" :class="getExecutionToneClass(summary.fightExecutionScore.numbersAdjustment.adjustedScore)">
                                {{summary.fightExecutionScore.numbersAdjustment.adjustedScore}} / 100
                            </span>
                        </div>
                        <div class="wvw-summary-execution-facts">
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Raw Overall</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.numbersAdjustment.rawScore}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Adjusted Overall</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.numbersAdjustment.adjustedScore}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Adjusted Grade</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.numbersAdjustment.adjustedGrade}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Player Gap</span>
                                <span class="wvw-summary-execution-fact-value">{{formatSignedNumber(summary.fightExecutionScore.numbersAdjustment.playerGap)}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Effective Gap</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.numbersAdjustment.effectivePlayerGap}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Full-Weight Shift</span>
                                <span class="wvw-summary-execution-fact-value">{{formatSignedNumber(summary.fightExecutionScore.numbersAdjustment.fullWeightAdjustment, 1)}}</span>
                            </div>
                        </div>
                        <div class="wvw-summary-execution-detail">{{summary.fightExecutionScore.numbersAdjustment.detail}}</div>
                    </div>
                    <div class="wvw-summary-side-panel">
                        <div class="wvw-summary-side-panel-title">Context</div>
                        <div class="wvw-summary-side-panel-subtitle">Context is shown separately and does not affect the score.</div>
                        <div class="wvw-summary-execution-facts">
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Squad Players</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.context.squadPlayerCount}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Enemy Players</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.context.enemyPlayerCount}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Enemy Formation</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.context.enemyFormationStyleLabel}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Enemy Movement</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.context.enemyMovementScore !== null && summary.fightExecutionScore.context.enemyMovementScore !== undefined ? summary.fightExecutionScore.context.enemyMovementScore + ' / 100' : summary.fightExecutionScore.context.enemyMovementScoreLabel}}</span>
                            </div>
                            <div v-if="summary.fightExecutionScore.context.threeWayDetected" class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Fight Type</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.context.threeWayLabel}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Friendly Non-Squad</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.context.friendlyNonSquadCount}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Phase Duration</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.context.phaseDuration}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Data Confidence</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.context.dataConfidenceLabel}}</span>
                            </div>
                        </div>
                        <div v-if="summary.fightExecutionScore.context.enemyFormationStyleDetail" class="wvw-summary-execution-detail">{{summary.fightExecutionScore.context.enemyFormationStyleDetail}}</div>
                        <div v-if="summary.fightExecutionScore.context.enemyMovementScoreDetail" class="wvw-summary-execution-detail">{{summary.fightExecutionScore.context.enemyMovementScoreDetail}}</div>
                        <div v-if="summary.fightExecutionScore.context.threeWayDetail" class="wvw-summary-execution-detail">{{summary.fightExecutionScore.context.threeWayDetail}}</div>
                        <div class="wvw-summary-execution-detail">{{summary.fightExecutionScore.context.dataConfidenceDetail}}</div>
                        <div v-if="summary.fightExecutionScore.confidence.notes && summary.fightExecutionScore.confidence.notes.length > 0" class="wvw-summary-execution-notes">
                            <div v-for="(note, index) in summary.fightExecutionScore.confidence.notes" :key="'execution-confidence-note-' + index" class="wvw-summary-execution-note">
                                {{note}}
                            </div>
                        </div>
                    </div>
                    <div class="wvw-summary-side-panel">
                        <div class="wvw-summary-side-panel-title">Outcome Headline</div>
                        <div class="wvw-summary-side-panel-subtitle">Outcome is shown separately from execution. Downs and kills are side-attributed, while deaths are taken by side.</div>
                        <div class="wvw-summary-execution-facts">
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Squad Downs</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.outcome.squadDowns}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Enemy Downs</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.outcome.enemyDowns}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Squad Kills</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.outcome.squadKills}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Enemy Kills</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.outcome.enemyKills}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Squad Deaths</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.outcome.squadDeaths}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Enemy Deaths</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.outcome.enemyDeaths}}</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Enemy Down Conversion</span>
                                <span class="wvw-summary-execution-fact-value">{{round1(summary.fightExecutionScore.outcome.enemyDownConversionRate)}}%</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Squad Recovery</span>
                                <span class="wvw-summary-execution-fact-value">{{round1(summary.fightExecutionScore.outcome.squadRecoveryRate)}}%</span>
                            </div>
                            <div class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Wipe</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.outcome.wipeLabel}}</span>
                            </div>
                            <div v-if="summary.fightExecutionScore.outcome.crowdControlDataAvailable" class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Incoming CC</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.outcome.incomingCrowdControl}}</span>
                            </div>
                            <div v-if="summary.fightExecutionScore.outcome.crowdControlDataAvailable" class="wvw-summary-execution-fact">
                                <span class="wvw-summary-execution-fact-label">Outgoing CC</span>
                                <span class="wvw-summary-execution-fact-value">{{summary.fightExecutionScore.outcome.outgoingCrowdControl}}</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div v-if="summary.fightExecutionScore.scoreAvailable && summary.fightExecutionScore.pillars && summary.fightExecutionScore.pillars.length > 0" class="wvw-summary-grade-grid">
                    <div v-for="pillar in summary.fightExecutionScore.pillars"
                        :key="'execution-pillar-' + pillar.key"
                        class="wvw-summary-grade-card">
                        <div class="wvw-summary-grade-card-header">
                            <div>
                                <div class="wvw-summary-grade-card-title">{{pillar.label}}</div>
                                <div class="wvw-summary-execution-pillar-meta">{{pillar.availableMetricCount}} / {{pillar.metricCount}} metrics available</div>
                            </div>
                            <span class="wvw-summary-grade-card-badge" :class="getExecutionToneClass(pillar.score)">
                                {{pillar.score}} / 100
                            </span>
                        </div>
                        <div class="wvw-summary-grade-card-detail">{{pillar.summary}}</div>
                        <details class="wvw-summary-execution-breakdown">
                            <summary class="wvw-summary-execution-breakdown-toggle">
                                Show metric scores
                            </summary>
                            <div class="wvw-summary-execution-breakdown-body">
                                <div class="wvw-summary-execution-breakdown-meta">
                                    Pillar score combines {{pillar.metricCount}} metric scores. Metric weights are shown below.
                                </div>
                                <div class="wvw-summary-execution-detail">{{pillar.detail}}</div>
                                <div v-if="summary.fightExecutionScore.numbersAdjustment.isApplied && pillar.adjustmentApplied" class="wvw-summary-execution-adjusted">
                                    {{pillar.adjustmentDetail}}
                                </div>
                                <div class="wvw-summary-execution-metrics">
                                    <div v-for="metric in pillar.metrics"
                                        :key="'execution-metric-' + pillar.key + '-' + metric.label"
                                        class="wvw-summary-execution-metric">
                                        <div class="wvw-summary-execution-metric-header">
                                            <div>
                                                <div class="wvw-summary-execution-metric-label">{{metric.label}}</div>
                                                <div class="wvw-summary-execution-metric-meta">
                                                    {{getExecutionMetricWeightLabel(pillar, metric)}}
                                                    <span v-if="!metric.available"> · Neutralized to 50</span>
                                                </div>
                                            </div>
                                            <span class="wvw-summary-grade-card-badge wvw-summary-execution-metric-score" :class="getExecutionToneClass(metric.score)">
                                                {{metric.score}} / 100
                                            </span>
                                        </div>
                                        <div class="wvw-summary-execution-metric-value">{{metric.value}}</div>
                                        <div v-if="metric.note" class="wvw-summary-execution-metric-note">{{metric.note}}</div>
                                    </div>
                                </div>
                            </div>
                        </details>
                    </div>
                </div>
                <div v-if="summary.fightExecutionScore.scoreAvailable && (summary.fightExecutionScore.strongestPillarLabel || summary.fightExecutionScore.weakestPillarLabel)" class="wvw-summary-execution-insights">
                    <div v-if="summary.fightExecutionScore.strongestPillarLabel" class="wvw-summary-grade-card">
                        <div class="wvw-summary-grade-card-title">Strongest Pillar: {{summary.fightExecutionScore.strongestPillarLabel}}</div>
                        <div class="wvw-summary-grade-card-detail">{{summary.fightExecutionScore.strongestPillarSummary}}</div>
                    </div>
                    <div v-if="summary.fightExecutionScore.weakestPillarLabel" class="wvw-summary-grade-card">
                        <div class="wvw-summary-grade-card-title">Weakest Pillar: {{summary.fightExecutionScore.weakestPillarLabel}}</div>
                        <div class="wvw-summary-grade-card-detail">{{summary.fightExecutionScore.weakestPillarSummary}}</div>
                    </div>
                </div>
            </div>
            <div id="wvw-summary-player-standouts-panel" v-if="activeSummaryTab === 'overview' && overviewStandoutCards.length > 0" class="wvw-summary-side-panel wvw-summary-standouts-panel">
                <div class="wvw-summary-standouts-header">
                    <div class="wvw-summary-side-panel-title">Player Standouts</div>
                    <button type="button" class="combat-replay-overview-help-button" title="Player standouts help" aria-label="Show player standouts help" @click="showStandoutsHelp = true">?</button>
                </div>
                <div class="wvw-summary-side-panel-subtitle">{{overviewStandoutsSummary}}</div>
                <div class="wvw-summary-standouts-grid">
                    <div v-for="category in overviewStandoutCards" :key="'standout-' + category.key" class="wvw-summary-standout-card">
                        <div class="wvw-summary-standout-card-title">{{category.label}}</div>
                        <div class="wvw-summary-standout-card-detail">{{category.detail}}</div>
                        <button v-for="(entry, index) in category.entries" :key="'standout-entry-' + category.key + '-' + entry.playerIndex"
                            type="button"
                            class="wvw-summary-standout-entry"
                            @click="openPlayerSummary(entry.playerIndex, 'wvw-summary-player-standouts-panel')">
                            <div class="wvw-summary-standout-entry-head">
                                <div class="wvw-summary-top-player-rank">#{{index + 1}}</div>
                                <img :src="entry.icon" :alt="entry.profession" class="icon"
                                    :data-original-title="entry.profession">
                                <span class="wvw-summary-top-player-name" :data-original-title="entry.account ? (entry.name + ' - ' + entry.account) : entry.name">{{entry.name}}</span>
                            </div>
                            <div class="wvw-summary-standout-entry-meta">
                                <span class="wvw-summary-standout-role">{{entry.roleLabel}}</span>
                                <span class="wvw-summary-standout-text">{{entry.whyLine}}</span>
                                <div v-if="entry.evidenceTags && entry.evidenceTags.length > 0" class="wvw-summary-standout-tags">
                                    <span v-for="(tag, tagIndex) in entry.evidenceTags" :key="'standout-tag-' + category.key + '-' + entry.playerIndex + '-' + tagIndex" class="wvw-summary-standout-tag">{{tag}}</span>
                                </div>
                            </div>
                        </button>
                        <div v-if="category.entries.length === 0" class="wvw-summary-side-panel-empty">
                            No standout players were identified for this category.
                        </div>
                    </div>
                </div>
                <div v-if="showStandoutsHelp" class="wvw-summary-modal-backdrop" @click.self="showStandoutsHelp = false">
                    <div class="wvw-summary-modal combat-replay-overview-help-modal" role="dialog" aria-modal="true" aria-label="Player standouts help">
                        <button type="button" class="wvw-summary-modal-close" aria-label="Close player standouts help" @click="showStandoutsHelp = false">&times;</button>
                        <div class="wvw-summary-modal-title">Player Standouts Help</div>
                        <div class="wvw-summary-modal-subtitle">
                            Player standouts surface replay-visible lane leaders plus a demand-adjusted Fight Impact card. Lane cards show squad share; Fight Impact shows weighted impact points.
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Fight Impact</div>
                            <ul class="combat-replay-overview-help-list">
                                <li><strong>What it is</strong>: demand-adjusted visible contribution across all measured lanes in this fight</li>
                                <li><strong>Top line</strong>: fight impact, which weights raw lane strength by replay-visible lane demand</li>
                                <li><strong>Ordering</strong>: highest fight impact first</li>
                            </ul>
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Pressure</div>
                            <ul class="combat-replay-overview-help-list">
                                <li><strong>What it is</strong>: pre-down pressure on live targets before enemy players fell</li>
                                <li><strong>Squad Share</strong>: share of squad pre-down contribution; fallback is live-target damage share if no pre-down contribution exists</li>
                                <li><strong>Strength constants</strong>: LiveTargetDamage 0.31, EnemyDownContributionDamage 0.31, DownContribution 0.14, AverageTopTargetContribution 0.14, OffensiveConditionPressure 0.10</li>
                            </ul>
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Conversion</div>
                            <ul class="combat-replay-overview-help-list">
                                <li><strong>What it is</strong>: visible contribution to turning enemy downs into kills</li>
                                <li><strong>Squad Share</strong>: share of squad finish contribution; fallback is against-downed damage share</li>
                                <li><strong>Strength constants</strong>: EnemyKillContributionDamage 0.46, AgainstDownedDamage 0.26, FastEnemyKillWindowsHit 0.12, EnemyKillWindowsHit 0.16</li>
                            </ul>
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Strip</div>
                            <ul class="combat-replay-overview-help-list">
                                <li><strong>What it is</strong>: boon removal timed into pressure and conversion windows</li>
                                <li><strong>Squad Share</strong>: share of squad down-linked strips; fallback is total strips share</li>
                                <li><strong>Strength constants</strong>: StripDownContribution 0.44, StripsTotal 0.34, ControlContributionWindows 0.12, StripDownContributionTime 0.10</li>
                            </ul>
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Control</div>
                            <ul class="combat-replay-overview-help-list">
                                <li><strong>What it is</strong>: effective crowd control and control conditions that disrupted enemy play</li>
                                <li><strong>Squad Share</strong>: share of squad CC-linked downs; fallback is effective CC count share</li>
                                <li><strong>Strength constants</strong>: CrowdControlDownContribution 0.25, EffectiveCrowdControlCount 0.20, EffectiveCrowdControlDuration 0.15, ControlConditionPressure 0.30, ControlContributionWindows 0.10</li>
                            </ul>
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Boon Support</div>
                            <ul class="combat-replay-overview-help-list">
                                <li><strong>What it is</strong>: offensive and defensive boon-seconds in key windows</li>
                                <li><strong>Squad Share</strong>: share of squad total boon-seconds</li>
                                <li><strong>Strength constants</strong>: TotalBoonSupport 0.36, OffensiveBoonSupport 0.22, DefensiveBoonSupport 0.30, BoonContributionWindows 0.12</li>
                            </ul>
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Recovery</div>
                            <ul class="combat-replay-overview-help-list">
                                <li><strong>What it is</strong>: healing, cleansing, and response-window coverage after damage landed</li>
                                <li><strong>Squad Share</strong>: weighted blend of Healing share 0.60, Cleanses share 0.25, RecoveryContributionWindows share 0.15, re-normalized over available inputs</li>
                                <li><strong>Strength constants</strong>: Healing 0.50, Cleanses 0.30, RecoveryContributionWindows 0.20, re-normalized over available inputs</li>
                            </ul>
                        </div>
                        <div class="combat-replay-overview-help-section">
                            <div class="combat-replay-overview-help-heading">Prevention</div>
                            <ul class="combat-replay-overview-help-list">
                                <li><strong>What it is</strong>: barrier, attributed negation, pet/minion absorption, defensive condition pressure, and prevention-window coverage before recovery work was needed</li>
                                <li><strong>Squad Share</strong>: weighted blend of Barrier share 0.25, Negation share 0.25, PetAbsorption share 0.25, DefensiveConditionPressure share 0.15, DefensiveSupportWindows share 0.10, re-normalized over available inputs</li>
                                <li><strong>Strength constants</strong>: Barrier 0.25, Negation 0.25, PetAbsorption 0.25, DefensiveConditionPressure 0.15, DefensiveSupportWindows 0.10, re-normalized over available inputs</li>

                                <li><strong>Squad Share</strong>: share of squad successful recoveries helped; fallback is rez time share</li>

                                <li>The Fight Impact card is ordered by demand-adjusted impact score</li>
                                <li>Fight Impact uses lane demand to compare across lanes; the lane cards keep showing raw lane leaders</li>
                                <li>Lane weights shown above are raw constants; when some inputs are unavailable, the remaining weights are re-normalized</li>
                                <li>A player can appear in multiple lane cards if they were strong in multiple kinds of contribution</li>

                </div>
            </div>
            <div v-if="crowdControlPopup" class="wvw-summary-modal-backdrop" @click.self="closeCrowdControlDetails">
                <div class="wvw-summary-modal">
                    <button type="button" class="wvw-summary-modal-close" @click="closeCrowdControlDetails" aria-label="Close">
                        &times;
                    </button>
                    <div class="wvw-summary-modal-title">{{crowdControlPopup.title}}</div>
                    <div class="wvw-summary-modal-subtitle">
                        {{crowdControlPopup.player.name}} applied {{integerWithSpaces(crowdControlPopup.player.amount)}} CC effects
                        <span v-if="crowdControlPopup.showEffectiveCounts">and {{integerWithSpaces(crowdControlPopup.player.effectiveAmount)}} were inferred to affect the target</span>
                        for {{formatSeconds(crowdControlPopup.player.totalDuration)}} of total CC duration in this phase.
                    </div>
                    <div v-if="crowdControlPopup.player.skillDetails && crowdControlPopup.player.skillDetails.length > 0" class="wvw-summary-modal-list">
                        <div v-for="detail in crowdControlPopup.player.skillDetails" :key="'cc-detail-' + detail.skillId" class="wvw-summary-modal-row">
                            <div class="wvw-summary-modal-skill">
                                <img :src="detail.icon" :alt="detail.name" class="icon icon-hover">
                                <span class="wvw-summary-modal-skill-name">{{detail.name}}</span>
                            </div>
                            <div class="wvw-summary-modal-values">
                                <span class="wvw-summary-modal-count">{{integerWithSpaces(detail.count)}}<span v-if="crowdControlPopup.showEffectiveCounts"> total</span></span>
                                <span v-if="crowdControlPopup.showEffectiveCounts" class="wvw-summary-modal-effective">{{integerWithSpaces(detail.effectiveCount)}} effective</span>
                                <span class="wvw-summary-modal-duration">{{formatSeconds(detail.totalDuration)}}</span>
                            </div>
                        </div>
                    </div>
                    <div v-else class="wvw-summary-side-panel-empty">
                        Detailed CC skill information is unavailable for this player.
                    </div>
                    <div v-if="crowdControlPopup.showEffectiveCounts" class="wvw-summary-modal-note">
                        Effective CC is inferred from the target not having Stability at the CC timestamp.
                    </div>
                </div>
            </div>
        </div>
        <div v-else class="wvw-summary-empty">
            Summary data is unavailable for this phase.
        </div>
    </div>
</template>

<script>
    Vue.component("wvw-summary-boon-pie-chart", {
        props: ["entries"],
        template: '<div ref="chart" class="wvw-summary-boon-chart"></div>',
        mounted: function() {
            this.renderChart();
            if (typeof window !== "undefined") {
                window.addEventListener("resize", this.handleResize);
            }
        },
        beforeDestroy: function() {
            if (typeof window !== "undefined") {
                window.removeEventListener("resize", this.handleResize);
            }
            if (typeof Plotly !== "undefined" && this.$refs && this.$refs.chart) {
                Plotly.purge(this.$refs.chart);
            }
        },
        watch: {
            entries: {
                handler: function() {
                    this.$nextTick(this.renderChart);
                },
                deep: true,
            },
        },
        methods: {
            renderChart: function() {
                if (typeof Plotly === "undefined" || !this.$refs || !this.$refs.chart) {
                    return;
                }
                const chart = this.$refs.chart;
                const entries = Array.isArray(this.entries) ? this.entries.filter(entry => entry && entry.amount > 0) : [];
                if (entries.length === 0) {
                    Plotly.purge(chart);
                    chart.innerHTML = "";
                    return;
                }
                Plotly.react(
                    chart,
                    [{
                        type: "pie",
                        values: entries.map(entry => entry.amount),
                        labels: entries.map(entry => entry.label),
                        customdata: entries.map(entry => [entry.sharePercent]),
                        marker: {
                            colors: entries.map(entry => entry.color),
                            line: {
                                color: "rgba(13, 17, 23, 0.88)",
                                width: 1,
                            },
                        },
                        sort: false,
                        direction: "clockwise",
                        hole: 0.34,
                        textinfo: "none",
                        hovertemplate: "%{label}<br>%{customdata[0]:.1f}% contribution<extra></extra>",
                        showlegend: false,
                    }],
                    {
                        margin: { t: 0, r: 0, b: 0, l: 0 },
                        height: 240,
                        paper_bgcolor: "rgba(0,0,0,0)",
                        plot_bgcolor: "rgba(0,0,0,0)",
                    },
                    {
                        displayModeBar: false,
                        responsive: true,
                    }
                );
            },
            handleResize: function() {
                if (typeof Plotly !== "undefined" && Plotly.Plots && this.$refs && this.$refs.chart) {
                    Plotly.Plots.resize(this.$refs.chart);
                }
            },
        },
    });

    Vue.component("wvw-summary-component", {
        props: ["phaseindex"],
        template: `${template}`,
        mixins: [numberComponent, encounterPhaseComponent],
        beforeDestroy: function() {
            if (this.downsModalElements && this.downsModalElements.backdrop && this.downsModalElements.backdrop.parentNode) {
                this.downsModalElements.backdrop.parentNode.removeChild(this.downsModalElements.backdrop);
            }
            this.downsModalElements = null;
        },
        data: function() {
            return {
                activeSummaryTab: "overview",
                activeBoonsView: "byBoon",
                crowdControlPopup: null,
                downDetailPopup: null,
                downsOutcomePopup: null,
                hoveredMomentIndex: null,
                selectedBoonProviderKeys: [],
                selectedBoonProviderKey: null,
                specPlayerCompareModal: null,
                specLaneDetailModal: null,
                showStandoutsHelp: false,
            };
        },
        methods: {
            setSummarySubTab: function(tab) {
                this.activeSummaryTab = tab;
                if (tab !== "metrics") {
                    this.closeCrowdControlDetails();
                }
                if (tab !== "downs") {
                    this.closeDownDetailPopup();
                    this.closeDownsOutcomePopup();
                }
                if (tab !== "specs") {
                    this.closeSpecLaneDetail();
                    this.closeSpecPlayerCompare();
                }
            },
            setActiveBoonsView: function(view) {
                this.activeBoonsView = view;
            },
            toggleBoonProviderProfile: function(key) {
                const selectedKeys = Array.isArray(this.selectedBoonProviderKeys) ? [...this.selectedBoonProviderKeys] : [];
                const existingIndex = selectedKeys.indexOf(key);
                if (existingIndex !== -1) {
                    if (selectedKeys.length === 1) {
                        return;
                    }
                    selectedKeys.splice(existingIndex, 1);
                } else {
                    selectedKeys.push(key);
                }
                this.selectedBoonProviderKeys = selectedKeys;
                this.selectedBoonProviderKey = selectedKeys.length > 0 ? selectedKeys[0] : null;
            },
            selectBoonProviderProfile: function(key) {
                this.selectedBoonProviderKey = key;
            },
            getBoonGenerationValue: function(buffData) {
                if (buffData instanceof Array) {
                    return buffData[0] || 0;
                }
                return 0;
            },
            getSquadPlayerTooltip: function(player) {
                if (player && player.acc) {
                    return player.name + " - " + player.acc;
                }
                if (player && player.account) {
                    return player.name + " - " + player.account;
                }
                return player ? player.name : "";
            },
            formatSeconds: function(value) {
                return this.round1(value) + "s";
            },
            formatPercent: function(value) {
                if (value == null || isNaN(value)) {
                    return "0.0%";
                }
                return this.round1(value) + "%";
            },
            formatAverageStacks: function(value) {
                if (value == null || isNaN(value)) {
                    return "0.0";
                }
                return this.round1(value).toString();
            },
            formatEffectiveCount: function(value) {
                if (value == null || isNaN(value)) {
                    return "0";
                }
                return Math.abs(value - Math.round(value)) < 0.05
                    ? this.integerWithSpaces(Math.round(value))
                    : this.round1(value).toString();
            },
            formatStripCount: function(strips, corrupts) {
                return this.integerWithSpaces(strips || 0) + " (" + this.integerWithSpaces(corrupts || 0) + ")";
            },
            formatBoonGenerationValue: function(section, value) {
                if (section.stacking) {
                    return Number.isInteger(value) ? this.integerWithSpaces(value) : this.round1(value).toString();
                }
                return this.round1(value) + "%";
            },
            getBoonContributionBarStyle: function(boon) {
                const width = Math.max(0, Math.min(100, boon && boon.sharePercent ? boon.sharePercent : 0));
                return {
                    width: width + "%",
                    background: this.getBoonProviderColor(boon ? (boon.label || boon.name) : "Unknown"),
                };
            },
            getBoonProviderColor: function(label) {
                const text = label || "Unknown";
                let hash = 0;
                for (let i = 0; i < text.length; i++) {
                    hash = ((hash << 5) - hash) + text.charCodeAt(i);
                    hash |= 0;
                }
                const hue = Math.abs(hash) % 360;
                return "hsl(" + hue + ", 58%, 56%)";
            },
            formatRowValue: function(value, row) {
                if (row.equalValues) {
                    return value;
                }
                if (typeof value === "string" && value.indexOf("(") >= 0) {
                    return value;
                }
                const parsed = parseFloat(value);
                if (isNaN(parsed)) {
                    return value;
                }
                let formatted = "";
                if (row.integerWithSpaces) {
                    formatted = this.integerWithSpaces(this.round(parsed));
                } else if (row.decimals === 1) {
                    formatted = this.round1(parsed).toString();
                } else if (row.decimals === 2) {
                    formatted = this.round2(parsed).toString();
                } else if (row.decimals === 3) {
                    formatted = this.round3(parsed).toString();
                } else {
                    formatted = this.integerWithSpaces(this.round(parsed));
                }
                return row.percentage ? formatted + "%" : formatted;
            },
            getExecutionToneClass: function(score) {
                if (score >= 82) {
                    return "wvw-summary-grade-tone-strong";
                }
                if (score >= 66) {
                    return "wvw-summary-grade-tone-good";
                }
                if (score >= 50) {
                    return "wvw-summary-grade-tone-even";
                }
                if (score >= 34) {
                    return "wvw-summary-grade-tone-weak";
                }
                return "wvw-summary-grade-tone-danger";
            },
            formatDemandLabel: function(label) {
                return label === "Moderate" ? "Medium" : label;
            },
            getDemandToneClass: function(label) {
                if (label === "Very High") {
                    return "wvw-summary-demand-tone-very-high";
                }
                if (label === "High") {
                    return "wvw-summary-demand-tone-high";
                }
                if (label === "Moderate") {
                    return "wvw-summary-demand-tone-medium";
                }
                return "wvw-summary-demand-tone-low";
            },
            getDemandAnswerToneClass: function(tone) {
                return "wvw-summary-demand-answer-" + (tone || "neutral");
            },
            formatSpecEfficiency: function(value) {
                return this.round1(value || 0) + "x efficiency";
            },
            getSpecCapabilityBadgeToneClass: function(value) {
                if (!value) {
                    return "";
                }
                return "combat-replay-spec-capability-lane-chip-" + value.toLowerCase().replace(/\s+/g, "-");
            },
            openSpecLaneDetail: function(spec, lane) {
                if (!lane || !lane.isInteractive || !lane.detailSections || lane.detailSections.length === 0) {
                    return;
                }
                this.specLaneDetailModal = {
                    title: lane.drilldownTitle || ((spec ? spec.label + " " : "") + lane.label),
                    subtitle: lane.drilldownSubtitle || "",
                    sections: lane.detailSections,
                };
            },
            closeSpecLaneDetail: function() {
                this.specLaneDetailModal = null;
            },
            getPlayerContributionTotal: function(evaluation) {
                if (!evaluation || !evaluation.lanes || evaluation.lanes.length === 0) {
                    return 0;
                }
                return evaluation.lanes.reduce(function(total, lane) {
                    return total + (lane && lane.strengthPercent ? lane.strengthPercent : 0);
                }, 0);
            },
            getSpecComparisonPlayers: function(spec) {
                const analysis = typeof crData !== "undefined" && crData && crData.analysis ? crData.analysis : null;
                const evaluations = analysis && analysis.playerEvaluations ? analysis.playerEvaluations : null;
                if (!spec || !logData || !logData.players) {
                    return [];
                }
                const allPlayers = Array.from(logData.players || []);
                const playerIds = spec.playerIds && spec.playerIds.length > 0
                    ? spec.playerIds.map(function(id) { return Number(id); })
                    : [];
                const players = allPlayers.filter(player => {
                    if (playerIds.length > 0) {
                        return playerIds.indexOf(Number(player.uniqueID)) !== -1;
                    }
                    return player.profession === spec.label;
                });
                return players
                    .map(player => {
                        const evaluation = evaluations ? evaluations[player.uniqueID] || null : null;
                        return {
                            ...player,
                            evaluation: evaluation,
                            contributionTotal: this.getPlayerContributionTotal(evaluation),
                        };
                    })
                    .sort((left, right) => {
                        if (right.contributionTotal !== left.contributionTotal) {
                            return right.contributionTotal - left.contributionTotal;
                        }
                        const leftLaneCount = left.evaluation && left.evaluation.lanes ? left.evaluation.lanes.length : 0;
                        const rightLaneCount = right.evaluation && right.evaluation.lanes ? right.evaluation.lanes.length : 0;
                        if (rightLaneCount !== leftLaneCount) {
                            return rightLaneCount - leftLaneCount;
                        }
                        return (left.name || "").localeCompare(right.name || "");
                    });
            },
            openSpecPlayerCompare: function(spec) {
                if (!spec) {
                    return;
                }
                const players = this.getSpecComparisonPlayers(spec);
                this.closeSpecLaneDetail();
                this.$set(this, "specPlayerCompareModal", {
                    spec: spec,
                    title: spec.label + " Player Comparison",
                    subtitle: "Players are ordered by total visible contribution across all lanes for this fight. This view mirrors Analysis comparison cards without selection toggles.",
                    players: players,
                });
                this.$forceUpdate();
            },
            closeSpecPlayerCompare: function() {
                this.$set(this, "specPlayerCompareModal", null);
                this.$forceUpdate();
            },
            getOverviewEvaluationPlayers: function() {
                const analysis = typeof crData !== "undefined" && crData && crData.analysis ? crData.analysis : null;
                const evaluations = analysis && analysis.playerEvaluations ? analysis.playerEvaluations : null;
                if (!evaluations || !logData || !logData.players) {
                    return [];
                }
                return Array.from(logData.players || [])
                    .map((player, index) => ({
                        playerIndex: index,
                        name: player.name,
                        account: player.acc || player.account || "",
                        profession: player.profession || "",
                        icon: player.icon || "",
                        evaluation: evaluations[player.uniqueID] || null,
                    }))
                    .filter(player => !!player.evaluation);
            },
            getEvaluationLaneByKey: function(evaluation, laneKey) {
                if (!evaluation || !evaluation.lanes) {
                    return null;
                }
                return evaluation.lanes.find(lane => lane.key === laneKey) || null;
            },
            getOverviewStandoutEntriesForLane: function(laneKey) {
                const players = this.getOverviewEvaluationPlayers()
                    .map(player => {
                        const lane = this.getEvaluationLaneByKey(player.evaluation, laneKey);
                        if (!lane) {
                            return null;
                        }
                        return {
                            playerIndex: player.playerIndex,
                            name: player.name,
                            account: player.account,
                            profession: player.profession,
                            icon: player.icon,
                            roleLabel: this.formatPercent(lane.sharePercent) + (laneKey === "pressure"
                                ? " squad share down contribution"
                                : " squad share"),
                            whyLine: lane.evidenceLine,
                            evidenceTags: [
                                lane.rateBand,
                                lane.windowsTotal > 0 ? (lane.windowsHit + "/" + lane.windowsTotal + " " + lane.windowLabel) : "",
                            ].filter(tag => !!tag),
                            strengthPercent: lane.strengthPercent || 0,
                            sharePercent: lane.sharePercent || 0,
                            windowsHit: lane.windowsHit || 0,
                        };
                    })
                    .filter(entry => !!entry);
                return players
                    .sort((left, right) => {
                        if (right.strengthPercent !== left.strengthPercent) {
                            return right.strengthPercent - left.strengthPercent;
                        }
                        if (right.sharePercent !== left.sharePercent) {
                            return right.sharePercent - left.sharePercent;
                        }
                        if (right.windowsHit !== left.windowsHit) {
                            return right.windowsHit - left.windowsHit;
                        }
                        return (left.name || "").localeCompare(right.name || "");
                    })
                    .slice(0, 3);
            },
            getOverallImpactStandoutEntries: function() {
                return this.getOverviewEvaluationPlayers()
                    .map(player => {
                        const lanes = player.evaluation && player.evaluation.lanes ? player.evaluation.lanes : [];
                        const fightImpact = player.evaluation && player.evaluation.fightImpact ? player.evaluation.fightImpact : null;
                        if (fightImpact && fightImpact.score > 0) {
                            const impactLanes = fightImpact.lanes || [];
                            const topImpactLanes = impactLanes
                                .filter(lane => lane && lane.impactScore > 0)
                                .slice(0, 3)
                                .map(lane => lane.label + " " + this.round1(lane.impactScore));
                            return {
                                playerIndex: player.playerIndex,
                                name: player.name,
                                account: player.account,
                                profession: player.profession,
                                icon: player.icon,
                                roleLabel: this.round1(fightImpact.score) + "/100 fight coverage",
                                whyLine: fightImpact.summary || player.evaluation.demandFitSummary || player.evaluation.fitSummary || "",
                                evidenceTags: topImpactLanes,
                                totalContribution: fightImpact.score || 0,
                                topLaneStrength: impactLanes.length > 0 ? (impactLanes[0].impactScore || 0) : 0,
                            };
                        }
                        const totalContribution = lanes.reduce((total, lane) => total + (lane && lane.strengthPercent ? lane.strengthPercent : 0), 0);
                        const topLanes = [...lanes]
                            .sort((left, right) => {
                                if ((right.strengthPercent || 0) !== (left.strengthPercent || 0)) {
                                    return (right.strengthPercent || 0) - (left.strengthPercent || 0);
                                }
                                return (right.sharePercent || 0) - (left.sharePercent || 0);
                            })
                            .slice(0, 2)
                            .map(lane => lane.label);
                        return {
                            playerIndex: player.playerIndex,
                            name: player.name,
                            account: player.account,
                            profession: player.profession,
                            icon: player.icon,
                            roleLabel: this.round1(totalContribution) + " total lane signal",
                            whyLine: player.evaluation.fitSummary || player.evaluation.contributionProfile || "",
                            evidenceTags: topLanes,
                            totalContribution: totalContribution,
                            topLaneStrength: lanes.length > 0 ? (lanes[0].strengthPercent || 0) : 0,
                        };
                    })
                    .filter(entry => entry.totalContribution > 0)
                    .sort((left, right) => {
                        if (right.totalContribution !== left.totalContribution) {
                            return right.totalContribution - left.totalContribution;
                        }
                        if (right.topLaneStrength !== left.topLaneStrength) {
                            return right.topLaneStrength - left.topLaneStrength;
                        }
                        return (left.name || "").localeCompare(right.name || "");
                    })
                    .slice(0, 3);
            },
            getExecutionMetricWeightLabel: function(pillar, metric) {
                if (metric && Number(metric.weightPercent) > 0) {
                    return this.round1(metric.weightPercent) + "% of pillar";
                }
                if (!pillar || !pillar.metricCount) {
                    return "0.0% of pillar";
                }
                return this.round1(100 / pillar.metricCount) + "% of pillar";
            },
            formatSignedNumber: function(value, decimals) {
                var places = decimals == null ? 0 : decimals;
                var number = Number(value);
                if (!Number.isFinite(number)) {
                    return "";
                }
                if (Math.abs(number) < Math.pow(10, -places) / 2) {
                    number = 0;
                }
                var formatted = number.toFixed(places);
                return number > 0 ? "+" + formatted : formatted;
            },
            getMomentToneClass: function(moment) {
                if (!moment || !moment.tone) {
                    return "";
                }
                return "wvw-summary-moment-tone-" + moment.tone;
            },
            hasMoments: function() {
                return !!(this.summary && this.summary.moments && this.summary.moments.length > 0);
            },
            getMomentWinOdds: function(moment) {
                const squadAlive = moment && moment.squadAlive ? moment.squadAlive : 0;
                const enemyAlive = moment && moment.enemyAlive ? moment.enemyAlive : 0;
                const totalAlive = squadAlive + enemyAlive;
                const squadPercent = totalAlive <= 0 ? 50 : Math.round((squadAlive / totalAlive) * 100);
                return squadPercent + "%";
            },
            getMomentWinOddsStyle: function(moment) {
                const squadAlive = moment && moment.squadAlive ? moment.squadAlive : 0;
                const enemyAlive = moment && moment.enemyAlive ? moment.enemyAlive : 0;
                const totalAlive = squadAlive + enemyAlive;
                const squadPercent = totalAlive <= 0 ? 50 : (squadAlive / totalAlive) * 100;
                return {
                    background: "conic-gradient(from -90deg, rgba(74, 132, 100, 0.98) 0 " + squadPercent.toFixed(1) + "%, rgba(142, 72, 72, 0.98) " + squadPercent.toFixed(1) + "% 100%)"
                };
            },
            getMomentWinOddsClass: function(moment) {
                const squadAlive = moment && moment.squadAlive ? moment.squadAlive : 0;
                const enemyAlive = moment && moment.enemyAlive ? moment.enemyAlive : 0;
                if (squadAlive === enemyAlive) {
                    return "wvw-summary-moment-odds-core-even";
                }
                return squadAlive > enemyAlive ? "wvw-summary-moment-odds-core-our" : "wvw-summary-moment-odds-core-enemy";
            },
            getMomentWinOddsTitle: function(moment) {
                const squadAlive = moment && moment.squadAlive ? moment.squadAlive : 0;
                const enemyAlive = moment && moment.enemyAlive ? moment.enemyAlive : 0;
                return "Our Squad win odds from alive count: " + this.getMomentWinOdds(moment) + " (" + squadAlive + " alive vs " + enemyAlive + " alive)";
            },
            getTimelineMoments: function(moments) {
                if (!moments) {
                    return [];
                }
                return moments
                    .map(function(moment, index) {
                        return { moment: moment, index: index };
                    })
                    .filter(function(marker) {
                        return !marker.moment.category || marker.moment.category.indexOf("first-down") !== 0;
                    });
            },
            getTimelinePercent: function(moment) {
                const fightDurationMs = ((this.summary && this.summary.fightTimeSeconds) || 0) * 1000;
                const relativeTime = moment && moment.relativeTime ? moment.relativeTime : 0;
                return fightDurationMs <= 0 ? 0 : Math.max(0, Math.min(100, (relativeTime / fightDurationMs) * 100));
            },
            getTimelineMarkers: function(moments) {
                const filtered = this.getTimelineMoments(moments)
                    .map((marker) => {
                        const bubbleWidth = Math.max(4.6, Math.min(15.5, marker.moment.label.length * 0.42 + 1.6));
                        const rawLeft = this.getTimelinePercent(marker.moment);
                        const clampedLeft = Math.max(bubbleWidth / 2, Math.min(100 - bubbleWidth / 2, rawLeft));
                        return {
                            index: marker.index,
                            moment: marker.moment,
                            rawLeft: rawLeft,
                            left: clampedLeft,
                            bubbleWidth: bubbleWidth,
                        };
                    })
                    .sort((left, right) => left.left - right.left);
                if (filtered.length === 0) {
                    return [];
                }

                const laneGap = 1.0;
                const maxLanes = 6;
                const laneEnds = {
                    top: new Array(maxLanes).fill(-Infinity),
                    bottom: new Array(maxLanes).fill(-Infinity),
                };

                filtered.forEach((marker, index) => {
                    const preferredSide = index % 2 === 0 ? "top" : "bottom";
                    let bestPlacement = null;
                    ["top", "bottom"].forEach((side) => {
                        for (let lane = 0; lane < maxLanes; lane++) {
                            const start = marker.left - marker.bubbleWidth / 2;
                            const end = marker.left + marker.bubbleWidth / 2;
                            if (start >= laneEnds[side][lane] + laneGap) {
                                const penalty = lane * 10 + (side === preferredSide ? 0 : 1);
                                if (!bestPlacement || penalty < bestPlacement.penalty) {
                                    bestPlacement = {
                                        side: side,
                                        lane: lane,
                                        start: start,
                                        end: end,
                                        penalty: penalty,
                                    };
                                }
                                break;
                            }
                        }
                    });

                    if (!bestPlacement) {
                        const fallbackSide = preferredSide;
                        const fallbackLane = maxLanes - 1;
                        bestPlacement = {
                            side: fallbackSide,
                            lane: fallbackLane,
                            start: marker.left - marker.bubbleWidth / 2,
                            end: marker.left + marker.bubbleWidth / 2,
                        };
                    }

                    laneEnds[bestPlacement.side][bestPlacement.lane] = bestPlacement.end;
                    marker.side = bestPlacement.side;
                    marker.lane = bestPlacement.lane;
                });

                return filtered.sort((left, right) => left.index - right.index);
            },
            getTimelineMarkerStyle: function(marker) {
                return { left: marker.left.toFixed(2) + "%" };
            },
            getTimelineTicks: function() {
                const tickCount = 7;
                const fightDurationMs = ((this.summary && this.summary.fightTimeSeconds) || 0) * 1000;
                const ticks = [];
                for (let index = 0; index < tickCount; index++) {
                    const ratio = tickCount <= 1 ? 0 : index / (tickCount - 1);
                    ticks.push({
                        index: index,
                        left: (ratio * 100).toFixed(2) + "%",
                        label: this.formatTimelineTickTime(fightDurationMs * ratio),
                    });
                }
                return ticks;
            },
            formatTimelineTickTime: function(timeMs) {
                const totalSeconds = Math.max(0, Math.round(timeMs / 1000));
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                return minutes + ":" + seconds.toString().padStart(2, "0");
            },
            getTimelineBubbleStyle: function(marker) {
                const lineTop = 10.8;
                const laneOffset = 1.65;
                const bubbleOffset = marker.side === "top"
                    ? lineTop - (2.0 + marker.lane * laneOffset)
                    : lineTop + (1.45 + marker.lane * laneOffset);
                return {
                    left: marker.left.toFixed(2) + "%",
                    width: marker.bubbleWidth.toFixed(2) + "%",
                    top: bubbleOffset.toFixed(2) + "rem",
                };
            },
            setHoveredMomentIndex: function(index) {
                this.hoveredMomentIndex = index;
            },
            clearHoveredMomentIndex: function() {

            getValueClass: function(row, side) {
                if (row.equalValues) {
                    return {};
                }
                const squadValue = parseFloat(String(row.squadValue).replace(/,/g, ""));
                const enemyValue = parseFloat(String(row.enemyValue).replace(/,/g, ""));
                if (isNaN(squadValue) || isNaN(enemyValue) || squadValue === enemyValue) {
                    return {};
                }
                const squadLead = row.higherIsBetter ? squadValue > enemyValue : squadValue < enemyValue;
                return {
                    "wvw-summary-table-value-lead": (side === "squad" && squadLead) || (side === "enemy" && !squadLead),
                };
            },

            showDownsOutcomeModal: function(entries, popup) {
