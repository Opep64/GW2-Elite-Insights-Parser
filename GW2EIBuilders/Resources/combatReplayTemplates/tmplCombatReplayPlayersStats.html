<template>
    <div class="d-flex flex-row flex-wrap justify-content-center align-items-start mb-2">
        <ul v-if="!analysis" class="nav nav-pills d-flex flex-row justify-content-center mb-1 scale85">
            <li class="nav-item">
                <a class="nav-link" :class="{active: buffs}" @click="buffs = !buffs">
                    Show Buffs
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" :class="{active: rotation}" @click="rotation = !rotation">Show Rotation</a>
            </li>
        </ul>
        <ul v-if="!analysis" class="nav nav-pills d-flex flex-row justify-content-center mb-1 scale65">
            <li v-for="(buffType, index) in possibleBuffs" class="ml-1 mr-1">
                <input :id="'crpl-possibleBuffs-' + index" type="checkbox" :value="buffType" v-model="buffsToShow" />
                <label :for="'crpl-possibleBuffs-' + index">{{buffType}}</label>
            </li>
        </ul>
            <div class="d-flex flex-column combat-actor-status-container scrollable-y" :class="{'combat-actor-status-container-analysis': analysis}" :style="groupContainerStyle">
            <div v-for="(group,id) in groups" v-if="group" class="d-flex flex-row align-items-center" :class="getGroupRowClass(id)">
                <fieldset class="d-flex flex-row align-items-center" :class="getGroupFieldsetClass(id)" :style="groupFieldsetStyle">
                    <legend v-if="!singleGroup" style="font-size: 0.80rem; width: auto; padding: 0 5px; margin-left: 5px;">Group {{id}}</legend>
                    <div class="d-flex flex-row align-items-center ml-1 mr-1" :class="getGroupMembersClass(id)">
                        <div v-for="playerData in group" class="player-data" :class="[playerDataClass, {active: selectedplayerid === playerData.player.uniqueID, 'combat-replay-analysis-selected-card': analysis && selectedplayerid === playerData.player.uniqueID}]">
                            <combat-replay-actor-stats-component :actorIndex="playerData.player.id" :time="time" :buffstoshow="buffsToShow" :isTarget="false" :buffs="buffs" :rotation="rotationEnabled" :compact="analysis" />
                        </div>
                    </div>
                </fieldset>
            </div>
        </div>
    </div>
</template>

<script>
    Vue.component("combat-replay-players-stats-component", {
        props: {
            time: Number,
            selectedplayerid: Number,
            analysis: {
                type: Boolean,
                default: false,
            },
        },
        mixins: [encounterPhaseComponent],
        template: `${template}`,
        data: function () {
            return {
                buffs: false,
                rotation: true,
                buffsToShow: ["Others", "Shared", "Consumables", "Boons"]
            };
        },
        methods: {
            isNonSquadFriendlyGroup: function (groupId) {
                return this.analysis && Number(groupId) >= 51;
            },
            getGroupRowClass: function () {
                return this.analysis ? "justify-content-center mb-1" : "ml-2";
            },
            getGroupFieldsetClass: function (groupId) {
                if (!this.analysis) {
                    return "flex-wrap";
                }
                return {
                    "combat-replay-analysis-group": true,
                    "combat-replay-analysis-friendly-group": this.isNonSquadFriendlyGroup(groupId),
                };
            },
            getGroupMembersClass: function (groupId) {
                if (!this.analysis) {
                    return "flex-wrap";
                }
                return {
                    "flex-nowrap": !this.isNonSquadFriendlyGroup(groupId),
                    "flex-wrap": this.isNonSquadFriendlyGroup(groupId),
                    "justify-content-between": !this.isNonSquadFriendlyGroup(groupId),
                    "justify-content-start": this.isNonSquadFriendlyGroup(groupId),
                    "w-100": true,
                    "combat-replay-analysis-friendly-members": this.isNonSquadFriendlyGroup(groupId),
                };
            },
        },
        computed: {
            singleGroup: function () {
                return logData.singleGroup;
            },
            possibleBuffs: function() {
                return [ "Boons", "Conditions", "Encounter Specifics","Shared", "Consumables", "Others"];
            },
            rotationEnabled: function () {
                return this.analysis ? false : this.rotation;
            },
            groupContainerStyle: function () {
                if (this.analysis || this.singleGroup) {
                    return null;
                }
                return {'transform': 'translate(-24px,0);'};
            },
            groupFieldsetStyle: function () {
                return this.analysis ? null : {'width':'340px', 'border':'2px solid #888', 'margin':'0'};
            },
            playerDataClass: function () {
                return this.analysis ? "combat-replay-analysis-player-data" : "ml-1";
            },
            groups: function () {
                var res = [];
                var i = 0;
                const encounterPlayers = getActiveNonFakePlayersForPhase(this.encounterPhase);
                const players = getActiveNonFakePlayers(this.time * 0.001);
                for (i = 0; i < players.length; i++) {
                    var playerData = players[i];
                    if (!playerData || !encounterPlayers[i]) {
                        continue;
                    }
                    var crPlayer = animator.getActorData(playerData.uniqueID);
                    if (!crPlayer) {
                        continue;
                    }
                    if (!res[playerData.group]) {
                        res[playerData.group] = [];
                    }
                    res[playerData.group].push({
                            player: playerData,
                            crPlayer: crPlayer,
                        }
                    );
                }
                return res;
            }
        }
    });
</script>
