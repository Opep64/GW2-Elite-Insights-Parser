<template>
    <div class="d-flex flex-column justify-content-center">
        <ul class="nav nav-pills d-flex flex-row justify-content-center mb-1">
            <li class="nav-item">
                <a class="nav-link" :class="{active: mode === 0}" @click="mode = 0">Players</a>
            </li>
            <li v-if="!targetless" class="nav-item">
                <a class="nav-link" :class="{active: mode === 1}" @click="mode = 1">Targets</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" :class="{active: mode === 2}" @click="mode = 2">Mechanics</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" :class="{active: mode === 3}" @click="mode = 3">Overview</a>
            </li>
        </ul>
        <div class="squad-details">
            <keep-alive>
                <combat-replay-players-stats-component v-if="mode === 0" :key="'players-cr-details'" :time="time" :selectedplayerid="selectedactorid"></combat-replay-players-stats-component>
                <combat-replay-targets-stats-component v-if="mode === 1" :key="'targets-cr-details'" :time="time" :selectedtargetid="selectedactorid"></combat-replay-targets-stats-component>
                <combat-replay-mechanics-list-component v-if="mode === 2" :key="'mechanics-cr-details'" :selectedplayerid="selectedactorid"></combat-replay-mechanics-list-component>
                <combat-replay-overview-panel-component
                    v-if="mode === 3"
                    :key="'overview-cr-details'"
                    :time="time"
                    :selectedactorid="selectedactorid"
                    :targetless="targetless"
                    :hasanalysis="hasAnalysis">
                </combat-replay-overview-panel-component>
            </keep-alive>
        </div>
    </div>
</template>

<script>
    const combatReplayWvWAnalysisMixin = {
        computed: {
            crAnalysis: function () {
                return crData && crData.analysis ? crData.analysis : null;
            },
            snapshotIndex: function () {
                if (!this.crAnalysis || !this.crAnalysis.times || this.crAnalysis.times.length === 0) {
                    return -1;
                }
                return this.findNearestSnapshotIndex(this.crAnalysis.times, this.time);
            },
        },
        methods: {
            findNearestSnapshotIndex: function (times, time) {
                let low = 0;
                let high = times.length - 1;
                while (low < high) {
                    const mid = Math.floor((low + high) / 2);
                    if (times[mid] < time) {
                        low = mid + 1;
                    } else {
                        high = mid;
                    }
                }
                if (low === 0) {
                    return 0;
                }
                return Math.abs(times[low] - time) < Math.abs(times[low - 1] - time) ? low : low - 1;
            },
            getPlayerByUniqueId: function (uniqueId) {
                return logData.players.find(player => player.uniqueID === uniqueId) || null;
            },
            getTargetByUniqueId: function (uniqueId) {
                return logData.targets.find(target => target.uniqueID === uniqueId) || null;
            },
            getActorByUniqueId: function (uniqueId) {
                return this.getPlayerByUniqueId(uniqueId) || this.getTargetByUniqueId(uniqueId);
            },
            getSeriesValue: function (series, index) {
                if (!series || index < 0 || index >= series.length) {
                    return 0;
                }
                return series[index];
            },
            getSeriesArrayValue: function (series, index) {
                if (!series || index < 0 || index >= series.length || !series[index]) {
                    return [];
                }
                return series[index];
            },
            formatCount: function (value) {
                return Number(value || 0).toLocaleString();
            },
            formatPercent: function (value) {
                return (Number(value || 0)).toFixed(1) + "%";
            },
            formatTime: function (time) {
                return (Number(time || 0) / 1000.0).toFixed(3) + "s";
            },
            formatDurationSeconds: function (time) {
                return (Number(time || 0) / 1000.0).toFixed(1) + "s";
            },
            jumpToBurst: function (time) {
                if (!animator) {
                    return;
                }
                animator.stopAnimate(true);
                animator.updateTime(time);
                animator.updateTextInput();
            },
            selectReplayActor: function (uniqueId) {
                if (!animator || uniqueId == null) {
                    return;
                }
                animator.selectActor(uniqueId);
            },
            isPlayerActor: function (actor) {
                return !!(actor && logData.players.some(player => player.uniqueID === actor.uniqueID));
            },
            getTeamAnalysis: function (teamKey) {
                if (!this.crAnalysis) {
                    return null;
                }
                return teamKey === "enemy" ? this.crAnalysis.enemy : this.crAnalysis.squad;
            },
            getThreatAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.threatBoons ? this.crAnalysis.threatBoons : null;
            },
            getPositioningAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.positioning ? this.crAnalysis.positioning : null;
            },
        }
    };

    Vue.component("combat-replay-overview-stats-component", {
        props: ["time", "selectedactorid", "targetless"],
        template: `
        <div class="d-flex flex-column">
            <combat-replay-players-stats-component :time="time" :selectedplayerid="selectedactorid" :analysis="true"></combat-replay-players-stats-component>
            <combat-replay-targets-stats-component v-if="!targetless" :time="time" :selectedtargetid="selectedactorid" :analysis="true"></combat-replay-targets-stats-component>
        </div>
        `,
    });

    Vue.component("combat-replay-overview-panel-component", {
        props: ["time", "selectedactorid", "targetless", "hasanalysis"],
        template: `
        <div class="d-flex flex-column">
            <ul v-if="hasanalysis" class="nav nav-pills d-flex flex-row justify-content-center mb-2 scale85 combat-replay-wvw-analysis-subtabs">
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 0}" @click="overviewMode = 0">Overview</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 1}" @click="overviewMode = 1">Burst</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 2}" @click="overviewMode = 2">Weighted Boons</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 3}" @click="overviewMode = 3">Positioning</a>
                </li>
            </ul>
            <div v-if="!hasanalysis || overviewMode === 0" class="d-flex flex-column">
                <div class="combat-replay-overview-help-row">
                    <button type="button" class="combat-replay-overview-help-button" title="Compact card help" aria-label="Show compact card help" @click="showOverviewHelp = true">?</button>
                </div>
                <combat-replay-overview-stats-component :time="time" :selectedactorid="selectedactorid" :targetless="targetless"></combat-replay-overview-stats-component>
            </div>
            <combat-replay-wvw-analysis-component v-else-if="overviewMode === 1" :time="time" :selectedactorid="selectedactorid"></combat-replay-wvw-analysis-component>
            <combat-replay-threat-boons-component v-else-if="overviewMode === 2" :time="time" :selectedactorid="selectedactorid"></combat-replay-threat-boons-component>
            <combat-replay-positioning-component v-else :time="time" :selectedactorid="selectedactorid"></combat-replay-positioning-component>
            <div v-if="showOverviewHelp" class="wvw-summary-modal-backdrop" @click.self="showOverviewHelp = false">
                <div class="wvw-summary-modal combat-replay-overview-help-modal" role="dialog" aria-modal="true" aria-label="Combat replay compact card help">
                    <button type="button" class="wvw-summary-modal-close" aria-label="Close compact card help" @click="showOverviewHelp = false">&times;</button>
                    <div class="wvw-summary-modal-title">Compact Card Help</div>
                    <div class="wvw-summary-modal-subtitle">
                        The Overview view uses compact player and target cards to show quick state snapshots at the current replay time.
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Player cards</div>
                        <div class="combat-replay-overview-help-text">The colored inner border tracks current stability stacks:</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Red</strong>: no stability</li>
                            <li><strong>Yellow</strong>: 1 to 2 stacks</li>
                            <li><strong>Green</strong>: 3 to 9 stacks</li>
                            <li><strong>Purple</strong>: 10 or more stacks</li>
                        </ul>
                        <div class="combat-replay-overview-help-text">The number in the center of the compact player card is the player's current <strong>Might</strong> stack count.</div>
                        <div class="combat-replay-overview-help-text">Player boon and condition icons that may appear in compact view:</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Left side boons</strong>: Protection, Aegis</li>
                            <li><strong>Upper-right guard icon</strong>: Guard! / Guard</li>
                            <li><strong>Right side conditions</strong>: Poison, Immobilize</li>
                            <li><strong>Resistance interaction</strong>: Immobilize is hidden while Resistance is active</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Target cards</div>
                        <div class="combat-replay-overview-help-text">Compact target cards do not use the stability border. They show the target's health/state in the card background and list tracked conditions along the footer.</div>
                        <div class="combat-replay-overview-help-text">Target conditions that may appear in compact view:</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Poison</strong></li>
                            <li><strong>Burning</strong> with stack count</li>
                            <li><strong>Vulnerability</strong> with stack count</li>
                            <li><strong>Immobilize</strong></li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Shared visual cues</div>
                        <ul class="combat-replay-overview-help-list">
                            <li>The card background reflects health and state at the current replay time</li>
                            <li>Green means active, red means downed, black means dead, and gray means disconnected</li>
                            <li>Barrier is shown as the orange-tinted overlay on top of the card</li>
                            <li>Markers shown beside the actor name are the active combat replay markers at that time</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        `,
        data: function () {
            return {
                overviewMode: 0,
                showOverviewHelp: false,
            };
        },
    });

    Vue.component("combat-replay-wvw-analysis-squad-card", {
        mixins: [combatReplayWvWAnalysisMixin],
        props: ["time", "teamkey"],
        template: `
        <div class="combat-replay-wvw-analysis-card">
            <ul class="nav nav-pills d-flex flex-row justify-content-center mb-2 scale85 combat-replay-wvw-team-subtabs">
                <li class="nav-item">
                    <a class="nav-link" :class="{active: teamkey === 'squad'}" @click="$emit('update:teamkey', 'squad')">My Squad</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: teamkey === 'enemy'}" @click="$emit('update:teamkey', 'enemy')">Enemy Team</a>
                </li>
            </ul>
            <div v-if="topBursts.length > 0" class="combat-replay-wvw-analysis-bursts">
                <div class="combat-replay-wvw-analysis-card-title">Top 5 {{teamLabel}} Bursts</div>
                <button v-for="(burst, index) in topBursts" :key="teamkey + '-burst-' + burst.time + '-' + index" type="button" class="combat-replay-wvw-analysis-burst-entry" @click="jumpToBurst(burst.time)">
                    <span class="combat-replay-wvw-analysis-burst-rank">{{index + 1}}.</span>
                    <span class="combat-replay-wvw-analysis-burst-time">{{formatTime(burst.time)}}</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{formatCount(burst.damage)}} damage</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{burst.downs}} ({{burst.downsTotal}}) downs</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{burst.kills}} ({{burst.killsTotal}}) kills</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{burst.strips}} strips</span>
                </button>
            </div>
            <div class="combat-replay-wvw-analysis-card-title">{{teamLabel}} Now (last 3s)</div>
            <div class="combat-replay-wvw-analysis-grid">
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Burst strength</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{formatCount(damage)}} damage
                        <span class="combat-replay-wvw-analysis-pill" :class="'combat-replay-wvw-analysis-pill-' + burstStrength">{{burstStrength}}</span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">{{downs}} ({{downsTotal}}) downs, {{kills}} ({{killsTotal}}) kills</div>
                    <div v-if="topDamageEntries.length > 0" class="combat-replay-wvw-analysis-top-actors">
                        <button v-for="(entry, index) in topDamageEntries" :key="teamkey + '-top-damage-' + entry.uniqueId + '-' + index" type="button" class="combat-replay-wvw-analysis-top-actor-entry combat-replay-wvw-analysis-top-actor-button" @click="selectReplayActor(entry.uniqueId)">
                            <span class="combat-replay-wvw-analysis-top-actor-rank">{{index + 1}}.</span>
                            <span class="combat-replay-wvw-analysis-top-actor-name">{{entry.name}}</span>
                            <span class="combat-replay-wvw-analysis-top-actor-value">{{formatCount(entry.value)}} damage</span>
                        </button>
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Strip to burst</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{formatCount(strips)}} strips
                        <span class="combat-replay-wvw-analysis-pill" :class="stripSynced ? 'combat-replay-wvw-analysis-pill-success' : 'combat-replay-wvw-analysis-pill-muted'">
                            {{stripSynced ? "synced" : "not synced"}}
                        </span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">Peak gap {{stripPeakGap}} ms</div>
                    <div v-if="topStripEntries.length > 0" class="combat-replay-wvw-analysis-top-actors">
                        <button v-for="(entry, index) in topStripEntries" :key="teamkey + '-top-strip-' + entry.uniqueId + '-' + index" type="button" class="combat-replay-wvw-analysis-top-actor-entry combat-replay-wvw-analysis-top-actor-button" @click="selectReplayActor(entry.uniqueId)">
                            <span class="combat-replay-wvw-analysis-top-actor-rank">{{index + 1}}.</span>
                            <span class="combat-replay-wvw-analysis-top-actor-name">{{entry.name}}</span>
                            <span class="combat-replay-wvw-analysis-top-actor-value">{{formatCount(entry.value)}} strips</span>
                        </button>
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Focus fire</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{topTargetName}}
                        <span class="combat-replay-wvw-analysis-pill" :class="focused ? 'combat-replay-wvw-analysis-pill-success' : 'combat-replay-wvw-analysis-pill-muted'">
                            {{focused ? "focused" : "spread"}}
                        </span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">
                        {{formatPercent(topTargetShare)}} top target, {{formatPercent(topThreeShare)}} top 3, {{contributors}} contributors
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Target saturation</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{formatCount(targetCount)}} targets
                        <span class="combat-replay-wvw-analysis-pill" :class="'combat-replay-wvw-analysis-pill-' + targetSaturation">{{targetSaturation}}</span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">Counts players hit in the current 3s window</div>
                </div>
            </div>
        </div>
        `,
        computed: {
            currentTeam: function () {
                return this.getTeamAnalysis(this.teamkey);
            },
            teamLabel: function () {
                return this.currentTeam && this.currentTeam.label ? this.currentTeam.label : (this.teamkey === "enemy" ? "Enemy Team" : "My Squad");
            },
            topBursts: function () {
                return this.currentTeam && this.currentTeam.topBursts ? this.currentTeam.topBursts : [];
            },
            damage: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.damage : null, this.snapshotIndex);
            },
            downs: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.downs : null, this.snapshotIndex);
            },
            downsTotal: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.downsTotal : null, this.snapshotIndex);
            },
            kills: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.kills : null, this.snapshotIndex);
            },
            killsTotal: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.killsTotal : null, this.snapshotIndex);
            },
            burstStrength: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.burstStrength : null, this.snapshotIndex) || "normal";
            },
            strips: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.strips : null, this.snapshotIndex);
            },
            topDamageEntries: function () {
                if (!this.currentTeam) {
                    return [];
                }
                const actorIds = this.getSeriesArrayValue(this.currentTeam.topDamageActorIds, this.snapshotIndex);
                const values = this.getSeriesArrayValue(this.currentTeam.topDamageValues, this.snapshotIndex);
                return actorIds.map((uniqueId, index) => {
                    const actor = this.getActorByUniqueId(uniqueId);
                    if (!actor) {
                        return null;
                    }
                    return {
                        uniqueId: uniqueId,
                        name: actor.name,
                        value: values[index] || 0,
                    };
                }).filter(entry => entry != null);
            },
            stripPeakGap: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.stripPeakGap : null, this.snapshotIndex);
            },
            stripSynced: function () {
                return !!this.getSeriesValue(this.currentTeam ? this.currentTeam.stripSynced : null, this.snapshotIndex);
            },
            topStripEntries: function () {
                if (!this.currentTeam) {
                    return [];
                }
                const actorIds = this.getSeriesArrayValue(this.currentTeam.topStripActorIds, this.snapshotIndex);
                const values = this.getSeriesArrayValue(this.currentTeam.topStripValues, this.snapshotIndex);
                return actorIds.map((uniqueId, index) => {
                    const actor = this.getActorByUniqueId(uniqueId);
                    if (!actor) {
                        return null;
                    }
                    return {
                        uniqueId: uniqueId,
                        name: actor.name,
                        value: values[index] || 0,
                    };
                }).filter(entry => entry != null);
            },
            topTargetId: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.topTargetIds : null, this.snapshotIndex);
            },
            topTargetName: function () {
                const actor = this.getActorByUniqueId(this.topTargetId);
                return actor ? actor.name : "No focus target";
            },
            topTargetShare: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.topTargetShare : null, this.snapshotIndex);
            },
            topThreeShare: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.topThreeTargetShare : null, this.snapshotIndex);
            },
            contributors: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.topTargetContributors : null, this.snapshotIndex);
            },
            focused: function () {
                return !!this.getSeriesValue(this.currentTeam ? this.currentTeam.focused : null, this.snapshotIndex);
            },
            targetCount: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.targetSaturationCount : null, this.snapshotIndex);
            },
            targetSaturation: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.targetSaturation : null, this.snapshotIndex) || "optimal";
            },
        },
    });

    Vue.component("combat-replay-wvw-analysis-selected-card", {
        mixins: [combatReplayWvWAnalysisMixin],
        props: ["time", "selectedactorid", "teamkey"],
        template: `
        <div class="combat-replay-wvw-analysis-card">
            <div class="combat-replay-wvw-analysis-card-title">Selected Actor (last 3s)</div>
            <div v-if="selectedAttacker && selectedAttackerTimeline" class="combat-replay-wvw-analysis-selected">
                <div class="combat-replay-wvw-analysis-selected-header">
                    <img :src="selectedAttacker.icon" :alt="selectedAttacker.profession || selectedAttacker.name" class="combat-replay-wvw-analysis-selected-icon">
                    <div>
                        <div class="combat-replay-wvw-analysis-selected-name">{{selectedAttacker.name}}</div>
                        <div class="combat-replay-wvw-analysis-selected-type">{{attackerTypeLabel}}</div>
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-grid">
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Outgoing damage</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(attackerDamage)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Outgoing boon strips</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(attackerStrips)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Current focus contribution</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatPercent(attackerTopTargetContribution)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Targets hit</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(attackerTargetsHit)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Targets within 1200</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(attackerNearbyTargets)}}</div>
                    </div>
                </div>
            </div>
            <div v-else-if="selectedTarget && selectedTargetTimeline" class="combat-replay-wvw-analysis-selected">
                <div class="combat-replay-wvw-analysis-selected-header">
                    <img :src="selectedTarget.icon" :alt="selectedTarget.name" class="combat-replay-wvw-analysis-selected-icon">
                    <div>
                        <div class="combat-replay-wvw-analysis-selected-name">{{selectedTarget.name}}</div>
                        <div class="combat-replay-wvw-analysis-selected-type">{{targetTypeLabel}}</div>
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-grid">
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Incoming damage</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(targetDamageTaken)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Incoming boon strips</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(targetStripsTaken)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Attackers</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(targetAttackers)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Attackers within 1200</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(targetNearbyAttackers)}}</div>
                    </div>

                                <div class="combat-replay-wvw-analysis-label">Mingled state</div>
                                <div class="combat-replay-wvw-analysis-value">{{isMingled ? 'mingled' : 'separated'}}</div>
                                <div class="combat-replay-wvw-analysis-detail">{{formatCount(enemiesNearCommander)}} enemies within {{positioningAnalysis.mingledRange}} of the commander</div>
                            </div>
                            <div class="combat-replay-wvw-analysis-metric">
                                <div class="combat-replay-wvw-analysis-label">Eligible squad players</div>
                                <div class="combat-replay-wvw-analysis-value">{{formatCount(eligiblePlayers)}}</div>
                                <div class="combat-replay-wvw-analysis-detail">Excludes commander, downed, dead, and players farther than {{positioningAnalysis.ignoreCommanderDistance}}</div>
                            </div>
                            <div class="combat-replay-wvw-analysis-metric">
                                <div class="combat-replay-wvw-analysis-label">In position</div>
                                <div class="combat-replay-wvw-analysis-value">{{formatCount(inPositionCount)}} players</div>
                                <div class="combat-replay-wvw-analysis-detail">{{formatPercent(inPositionRate)}} of eligible players</div>
                            </div>
                            <div class="combat-replay-wvw-analysis-metric">
                                <div class="combat-replay-wvw-analysis-label">Too far</div>
                                <div class="combat-replay-wvw-analysis-value">{{formatCount(tooFarCount)}} players</div>
                                <div class="combat-replay-wvw-analysis-detail">More than {{currentDesiredCommanderDistance}} from commander right now</div>
                            </div>
                            <div class="combat-replay-wvw-analysis-metric">
                                <div class="combat-replay-wvw-analysis-label">Out of position</div>
                                <div class="combat-replay-wvw-analysis-value">{{formatCount(outOfPositionCount)}} players</div>
                                <div class="combat-replay-wvw-analysis-detail">{{formatCount(overextendedCount)}} overextended, {{formatCount(lateralRiskCount)}} left/right exposed</div>
                            </div>
                        </div>
                    </div>
                    <div class="combat-replay-wvw-analysis-card">
                        <div class="combat-replay-wvw-analysis-card-title">Selected Squad Player</div>
                        <div v-if="selectedPlayer && selectedPlayerTimeline" class="combat-replay-wvw-analysis-selected">
                            <div class="combat-replay-wvw-analysis-selected-header">
                                <img :src="selectedPlayer.icon" :alt="selectedPlayer.profession || selectedPlayer.name" class="combat-replay-wvw-analysis-selected-icon">
                                <div>
                                    <div class="combat-replay-wvw-analysis-selected-name">{{selectedPlayer.name}}</div>
                                    <div class="combat-replay-wvw-analysis-selected-type">
                                        {{playerStatusLabel}}
                                    </div>
                                </div>
                            </div>
                            <div class="combat-replay-wvw-analysis-grid">
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Distance to commander</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatCount(distanceToCommander)}}</div>
                                </div>
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Enemies closer than commander</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatCount(enemiesCloserThanCommander)}}</div>
                                </div>
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Enemies ahead of commander</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatCount(enemiesAheadOfCommander)}}</div>
                                </div>
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Running in position</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatPercent(runningInPositionRate)}}</div>
                                </div>
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Running too far</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatPercent(runningTooFarRate)}}</div>
                                </div>
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Running exposure</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatPercent(runningOverextendedRate)}} overextended</div>
                                    <div class="combat-replay-wvw-analysis-detail">{{formatPercent(runningLateralRiskRate)}} left/right exposed</div>
                                </div>
                            </div>
                        </div>
                        <div v-else class="combat-replay-wvw-analysis-helper">
                            Select a non-commander squad player in the replay to view positioning details.
                        </div>
                    </div>
                </template>
                <div v-else-if="positioningMode === 1" class="combat-replay-wvw-analysis-card">
                    <div class="combat-replay-wvw-analysis-card-title">Squad Players Now</div>
                    <div class="combat-replay-positioning-player-grid">
                        <div v-for="playerState in positioningPlayers" :key="'positioning-player-' + playerState.player.uniqueID" class="combat-replay-positioning-player-card" :class="{active: selectedactorid === playerState.player.uniqueID}" @click="selectPositioningPlayer(playerState.player.uniqueID)">
                            <div class="combat-replay-positioning-player-compact">
                                <img :src="playerState.player.icon" :alt="playerState.player.profession || playerState.player.name" class="combat-replay-threat-boon-icon">
                                <span class="combat-replay-positioning-player-name">{{playerState.player.name}}</span>
                                <span class="combat-replay-wvw-analysis-pill" :class="'combat-replay-wvw-analysis-pill-' + playerState.statusClass">{{playerState.compactStatusLabel}}</span>
                            </div>
                            <div class="combat-replay-positioning-player-tooltip">
                                <div class="combat-replay-positioning-player-tooltip-title">{{playerState.player.name}}</div>
                                <div class="combat-replay-positioning-player-values">
                                    <span>{{formatCount(playerState.distanceToCommander)}} from commander</span>
                                    <span>{{formatCount(playerState.enemiesCloserThanCommander)}} closer-than-tag enemies</span>
                                    <span>{{formatCount(playerState.enemiesAheadOfCommander)}} ahead-of-tag enemies</span>
                                </div>
                                <div class="combat-replay-wvw-analysis-detail">{{playerState.detail}}</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div v-else class="combat-replay-wvw-analysis-card">
                    <div class="combat-replay-wvw-analysis-card-title">Player In-Position Summary</div>
                    <div class="combat-replay-positioning-summary-grid">
                        <div v-for="playerSummary in positioningPlayerSummaries" :key="'positioning-summary-' + playerSummary.player.uniqueID" class="combat-replay-positioning-summary-card" :class="{active: selectedactorid === playerSummary.player.uniqueID}" @click="selectPositioningPlayer(playerSummary.player.uniqueID)">
                            <div class="combat-replay-positioning-player-compact">
                                <img :src="playerSummary.player.icon" :alt="playerSummary.player.profession || playerSummary.player.name" class="combat-replay-threat-boon-icon">
                                <span class="combat-replay-positioning-player-name">{{playerSummary.player.name}}</span>
                            </div>
                            <div class="combat-replay-positioning-summary-value">{{formatPercent(playerSummary.inPositionRate)}}</div>
                            <div class="combat-replay-wvw-analysis-detail">{{formatCount(playerSummary.evaluatedSamples)}} evaluated snapshots</div>
                        </div>
                    </div>
                </div>
            </template>
            <div v-if="showPositioningHelp" class="wvw-summary-modal-backdrop" @click.self="showPositioningHelp = false">
                <div class="wvw-summary-modal combat-replay-overview-help-modal" role="dialog" aria-modal="true" aria-label="Combat replay positioning help">
                    <button type="button" class="wvw-summary-modal-close" aria-label="Close positioning help" @click="showPositioningHelp = false">&times;</button>
                    <div class="wvw-summary-modal-title">Positioning Help</div>
                    <div class="wvw-summary-modal-subtitle">
                        The Positioning tab scores squad spacing around the commander during engaged moments, with the commander acting as the anchor instead of a scored player.
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Sub-tabs</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Group Summary</strong> shows the full-fight positioning rates, the current replay snapshot, and a selected-player drilldown</li>
                            <li><strong>Players</strong> shows each squad player's current positioning state at the replay time</li>
                            <li><strong>Player Summary</strong> ranks squad players by their full-fight in-position percentage</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Who gets evaluated</div>
                        <ul class="combat-replay-overview-help-list">
                            <li>Only squad players are considered, and the commander is excluded from scoring</li>
                            <li>A snapshot is only scored when at least one hostile player is within {{positioningAnalysis.engageRange}} of the commander</li>
                            <li>Players are excluded if they are downed, dead, disconnected, or more than {{positioningAnalysis.ignoreCommanderDistance}} from the commander</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">In-position rules</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>In position</strong> means the player is evaluated and not flagged as too far, overextended, or left/right exposed</li>
                            <li><strong>Too far</strong> means farther than {{positioningAnalysis.desiredCommanderDistance}} from the commander, or farther than {{positioningAnalysis.mingledCommanderDistance}} when the groups are mingled</li>
                            <li><strong>Mingled</strong> means more than {{positioningAnalysis.mingledEnemyThreshold}} hostile players are within {{positioningAnalysis.mingledRange}} of the commander</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Out-of-position rules</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Out of position</strong> means any evaluated player flagged as too far, overextended, or left/right exposed</li>
                            <li><strong>Overextended</strong> means the player is on the enemy side of the commander while the groups are not mingled, and it is only counted when fewer than {{positioningAnalysis.overextendedPlayerThreshold}} players are overextended in that snapshot</li>
                            <li><strong>Left/right exposed</strong> means more than {{positioningAnalysis.enemyCountThreshold}} hostile players are closer to the player than to the commander, unless the groups are mingled</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Not evaluated</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Not evaluated</strong> means the current snapshot is not scored for that player because the fight is not engaged yet or the player is excluded for that moment</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        `,
        computed: {
            positioningAnalysis: function () {
                return this.getPositioningAnalysis();
            },
            currentEngagedEnemies: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.engagedEnemyCount : null, this.snapshotIndex);
            },
            enemiesNearCommander: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.enemiesNearCommanderCount : null, this.snapshotIndex);
            },
            isMingled: function () {
                return !!this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.mingled : null, this.snapshotIndex);
            },
            eligiblePlayers: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.eligiblePlayerCount : null, this.snapshotIndex);
            },
            inPositionCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.inPositionCount : null, this.snapshotIndex);
            },
            outOfPositionCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.outOfPositionCount : null, this.snapshotIndex);
            },
            tooFarCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.tooFarCount : null, this.snapshotIndex);
            },
            overextendedCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.overextendedCount : null, this.snapshotIndex);
            },
            lateralRiskCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.lateralRiskCount : null, this.snapshotIndex);
            },
            inPositionRate: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.inPositionRate : null, this.snapshotIndex);
            },
            currentDesiredCommanderDistance: function () {
                if (!this.positioningAnalysis) {
                    return 0;
                }
                return this.isMingled ? this.positioningAnalysis.mingledCommanderDistance : this.positioningAnalysis.desiredCommanderDistance;
            },
            selectedPlayerTimeline: function () {
                if (!this.positioningAnalysis || this.selectedactorid == null) {
                    return null;
                }
                if (this.selectedactorid === this.positioningAnalysis.commanderId) {
                    return null;
                }
                return this.positioningAnalysis.players[this.selectedactorid] || null;
            },
            selectedPlayer: function () {
                return this.selectedPlayerTimeline ? this.getPlayerByUniqueId(this.selectedactorid) : null;
            },
            distanceToCommander: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.distanceToCommander, this.snapshotIndex) : 0;
            },
            enemiesCloserThanCommander: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.enemiesCloserThanCommander, this.snapshotIndex) : 0;
            },
            enemiesAheadOfCommander: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.enemiesAheadOfCommander, this.snapshotIndex) : 0;
            },
            runningInPositionRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningInPositionRate, this.snapshotIndex) : 0;
            },
            runningTooFarRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningTooFarRate, this.snapshotIndex) : 0;
            },
            runningOverextendedRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningOverextendedRate, this.snapshotIndex) : 0;
            },
            runningLateralRiskRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningLateralRiskRate, this.snapshotIndex) : 0;
            },
            playerStatusLabel: function () {
                if (!this.selectedPlayerTimeline) {
                    return "";
                }
                if (!this.getSeriesValue(this.selectedPlayerTimeline.eligible, this.snapshotIndex)) {
                    return "not currently evaluated";
                }
                const reasons = [];
                if (this.getSeriesValue(this.selectedPlayerTimeline.tooFar, this.snapshotIndex)) {
                    reasons.push("too far");
                }
                if (this.getSeriesValue(this.selectedPlayerTimeline.overextended, this.snapshotIndex)) {
                    reasons.push("overextended");
                }
                if (this.getSeriesValue(this.selectedPlayerTimeline.lateralRisk, this.snapshotIndex)) {
                    reasons.push("left/right exposed");
                }
                return reasons.length > 0 ? reasons.join(", ") : "in position";
            },
            positioningPlayers: function () {
                if (!this.positioningAnalysis) {
                    return [];
                }
                return logData.players
                    .filter(player => !player.isFake && !player.notInSquad && player.uniqueID !== this.positioningAnalysis.commanderId)
                    .map(player => {
                        const timeline = this.positioningAnalysis.players[player.uniqueID];
                        if (!timeline) {
                            return null;
                        }
                        const eligible = !!this.getSeriesValue(timeline.eligible, this.snapshotIndex);
                        const tooFar = !!this.getSeriesValue(timeline.tooFar, this.snapshotIndex);
                        const overextended = !!this.getSeriesValue(timeline.overextended, this.snapshotIndex);
                        const lateralRisk = !!this.getSeriesValue(timeline.lateralRisk, this.snapshotIndex);
                        const inPosition = !!this.getSeriesValue(timeline.inPosition, this.snapshotIndex);
                        let statusLabel = "not evaluated";
                        let statusClass = "normal";
                        let detail = "Excluded right now because the player is downed, dead, disconnected, or too far from the commander.";
                        if (eligible) {
                            if (inPosition) {
                                statusLabel = "in position";
                                statusClass = "success";
                                detail = "Close enough to the commander and not currently flagged as exposed.";
                            } else {
                                statusLabel = "out of position";
                                statusClass = "weak";
                                const reasons = [];
                                if (tooFar) {
                                    reasons.push("too far from commander");
                                }
                                if (overextended) {
                                    reasons.push("overextended ahead of the commander");
                                }
                                if (lateralRisk) {
                                    reasons.push("too far left/right of the commander");
                                }
                                detail = reasons.join(", ");
                            }
                        }
                        return {
                            player: player,
                            statusLabel: statusLabel,
                            compactStatusLabel: eligible ? (inPosition ? "IP" : "OOP") : "NE",
                            statusClass: statusClass,
                            detail: detail,
                            distanceToCommander: this.getSeriesValue(timeline.distanceToCommander, this.snapshotIndex),
                            enemiesCloserThanCommander: this.getSeriesValue(timeline.enemiesCloserThanCommander, this.snapshotIndex),
                            enemiesAheadOfCommander: this.getSeriesValue(timeline.enemiesAheadOfCommander, this.snapshotIndex),
                        };
                    })
                    .filter(playerState => playerState != null)
                    .sort((left, right) => left.player.name.localeCompare(right.player.name));
            },
            positioningPlayerSummaries: function () {
                if (!this.positioningAnalysis) {
                    return [];
                }
                return logData.players
                    .filter(player => !player.isFake && !player.notInSquad && player.uniqueID !== this.positioningAnalysis.commanderId)
                    .map(player => {
                        const timeline = this.positioningAnalysis.players[player.uniqueID];
                        if (!timeline) {
                            return null;
                        }
                        const evaluatedSamples = timeline.eligible.reduce((total, sample) => total + (sample ? 1 : 0), 0);
                        const inPositionSamples = timeline.inPosition.reduce((total, sample, index) => total + (timeline.eligible[index] && sample ? 1 : 0), 0);
                        return {
                            player: player,
                            evaluatedSamples: evaluatedSamples,
                            inPositionRate: evaluatedSamples > 0 ? Math.round((inPositionSamples * 1000.0) / evaluatedSamples) / 10.0 : 0,
                        };
                    })
                    .filter(playerSummary => playerSummary != null)
                    .sort((left, right) => {
                        if (right.inPositionRate !== left.inPositionRate) {
                            return right.inPositionRate - left.inPositionRate;
                        }
                        return left.player.name.localeCompare(right.player.name);
                    });
            },
        },
        data: function () {
            return {
                positioningMode: 0,
                showPositioningHelp: false,
            };
        },
        methods: {
            selectPositioningPlayer: function (uniqueId) {
                if (!animator) {
                    return;
                }
                animator.selectActor(uniqueId);
            },
        },
    });

    Vue.component("combat-replay-status-data-component", {
        template: `${template}`,
        props: ["time", "selectedactorid"],
        data: function() {
            return {
                targetless: logData.targetless,
                mode: 0,
            };
        },
        computed: {
            hasAnalysis: function () {
                return !!(crData && crData.analysis);
            },
        },
    });
</script>
