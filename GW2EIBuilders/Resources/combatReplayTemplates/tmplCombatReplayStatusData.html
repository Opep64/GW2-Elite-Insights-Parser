<template>
    <div class="d-flex flex-column justify-content-center">
        <ul class="nav nav-pills d-flex flex-row justify-content-center mb-1">
            <li class="nav-item">
                <a class="nav-link" :class="{active: mode === 0}" @click="mode = 0">Players</a>
            </li>
            <li v-if="!targetless" class="nav-item">
                <a class="nav-link" :class="{active: mode === 1}" @click="mode = 1">Targets</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" :class="{active: mode === 2}" @click="mode = 2">Mechanics</a>
            </li>
        </ul>
        <div class="squad-details">
            <keep-alive>
                <combat-replay-players-stats-component v-if="mode === 0" :key="'players-cr-details'" :time="time" :selectedplayerid="selectedactorid"></combat-replay-players-stats-component>
                <combat-replay-targets-stats-component v-if="mode === 1" :key="'targets-cr-details'" :time="time" :selectedtargetid="selectedactorid"></combat-replay-targets-stats-component>
                <combat-replay-mechanics-list-component v-if="mode === 2" :key="'mechanics-cr-details'" :selectedplayerid="selectedactorid"></combat-replay-mechanics-list-component>
            </keep-alive>
        </div>
    </div>
</template>

<script>
    const combatReplayWvWAnalysisMixin = {
        computed: {
            crAnalysis: function () {
                return crData && crData.analysis ? crData.analysis : null;
            },
            snapshotIndex: function () {
                if (!this.crAnalysis || !this.crAnalysis.times || this.crAnalysis.times.length === 0) {
                    return -1;
                }
                return this.findNearestSnapshotIndex(this.crAnalysis.times, this.time);
            },
        },
        methods: {
            normalizeSearchValue: function (value) {
                return String(value || "").toLowerCase();
            },
            findNearestSnapshotIndex: function (times, time) {
                let low = 0;
                let high = times.length - 1;
                while (low < high) {
                    const mid = Math.floor((low + high) / 2);
                    if (times[mid] < time) {
                        low = mid + 1;
                    } else {
                        high = mid;
                    }
                }
                if (low === 0) {
                    return 0;
                }
                return Math.abs(times[low] - time) < Math.abs(times[low - 1] - time) ? low : low - 1;
            },
            getPlayerByUniqueId: function (uniqueId) {
                return logData.players.find(player => String(player.uniqueID) === String(uniqueId)) || null;
            },
            getTargetByUniqueId: function (uniqueId) {
                return logData.targets.find(target => String(target.uniqueID) === String(uniqueId)) || null;
            },
            getActorByUniqueId: function (uniqueId) {
                return this.getPlayerByUniqueId(uniqueId) || this.getTargetByUniqueId(uniqueId);
            },
            getSeriesValue: function (series, index) {
                if (!series || index < 0 || index >= series.length) {
                    return 0;
                }
                return series[index];
            },
            getSeriesArrayValue: function (series, index) {
                if (!series || index < 0 || index >= series.length || !series[index]) {
                    return [];
                }
                return series[index];
            },
            formatCount: function (value) {
                return Number(value || 0).toLocaleString();
            },
            formatPercent: function (value) {
                return (Number(value || 0)).toFixed(1) + "%";
            },
            formatTime: function (time) {
                return (Number(time || 0) / 1000.0).toFixed(3) + "s";
            },
            formatDurationSeconds: function (time) {
                return (Number(time || 0) / 1000.0).toFixed(1) + "s";
            },
            jumpToBurst: function (time) {
                if (!animator) {
                    return;
                }
                animator.stopAnimate(true);
                animator.updateTime(time);
                animator.updateTextInput();
            },
            selectReplayActor: function (uniqueId) {
                if (!animator || uniqueId == null) {
                    return;
                }
                if (this.$root && this.$root.mode === 2 && animator.focusActorAtScale) {
                    animator.focusActorAtScale(uniqueId, 179.7);
                    return;
                }
                animator.selectActor(uniqueId);
            },
            isPlayerActor: function (actor) {
                return !!(actor && logData.players.some(player => player.uniqueID === actor.uniqueID));
            },
            getTeamAnalysis: function (teamKey) {
                if (!this.crAnalysis) {
                    return null;
                }
                return teamKey === "enemy" ? this.crAnalysis.enemy : this.crAnalysis.squad;
            },
            getThreatAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.threatBoons ? this.crAnalysis.threatBoons : null;
            },
            getPositioningAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.positioning ? this.crAnalysis.positioning : null;
            },
            getEventAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.events ? this.crAnalysis.events : null;
            },
            getDefenseAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.defense ? this.crAnalysis.defense : null;
            },
            formatAmount: function (value) {
                return Number(value || 0).toLocaleString(undefined, {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 1,
                });
            },
            formatDamageShare: function (amount, total) {
                const denominator = Number(total || 0);
                if (denominator <= 0) {
                    return this.formatPercent(0);
                }
                return this.formatPercent((Number(amount || 0) * 100.0) / denominator);
            },
            getSummaryToggleGroupStyle: function () {
                return {
                    display: "inline-flex",
                    alignItems: "center",
                    gap: "0.25rem",
                    padding: "0.2rem",
                    borderRadius: "999px",
                    background: "rgba(255, 255, 255, 0.06)",
                    border: "1px solid rgba(255, 255, 255, 0.14)",
                    boxShadow: "0 10px 24px rgba(0, 0, 0, 0.18)",
                };
            },
            getSummaryToggleButtonStyle: function (isActive) {
                return {
                    minWidth: "5.75rem",
                    padding: "0.28rem 0.72rem",
                    borderRadius: "999px",
                    border: isActive ? "1px solid rgba(118, 182, 128, 0.95)" : "1px solid rgba(255, 255, 255, 0.08)",
                    background: isActive ? "linear-gradient(135deg, rgba(90, 146, 98, 0.94), rgba(114, 168, 118, 0.9))" : "rgba(255, 255, 255, 0.03)",
                    color: isActive ? "#08100a" : "#d9e4f2",
                    fontWeight: isActive ? "700" : "600",
                    fontSize: "0.82rem",
                    letterSpacing: "0.01em",
                    boxShadow: isActive ? "0 8px 18px rgba(84, 130, 92, 0.24)" : "none",
                };
            },
        }
    };

    Vue.component("combat-replay-overview-stats-component", {
        props: ["time", "selectedactorid", "targetless"],
        template: `
        <div class="d-flex flex-column">
            <combat-replay-players-stats-component :time="time" :selectedplayerid="selectedactorid" :analysis="true"></combat-replay-players-stats-component>
            <combat-replay-targets-stats-component v-if="!targetless" :time="time" :selectedtargetid="selectedactorid" :analysis="true"></combat-replay-targets-stats-component>
        </div>
        `,
    });

    function getCombatReplayAnalysisNavigationState() {
        if (!window.reactiveCombatReplayAnalysisNavigation && window.Vue && Vue.observable) {
            window.reactiveCombatReplayAnalysisNavigation = Vue.observable({
                overviewMode: null,
                selectedActorId: null,
                stickySelectedActorId: null,
            });
        }
        return window.reactiveCombatReplayAnalysisNavigation || {
            overviewMode: null,
            selectedActorId: null,
            stickySelectedActorId: null,
        };
    }

    Vue.component("combat-replay-analysis-panel-component", {
        props: ["time", "selectedactorid", "targetless", "hasanalysis"],
        template: `
        <div class="d-flex flex-column">
            <ul v-if="hasanalysis" class="nav nav-pills d-flex flex-row justify-content-center mb-2 scale85 combat-replay-wvw-analysis-subtabs">
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 0}" @click="overviewMode = 0">Overview</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 1}" @click="overviewMode = 1">Burst</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 2}" @click="overviewMode = 2">Weighted Boons</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 3}" @click="overviewMode = 3">Positioning</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 4}" @click="overviewMode = 4">Events</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 5}" @click="overviewMode = 5">Defense</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 6}" @click="overviewMode = 6">Player</a>
                </li>
            </ul>
            <div v-if="!hasanalysis || overviewMode === 0" class="d-flex flex-column">
                <div class="combat-replay-overview-help-row">
                    <button type="button" class="combat-replay-overview-help-button" title="Compact card help" aria-label="Show compact card help" @click="showOverviewHelp = true">?</button>
                </div>
                <combat-replay-overview-stats-component :time="time" :selectedactorid="selectedactorid" :targetless="targetless"></combat-replay-overview-stats-component>
            </div>
            <keep-alive>
                <combat-replay-wvw-analysis-component v-if="hasanalysis && overviewMode === 1" :time="time" :selectedactorid="selectedactorid"></combat-replay-wvw-analysis-component>
                <combat-replay-threat-boons-component v-else-if="hasanalysis && overviewMode === 2" :time="time" :selectedactorid="selectedactorid"></combat-replay-threat-boons-component>
                <combat-replay-positioning-component v-else-if="hasanalysis && overviewMode === 3" :time="time" :selectedactorid="selectedactorid"></combat-replay-positioning-component>
                <combat-replay-events-component v-else-if="hasanalysis && overviewMode === 4" :time="time" :selectedactorid="selectedactorid"></combat-replay-events-component>
                <combat-replay-defense-component v-else-if="hasanalysis && overviewMode === 5" :time="time" :selectedactorid="selectedactorid"></combat-replay-defense-component>
                <combat-replay-player-analysis-component v-else-if="hasanalysis && overviewMode === 6" :time="time" :selectedactorid="selectedactorid"></combat-replay-player-analysis-component>
            </keep-alive>
            <div v-if="showOverviewHelp" class="wvw-summary-modal-backdrop" @click.self="showOverviewHelp = false">
                <div class="wvw-summary-modal combat-replay-overview-help-modal" role="dialog" aria-modal="true" aria-label="Combat replay compact card help">
                    <button type="button" class="wvw-summary-modal-close" aria-label="Close compact card help" @click="showOverviewHelp = false">&times;</button>
                    <div class="wvw-summary-modal-title">Compact Card Help</div>
                    <div class="wvw-summary-modal-subtitle">
                        The Overview view uses compact player and target cards to show quick state snapshots at the current replay time.
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Player cards</div>
                        <div class="combat-replay-overview-help-text">The colored inner border tracks current stability stacks:</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Red</strong>: no stability</li>
                            <li><strong>Yellow</strong>: 1 to 2 stacks</li>
                            <li><strong>Green</strong>: 3 to 9 stacks</li>
                            <li><strong>Purple</strong>: 10 or more stacks</li>
                        </ul>
                        <div class="combat-replay-overview-help-text">The number in the center of the compact player card is the player's current <strong>Might</strong> stack count.</div>
                        <div class="combat-replay-overview-help-text">Player boon and condition icons that may appear in compact view:</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Left side boons</strong>: Protection, Aegis</li>
                            <li><strong>Upper-right guard icon</strong>: Guard! / Guard</li>
                            <li><strong>Right side conditions</strong>: Poison, Immobilize</li>
                            <li><strong>Resistance interaction</strong>: Immobilize is hidden while Resistance is active</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Target cards</div>
                        <div class="combat-replay-overview-help-text">Compact target cards do not use the stability border. They show the target's health/state in the card background and list tracked conditions along the footer.</div>
                        <div class="combat-replay-overview-help-text">Target conditions that may appear in compact view:</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Poison</strong></li>
                            <li><strong>Burning</strong> with stack count</li>
                            <li><strong>Vulnerability</strong> with stack count</li>
                            <li><strong>Immobilize</strong></li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Shared visual cues</div>
                        <ul class="combat-replay-overview-help-list">
                            <li>The card background reflects health and state at the current replay time</li>
                            <li>Green means active, red means downed, black means dead, and gray means disconnected</li>
                            <li>Barrier is shown as the orange-tinted overlay on top of the card</li>
                            <li>Markers shown beside the actor name are the active combat replay markers at that time</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        `,
        data: function () {
            const navigationState = getCombatReplayAnalysisNavigationState();
            return {
                overviewMode: typeof navigationState.overviewMode === "number" ? navigationState.overviewMode : 0,
                showOverviewHelp: false,
                analysisScrollTopByMode: {},
            };
        },
        computed: {
            requestedOverviewMode: function () {
                return getCombatReplayAnalysisNavigationState().overviewMode;
            },
            requestedSelectedActorId: function () {
                return getCombatReplayAnalysisNavigationState().selectedActorId;
            },
        },
        mounted: function () {
            if (this.requestedSelectedActorId != null) {
                this.applyRequestedSelectedActor(this.requestedSelectedActorId);
            }
        },
        methods: {
            applyRequestedSelectedActor: function (newActorId) {
                if (newActorId == null) {
                    return;
                }
                if (typeof reactiveAnimationData !== "undefined") {
                    reactiveAnimationData.selectedActorID = newActorId;
                }
                this.$nextTick(function () {
                    const navigationState = getCombatReplayAnalysisNavigationState();
                    const trySelectActor = function (remainingAttempts) {
                        if (!animator) {
                            if (remainingAttempts > 0) {
                                setTimeout(function () {
                                    trySelectActor(remainingAttempts - 1);
                                }, 50);
                            }
                            return;
                        }
                        const actorReady = typeof animator.getActorData !== "function" || !!animator.getActorData(newActorId);
                        if (!actorReady) {
                            if (remainingAttempts > 0) {
                                setTimeout(function () {
                                    trySelectActor(remainingAttempts - 1);
                                }, 50);
                            }
                            return;
                        }
                        animator.stopAnimate(true);
                        if (typeof animator.focusActorAtScale === "function") {
                            animator.focusActorAtScale(newActorId, 179.7);
                        } else if (typeof animator.selectActor === "function") {
                            animator.selectActor(newActorId, true);
                        }
                        if (typeof animator.updateTextInput === "function") {
                            animator.updateTextInput();
                        }
                        if (navigationState.selectedActorId === newActorId) {
                            navigationState.selectedActorId = null;
                        }
                    };
                    trySelectActor(20);
                });
            },
            navigateToPlayer: function (actorId) {
                this.overviewMode = 6;
                this.applyRequestedSelectedActor(actorId);
            },
        },
        watch: {
            requestedOverviewMode: function (newMode) {
                if (typeof newMode !== "number") {
                    return;
                }
                this.overviewMode = newMode;
                this.$nextTick(function () {
                    const navigationState = getCombatReplayAnalysisNavigationState();
                    if (navigationState.overviewMode === newMode) {
                        navigationState.overviewMode = null;
                    }
                });
            },
            requestedSelectedActorId: function (newActorId) {
                this.applyRequestedSelectedActor(newActorId);
            },
            overviewMode: function (newMode, oldMode) {
                if (typeof oldMode === "number") {
                    this.$set(this.analysisScrollTopByMode, oldMode, window.pageYOffset || document.documentElement.scrollTop || 0);
                }
                this.$nextTick(() => {
                    if (Object.prototype.hasOwnProperty.call(this.analysisScrollTopByMode, newMode)) {
                        window.scrollTo(0, this.analysisScrollTopByMode[newMode]);
                    }
                });
            },
        },
    });

    Vue.component("combat-replay-wvw-analysis-squad-card", {
        mixins: [combatReplayWvWAnalysisMixin],
        props: ["time", "teamkey"],
        template: `
        <div class="combat-replay-wvw-analysis-card">
            <ul class="nav nav-pills d-flex flex-row justify-content-center mb-2 scale85 combat-replay-wvw-team-subtabs">
                <li class="nav-item">
                    <a class="nav-link" :class="{active: teamkey === 'squad'}" @click="$emit('update:teamkey', 'squad')">Our Squad</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: teamkey === 'enemy'}" @click="$emit('update:teamkey', 'enemy')">Enemy Team</a>
                </li>
            </ul>
            <div v-if="topBursts.length > 0" class="combat-replay-wvw-analysis-bursts">
                <div class="combat-replay-wvw-analysis-card-title">Top 5 {{teamLabel}} Bursts</div>
                <button v-for="(burst, index) in topBursts" :key="teamkey + '-burst-' + burst.time + '-' + index" type="button" class="combat-replay-wvw-analysis-burst-entry" @click="jumpToBurst(burst.time)">
                    <span class="combat-replay-wvw-analysis-burst-rank">{{index + 1}}.</span>
                    <span class="combat-replay-wvw-analysis-burst-time">{{formatTime(burst.time)}}</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{formatCount(burst.damage)}} damage</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{burst.downs}} ({{burst.downsTotal}}) downs</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{burst.kills}} ({{burst.killsTotal}}) kills</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{burst.strips}} strips</span>
                </button>
            </div>
            <div class="combat-replay-wvw-analysis-card-title">{{teamLabel}} Now (last 3s)</div>
            <div class="combat-replay-wvw-analysis-grid">
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Burst strength</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{formatCount(damage)}} damage
                        <span class="combat-replay-wvw-analysis-pill" :class="'combat-replay-wvw-analysis-pill-' + burstStrength">{{burstStrength}}</span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">{{downs}} ({{downsTotal}}) downs, {{kills}} ({{killsTotal}}) kills</div>
                    <div v-if="topDamageEntries.length > 0" class="combat-replay-wvw-analysis-top-actors">
                        <button v-for="(entry, index) in topDamageEntries" :key="teamkey + '-top-damage-' + entry.uniqueId + '-' + index" type="button" class="combat-replay-wvw-analysis-top-actor-entry combat-replay-wvw-analysis-top-actor-button" @click="selectReplayActor(entry.uniqueId)">
                            <span class="combat-replay-wvw-analysis-top-actor-rank">{{index + 1}}.</span>
                            <span class="combat-replay-wvw-analysis-top-actor-name">{{entry.name}}</span>
                            <span class="combat-replay-wvw-analysis-top-actor-value">{{formatCount(entry.value)}} damage</span>
                        </button>
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Strip to burst</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{formatCount(strips)}} strips
                        <span class="combat-replay-wvw-analysis-pill" :class="stripSynced ? 'combat-replay-wvw-analysis-pill-success' : 'combat-replay-wvw-analysis-pill-muted'">
                            {{stripSynced ? "synced" : "not synced"}}
                        </span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">Peak gap {{stripPeakGap}} ms</div>
                    <div v-if="topStripEntries.length > 0" class="combat-replay-wvw-analysis-top-actors">
                        <button v-for="(entry, index) in topStripEntries" :key="teamkey + '-top-strip-' + entry.uniqueId + '-' + index" type="button" class="combat-replay-wvw-analysis-top-actor-entry combat-replay-wvw-analysis-top-actor-button" @click="selectReplayActor(entry.uniqueId)">
                            <span class="combat-replay-wvw-analysis-top-actor-rank">{{index + 1}}.</span>
                            <span class="combat-replay-wvw-analysis-top-actor-name">{{entry.name}}</span>
                            <span class="combat-replay-wvw-analysis-top-actor-value">{{formatCount(entry.value)}} strips</span>
                        </button>
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Focus fire</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{topTargetName}}
                        <span class="combat-replay-wvw-analysis-pill" :class="focused ? 'combat-replay-wvw-analysis-pill-success' : 'combat-replay-wvw-analysis-pill-muted'">
                            {{focused ? "focused" : "spread"}}
                        </span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">
                        {{formatPercent(topTargetShare)}} top target, {{formatPercent(topThreeShare)}} top 3, {{contributors}} contributors
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Target saturation</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{formatCount(targetCount)}} targets
                        <span class="combat-replay-wvw-analysis-pill" :class="'combat-replay-wvw-analysis-pill-' + targetSaturation">{{targetSaturation}}</span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">Counts players hit in the current 3s window</div>
                </div>
            </div>
        </div>
        `,
        computed: {
            currentTeam: function () {
                return this.getTeamAnalysis(this.teamkey);
            },
            teamLabel: function () {
                    return this.currentTeam && this.currentTeam.label ? this.currentTeam.label : (this.teamkey === "enemy" ? "Enemy Team" : "Our Squad");
            },
            topBursts: function () {
                return this.currentTeam && this.currentTeam.topBursts ? this.currentTeam.topBursts : [];
            },
            damage: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.damage : null, this.snapshotIndex);
            },
            downs: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.downs : null, this.snapshotIndex);
            },
            downsTotal: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.downsTotal : null, this.snapshotIndex);
            },
            kills: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.kills : null, this.snapshotIndex);
            },
            killsTotal: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.killsTotal : null, this.snapshotIndex);
            },
            burstStrength: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.burstStrength : null, this.snapshotIndex) || "normal";
            },
            strips: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.strips : null, this.snapshotIndex);
            },
            topDamageEntries: function () {
                if (!this.currentTeam) {
                    return [];
                }
                const actorIds = this.getSeriesArrayValue(this.currentTeam.topDamageActorIds, this.snapshotIndex);
                const values = this.getSeriesArrayValue(this.currentTeam.topDamageValues, this.snapshotIndex);
                return actorIds.map((uniqueId, index) => {
                    const actor = this.getActorByUniqueId(uniqueId);
                    if (!actor) {
                        return null;
                    }
                    return {
                        uniqueId: uniqueId,
                        name: actor.name,
                        value: values[index] || 0,
                    };
                }).filter(entry => entry != null);
            },
            stripPeakGap: function () {

                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningThreatTime, this.snapshotIndex) : 0;
            },
            selectedPlayerBoons: function () {
                if (!this.selectedPlayerTimeline || !this.selectedPlayerTimeline.boons) {
                    return [];
                }
                return this.selectedPlayerTimeline.boons.map(boon => ({
                    id: boon.id,
                    name: boon.name,
                    icon: boon.icon,
                    stackBased: boon.stackBased,
                    tracksOverapplication: boon.tracksOverapplication,
                    overapplicationThreshold: boon.overapplicationThreshold,
                    currentStacks: this.getSeriesValue(boon.currentStacks, this.snapshotIndex),
                    runningCoverage: this.getSeriesValue(boon.runningCoverage, this.snapshotIndex),
                    runningOverapplication: this.getSeriesValue(boon.runningOverapplication, this.snapshotIndex),
                }));
            },
        },
        methods: {
            getBoonCurrentCoverage: function (boon) {
                return this.getSeriesValue(boon.currentCoverage, this.snapshotIndex);
            },
            getBoonRunningCoverage: function (boon) {
                return this.getSeriesValue(boon.runningCoverage, this.snapshotIndex);
            },
            getBoonAverageStacks: function (boon) {
                return this.getSeriesValue(boon.currentAverageStacks, this.snapshotIndex);
            },
            getBoonCurrentOverapplication: function (boon) {
                return this.getSeriesValue(boon.currentOverapplication, this.snapshotIndex);
            },
        },
        data: function () {
            return {
                showWeightedBoonsHelp: false,
            };
        },
    });

        computed: {
            eventAnalysis: function () {
                return this.getEventAnalysis();

            downAnalysis: function () {
                return this.eventAnalysis && this.eventAnalysis.downs ? this.eventAnalysis.downs : { combinedSummary: null, squadSummary: null, enemySummary: null, events: [] };
            },
            downSummary: function () {
                const summaries = {
                    combined: this.downAnalysis.combinedSummary,
                    squad: this.downAnalysis.squadSummary,
                    enemy: this.downAnalysis.enemySummary,
                };
                return summaries[this.summaryView] || {
                    squadDowns: 0,
                    enemyDowns: 0,
                    ccImpactedDowns: 0,
                    conditionImpactedDowns: 0,
                    mysticRebukeDowns: 0,
                    hardCcDowns: 0,
                    softCcDowns: 0,
                    bothCcDowns: 0,
                    conditionMajorityDowns: 0,
                    mysticRebukeHeavyDowns: 0,
                    totalDamage: 0,
                    totalConditionDamage: 0,
                    totalBurningDamage: 0,
                    totalMysticRebukeDamage: 0,
                    averageMysticRebukeDamage: 0,
                    averageEffectiveSoftCcSeconds: 0,
                    offensiveProtocolObliterateHitCount: 0,
                    offensiveProtocolObliterateBarrierRemovedHitCount: 0,
                    topContributors: [],
                    mysticRebukeContributors: [],
                    conditionContributors: [],
                    topConditions: [],
                    topHardCcSources: [],
                    topSoftCcSources: [],
                    takeaways: [],
                };
            },
            allEvents: function () {
                return this.downAnalysis.events || [];
            },
            downSkillFilterOptions: function () {
                const skillNames = new Set();
                this.allEvents.forEach(event => {
                    this.getEventSkillNames(event).forEach(skillName => skillNames.add(skillName));
                });
                return Array.from(skillNames).sort((left, right) => left.localeCompare(right));
            },
            events: function () {
                if (!this.selectedDownSkillFilter) {
                    return this.allEvents;
                }
                return this.allEvents.filter(event => this.eventMatchesSelectedSkill(event, this.selectedDownSkillFilter));
            },
            selectedEvent: function () {
                if (this.events.length === 0) {
                    return null;
                }
                if (!this.selectedEventKey) {
                    return this.events[0];
                }
                return this.events.find(event => this.getEventKey(event) === this.selectedEventKey) || this.events[0];
            },
        },
        activated: function () {
            this.restoreEventScroll();
        },
        deactivated: function () {
            this.captureEventScroll();
        },
        methods: {
            captureEventScroll: function () {
                if (this.$refs.eventList) {
                    this.eventListScrollTop = this.$refs.eventList.scrollTop;
                }
                if (this.$refs.eventDetail) {
                    this.eventDetailScrollTop = this.$refs.eventDetail.scrollTop;
                }
            },
            restoreEventScroll: function () {
                this.$nextTick(() => {
                    const applyScroll = () => {
                        if (this.$refs.eventList) {
                            this.$refs.eventList.scrollTop = this.eventListScrollTop || 0;
                        }
                        if (this.$refs.eventDetail) {
                            this.$refs.eventDetail.scrollTop = this.eventDetailScrollTop || 0;
                        }
                    };
                    applyScroll();
                    if (window.requestAnimationFrame) {
                        window.requestAnimationFrame(applyScroll);
                    }
                });
            },
            openEvent: function (event) {
                this.captureEventScroll();
                this.selectedEventKey = this.getEventKey(event);
                this.jumpToBurst(event.time);
                this.selectReplayActor(event.actorId);
            },
            focusContributor: function (contributor) {
                if (contributor && contributor.actorId) {
                    this.selectReplayActor(contributor.actorId);
                }
            },
            focusSummaryActor: function (entry) {
                if (entry && entry.actorId) {
                    this.selectReplayActor(entry.actorId);
                }
            },
            formatStrikeDamage: function (event) {
                if (!event) {
                    return this.formatCount(0);
                }
                const strikeDamage = this.formatCount(event.strikeDamageTaken);
                if (!event.mysticRebukeDamageTaken) {
                    return strikeDamage;
                }
                return strikeDamage + " (" + this.formatCount(event.mysticRebukeDamageTaken) + " MR)";
            },
            formatContributorDamageSplit: function (contributor) {
                if (!contributor || !contributor.details || contributor.details.length === 0) {
                    return "";
                }
                const strike = contributor.details.find(detail => detail.name === "Strike");
                const condition = contributor.details.find(detail => detail.name === "Condition");
                return "Strike " + this.formatAmount(strike ? strike.amount : 0) + ", Condition " + this.formatAmount(condition ? condition.amount : 0);
            },
            getContributorStrikeAmount: function (contributor) {
                if (!contributor || !contributor.details) {
                    return 0;
                }
                const strike = contributor.details.find(detail => detail.name === "Strike");
                return strike ? strike.amount : 0;
            },
            getContributorConditionAmount: function (contributor) {
                if (!contributor || !contributor.details) {
                    return 0;
                }
                const condition = contributor.details.find(detail => detail.name === "Condition");
                return condition ? condition.amount : 0;
            },
            hasContributorDamageSplit: function (contributor) {
                return this.getContributorStrikeAmount(contributor) > 0 || this.getContributorConditionAmount(contributor) > 0;
            },
            getEventSkillNames: function (event) {
                const skillNames = new Set();
                const addSkillName = (name) => {
                    if (name && name.trim()) {
                        skillNames.add(name.trim());
                    }
                };
                (event && event.damageTimeline ? event.damageTimeline : []).forEach(entry => addSkillName(entry.label));
                (event && event.crowdControlEffects ? event.crowdControlEffects : []).forEach(entry => addSkillName(entry.label));
                (event && event.conditionDamageBreakdown ? event.conditionDamageBreakdown : []).forEach(entry => addSkillName(entry.name));
                return Array.from(skillNames);
            },
            findDownSkillFilterMatch: function (query) {
                const normalizedQuery = query ? query.trim().toLowerCase() : "";
                if (!normalizedQuery) {
                    return "";
                }
                return this.downSkillFilterOptions.find(skillName => skillName.toLowerCase() === normalizedQuery) || "";
            },
            eventMatchesSelectedSkill: function (event, selectedSkill) {
                const normalizedSkill = selectedSkill ? selectedSkill.toLowerCase() : "";
                if (!normalizedSkill) {
                    return true;
                }
                return this.getEventSkillNames(event).some(skillName => skillName.toLowerCase() === normalizedSkill);
            },
            onDownSkillFilterInput: function () {
                this.selectedDownSkillFilter = this.findDownSkillFilterMatch(this.downSkillFilterQuery);
                this.selectedEventKey = null;
                this.eventListScrollTop = 0;
                this.eventDetailScrollTop = 0;
                this.restoreEventScroll();
            },
            clearDownSkillFilter: function () {
                this.downSkillFilterQuery = "";
                this.selectedDownSkillFilter = "";
                this.selectedEventKey = null;
                this.eventListScrollTop = 0;
                this.eventDetailScrollTop = 0;
                this.restoreEventScroll();
            },
            getEventKey: function (event) {
                return [event.time, event.actorId, event.side].join("-");
            },
            isSelectedEvent: function (event) {
                return this.selectedEvent && this.getEventKey(this.selectedEvent) === this.getEventKey(event);
            },
            getOutcomeClass: function (outcome) {
                if (outcome === "Recovered") {
                    return "combat-replay-wvw-analysis-pill-success";
                }
                if (outcome === "Killed") {
                    return "combat-replay-wvw-analysis-pill-weak";
                }
                return "combat-replay-wvw-analysis-pill-muted";
            },

                return event && event.isEnemy
                    ? "combat-replay-wvw-analysis-pill-weak"
                    : "combat-replay-wvw-analysis-pill-muted";
            },
        },
    });

            },
            killSummary: function () {
                const summaries = {
                    combined: this.killAnalysis.combinedSummary,
                    squad: this.killAnalysis.squadSummary,
                    enemy: this.killAnalysis.enemySummary,
                };
                return summaries[this.summaryView] || {
                    squadKills: 0,
                    enemyKills: 0,
                    conditionImpactedKills: 0,
                    mysticRebukeKills: 0,
                    conditionMajorityKills: 0,
                    mysticRebukeHeavyKills: 0,
                    totalDamage: 0,
                    totalStrikeDamage: 0,
                    totalConditionDamage: 0,
                    totalBurningDamage: 0,
                    totalMysticRebukeDamage: 0,
                    totalBarrierDamage: 0,
                    averageKillTimeSeconds: 0,
                    averageMysticRebukeDamage: 0,
                    finishContributors: [],
                    mysticRebukeContributors: [],
                    conditionContributors: [],
                    topConditions: [],
                    takeaways: [],
                };
            },
            events: function () {
                return this.killAnalysis.events || [];
            },
            selectedEvent: function () {
                if (this.events.length === 0) {
                    return null;
                }
                if (!this.selectedEventKey) {
                    return this.events[0];
                }
                return this.events.find(event => this.getEventKey(event) === this.selectedEventKey) || this.events[0];
            },
        },
        activated: function () {
            this.restoreEventScroll();
        },
        deactivated: function () {
            this.captureEventScroll();
        },

            captureEventScroll: function () {
                if (this.$refs.eventList) {
                    this.eventListScrollTop = this.$refs.eventList.scrollTop;
                }
                if (this.$refs.eventDetail) {
                    this.eventDetailScrollTop = this.$refs.eventDetail.scrollTop;
                }
            },
            restoreEventScroll: function () {
                this.$nextTick(() => {
                    const applyScroll = () => {
                        if (this.$refs.eventList) {
                            this.$refs.eventList.scrollTop = this.eventListScrollTop || 0;
                        }
                        if (this.$refs.eventDetail) {
                            this.$refs.eventDetail.scrollTop = this.eventDetailScrollTop || 0;
                        }
                    };
                    applyScroll();
                    if (window.requestAnimationFrame) {
                        window.requestAnimationFrame(applyScroll);
                    }
                });
            },
            openEvent: function (event) {
                this.captureEventScroll();
                this.selectedEventKey = this.getEventKey(event);
                this.jumpToBurst(event.time);
                this.selectReplayActor(event.actorId);
            },
            focusContributor: function (contributor) {
                if (contributor && contributor.actorId) {
                    this.selectReplayActor(contributor.actorId);
                }
            },
            focusSummaryActor: function (entry) {
                if (entry && entry.actorId) {
                    this.selectReplayActor(entry.actorId);
                }
            },
            formatStrikeDamage: function (event) {
                if (!event) {
                    return this.formatCount(0);
                }
                const strikeDamage = this.formatCount(event.strikeDamageTaken);
                if (!event.mysticRebukeDamageTaken) {
                    return strikeDamage;
                }
                return strikeDamage + " (" + this.formatCount(event.mysticRebukeDamageTaken) + " MR)";
            },
            getContributorStrikeAmount: function (contributor) {
                if (!contributor || !contributor.details) {
                    return 0;
                }
                const strike = contributor.details.find(detail => detail.name === "Strike");
                return strike ? strike.amount : 0;
            },
            getContributorConditionAmount: function (contributor) {
                if (!contributor || !contributor.details) {
                    return 0;
                }
                const condition = contributor.details.find(detail => detail.name === "Condition");
                return condition ? condition.amount : 0;
            },
            hasContributorDamageSplit: function (contributor) {
                return this.getContributorStrikeAmount(contributor) > 0 || this.getContributorConditionAmount(contributor) > 0;
            },
            getEventKey: function (event) {
                return [event.time, event.actorId, event.side].join("-");
            },
            isSelectedEvent: function (event) {
                return this.selectedEvent && this.getEventKey(this.selectedEvent) === this.getEventKey(event);

            getSideClass: function (event) {
                return event && event.isEnemy
                    ? "combat-replay-wvw-analysis-pill-weak"
                    : "combat-replay-wvw-analysis-pill-muted";
            },
        },
    });

            eventAnalysis: function () {

            recoveredSquadSummary: function () {
                return this.recoveredAnalysis.squadSummary || {
                    recoveredCount: 0,
                    averageRecoverTimeSeconds: 0,
                    totalDownedHealing: 0,
                    totalHealingEvents: 0,
                    totalRezCasts: 0,
                    totalRezCastDurationSeconds: 0,
                    supportContributors: [],
                    healingContributors: [],
                    rezContributors: [],
                    takeaways: [],
                };
            },
            recoveredEnemySummary: function () {
                return this.recoveredAnalysis.enemySummary || {
                    recoveredCount: 0,
                    conditionImpactedRecoveries: 0,
                    mysticRebukeRecoveries: 0,
                    conditionMajorityRecoveries: 0,
                    mysticRebukeHeavyRecoveries: 0,

                    totalBarrierDamage: 0,
                    averageRecoverTimeSeconds: 0,
                    averageMysticRebukeDamage: 0,
                    pressureContributors: [],
                    mysticRebukeContributors: [],
                    conditionContributors: [],
                    topConditions: [],
                    takeaways: [],
                };
            },
            events: function () {
                return this.recoveredAnalysis.events || [];
            },
            selectedEvent: function () {
                if (this.events.length === 0) {
                    return null;
                }
                if (!this.selectedEventKey) {
                    return this.events[0];
                }

            },
        },

                this.selectedEventKey = this.getEventKey(event);

                if (contributor && contributor.actorId) {
                    this.selectReplayActor(contributor.actorId);
                }
            },
            focusSummaryActor: function (entry) {
                if (entry && entry.actorId) {
                    this.selectReplayActor(entry.actorId);
                }
            },
            formatStrikeDamage: function (event) {
                if (!event) {
                    return this.formatCount(0);
                }
                const strikeDamage = this.formatCount(event.strikeDamageTaken);
                if (!event.mysticRebukeDamageTaken) {
                    return strikeDamage;
                }
                return strikeDamage + " (" + this.formatCount(event.mysticRebukeDamageTaken) + " MR)";
            },
            getContributorStrikeAmount: function (contributor) {
                if (!contributor || !contributor.details) {

                return strike ? strike.amount : 0;

                const condition = contributor.details.find(detail => detail.name === "Condition");
                return condition ? condition.amount : 0;
            },

                const detail = contributor.details.find(entry => entry.name === detailName);
                return detail ? detail.amount : 0;
            },

                    : "combat-replay-wvw-analysis-pill-muted";
            },
        },
    });

                                        <div v-for="condition in selectedEvent.conditions" :key="'condition-breakdown-' + selectedEvent.time + '-' + condition.name" class="wvw-summary-modal-row">
                                            <div class="wvw-summary-modal-skill">
                                                <img v-if="condition.icon" :src="condition.icon" :alt="condition.name" class="combat-replay-threat-boon-icon">
                                                <span class="wvw-summary-modal-skill-name">{{condition.name}}</span>
                                            </div>
                                            <div class="wvw-summary-modal-values">
                                                <span class="wvw-summary-modal-count">{{formatAmount(condition.amount)}}</span>
                                                <span class="wvw-summary-modal-secondary">{{formatPercent(condition.percent)}}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mt-2">
                                    <div class="combat-replay-wvw-analysis-label">Provider breakdown</div>
                                    <div class="wvw-summary-modal-list">
                                        <div v-for="provider in selectedEvent.providers" :key="'conversion-provider-' + selectedEvent.time + '-' + provider.name" class="wvw-summary-modal-row">
                                            <div class="wvw-summary-modal-skill">
                                                <button v-if="provider.actorId != null" type="button" class="btn btn-link p-0" @click="focusActor(provider.actorId)">
                                                    <span class="wvw-summary-modal-skill-name">{{provider.name}}</span>
                                                </button>
                                                <span v-else class="wvw-summary-modal-skill-name">{{provider.name}}</span>
                                            </div>
                                            <div class="wvw-summary-modal-values">
                                                <span class="wvw-summary-modal-count">{{formatAmount(provider.amount)}}</span>
                                                <span class="wvw-summary-modal-secondary">{{formatPercent(provider.percent)}}</span>

        computed: {
            eventAnalysis: function () {
                return this.getEventAnalysis();
            },
            conditionAnalysis: function () {
                return this.eventAnalysis && this.eventAnalysis.conditionConversions ? this.eventAnalysis.conditionConversions : { totalEvents: 0, convertedEvents: 0, conditionNecessaryEvents: 0, totalBurningDamage: 0, totalConditionDamage: 0, totalVulnerabilityBonusDamage: 0, totalAttributedValue: 0, providers: [], events: [] };
            },
            events: function () {
                return this.conditionAnalysis.events || [];
            },
            selectedEvent: function () {
                if (this.events.length === 0) {
                    return null;
                }
                return this.events.find(event => this.makeEventKey(event) === this.selectedEventKey) || this.events[0];
            },
            providers: function () {
                return this.providerSummaries.filter(provider => provider.actorId != null || provider.name !== "Other");
            },
            topProvider: function () {
                return this.providers.length > 0 ? this.providers[0] : null;
            },
            providerSummaries: function () {
                const summaries = {};
                const totalAttributedValue = this.conditionAnalysis && this.conditionAnalysis.totalAttributedValue ? this.conditionAnalysis.totalAttributedValue : 0;
                this.events.forEach(event => {
                    (event.providers || []).forEach(provider => {
                        const key = this.makeProviderKey(provider);
                        if (!summaries[key]) {
                            summaries[key] = {
                                key: key,
                                actorId: provider.actorId,
                                name: provider.name,
                                icon: provider.icon || "",
                                amount: 0,
                                eventCount: 0,
                                convertedCount: 0,
                                recoveredCount: 0,
                                downOnlyCount: 0,
                                sourceMap: {},
                                topEvents: [],
                            };
                        }
                        const summary = summaries[key];
                        summary.amount += provider.amount || 0;
                        summary.eventCount += 1;
                        if (event.outcome === "Converted") {
                            summary.convertedCount += 1;
                        } else if (event.outcome === "Recovered") {
                            summary.recoveredCount += 1;
                        } else {
                            summary.downOnlyCount += 1;
                        }
                        (provider.details || []).forEach(detail => {
                            const detailKey = detail.buffId != null ? String(detail.buffId) : String(detail.name);
                            if (!summary.sourceMap[detailKey]) {
                                summary.sourceMap[detailKey] = {
                                    name: detail.name,
                                    icon: detail.icon || "",
                                    amount: 0,
                                };
                            }
                            summary.sourceMap[detailKey].amount += detail.amount || 0;
                        });
                        summary.topEvents.push({
                            time: event.time,
                            timeLabel: event.timeLabel,
                            targetId: event.targetId,
                            targetName: event.targetName,
                            outcome: event.outcome,
                            conditionDamageNecessary: !!event.conditionDamageNecessary,
                            amount: provider.amount || 0,
                            topConditionName: event.topConditionName,
                        });
                    });
                });
                return Object.values(summaries)
                    .map(summary => {
                        const amount = this.roundToTenth(summary.amount);
                        const sources = Object.values(summary.sourceMap)
                            .map(source => {
                                const sourceAmount = this.roundToTenth(source.amount);
                                return {
                                    name: source.name,
                                    icon: source.icon,
                                    amount: sourceAmount,
                                    percent: amount > 0 ? this.roundToTenth(sourceAmount * 100 / amount) : 0,
                                };
                            })
                            .sort((left, right) => right.amount - left.amount || left.name.localeCompare(right.name));
                        const topEvents = summary.topEvents
                            .sort((left, right) => right.amount - left.amount || left.time - right.time)
                            .slice(0, 5)
                            .map(providerEvent => ({
                                time: providerEvent.time,
                                timeLabel: providerEvent.timeLabel,
                                targetId: providerEvent.targetId,
                                targetName: providerEvent.targetName,
                                outcome: providerEvent.outcome,
                                conditionDamageNecessary: !!providerEvent.conditionDamageNecessary,
                                amount: this.roundToTenth(providerEvent.amount),
                                topConditionName: providerEvent.topConditionName,
                            }));
                        return {
                            key: summary.key,
                            actorId: summary.actorId,
                            name: summary.name,
                            icon: summary.icon,
                            amount: amount,
                            percent: totalAttributedValue > 0 ? this.roundToTenth(amount * 100 / totalAttributedValue) : 0,
                            eventCount: summary.eventCount,
                            convertedCount: summary.convertedCount,
                            recoveredCount: summary.recoveredCount,
                            downOnlyCount: summary.downOnlyCount,
                            sources: sources,
                            topEvents: topEvents,
                        };
                    })
                    .sort((left, right) => right.amount - left.amount || left.name.localeCompare(right.name));
            },
            selectedProviderSummary: function () {
                if (this.providers.length === 0) {
                    return null;
                }
                if (this.selectedactorid != null) {
                    const actorMatchedProvider = this.providers.find(provider => provider.actorId === this.selectedactorid);
                    if (actorMatchedProvider) {
                        return actorMatchedProvider;
                    }
                }
                const selectedKey = this.selectedProviderKey || this.providers[0].key;
                return this.providers.find(provider => provider.key === selectedKey) || this.providers[0];
            },
        },
        methods: {
            makeEventKey: function (event) {
                return String(event.time) + ":" + String(event.targetId);
            },
            makeProviderKey: function (provider) {
                return provider && provider.actorId != null
                    ? "actor:" + String(provider.actorId)
                    : "name:" + String(provider && provider.name ? provider.name : "");
            },
            openEvent: function (event) {
                this.selectedEventKey = this.makeEventKey(event);

                this.selectReplayActor(event.targetId);
            },
            openProviderEvent: function (providerEvent) {
                this.selectedEventKey = this.makeEventKey(providerEvent);
                this.jumpToBurst(providerEvent.time);
                this.selectReplayActor(providerEvent.targetId);
            },
            selectProvider: function (provider) {
                if (!provider) {
                    return;
                }
                this.selectedProviderKey = this.makeProviderKey(provider);
                this.focusActor(provider.actorId);
            },
            focusActor: function (actorId) {
                if (actorId == null) {

                }
                this.selectReplayActor(actorId);
            },
            roundToTenth: function (value) {
                return Math.round((Number(value) || 0) * 10) / 10;
            },
            getOutcomeClass: function (outcome) {
                if (outcome === "Converted") {
                    return "combat-replay-wvw-analysis-pill-success";
                }
                if (outcome === "Recovered") {
                    return "combat-replay-wvw-analysis-pill-weak";
                }
                return "combat-replay-wvw-analysis-pill-muted";
            },
            formatProviderConditionBreakdown: function (details) {
                return details
                    .map(detail => detail.name + " " + this.formatAmount(detail.amount))
                    .join(", ");
            },
        },
    });

                    <div class="wvw-summary-modal-title">Mitigation Summary Help</div>
                    <div class="wvw-summary-modal-subtitle">
                        This section combines whole-fight barrier and pet/minion diversion totals with a focused saved-player summary built from the 99% mitigation threshold bucket.
                    </div>
                    <div class="combat-replay-overview-help-text">
                        <strong>Saved player / saved case</strong> means a mitigation entry where barrier, estimated damage reduction, estimated negated damage, or any combination of those categories is large enough to cover the player's estimated remaining health at the lowest-health point.

                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Whole-fight mitigation metrics</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Overall Barrier Absorption</strong>: percentage of incoming squad damage that hit barrier instead of health over the whole fight.</li>
                            <li><strong>Pet / Minion Absorption</strong>: percentage of combined incoming damage to squad players and owned pets/minions that landed on pets/minions instead of squad players.</li>
                            <li><strong>Burst Barrier Absorption</strong>: percentage of incoming squad damage absorbed by barrier during tracked enemy burst windows.</li>
                            <li><strong>Top Barrier Providers</strong>: squad players who contributed the most outgoing barrier across the fight.</li>
                            <li><strong>Top Pet / Minion Absorbers</strong>: squad players whose owned pets or minions took the most incoming damage.</li>
                            <li><strong>Negated Hit Estimates</strong>: estimated prevented damage from Aegis blocks, Distortion, Blur, absorbed invulnerability-style hits, and blind misses. Each negated hit is estimated from landed hits of the same attacker and skill when possible.</li>
                            <li><strong>Fallback estimates</strong>: when no landed-hit sample exists for that attacker and skill, the estimate uses 50 damage and increments the fallback counter.</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Saved Players (99% threshold)</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Saved cases</strong>: total mitigation entries in the 99% threshold bucket where barrier, damage reduction, negated damage, or any combination of those categories met the current save estimate.</li>
                            <li><strong>Barrier absorbed for saved players</strong>: barrier absorbed between the last full-health point and the lowest-health point for saved entries.</li>
                            <li><strong>Estimated damage reduction for saved players</strong>: estimated strike damage prevented by tracked reduction effects during saved entries.</li>
                            <li><strong>Estimated negated damage for saved players</strong>: estimated damage from Aegis, Distortion, Blur, and other tracked negated hits during saved entries.</li>
                            <li><strong>Lowest Health</strong>: the average lowest-health percent across qualifying saved entries, plus the single lowest qualifying health percent.</li>
                            <li><strong>Save breakdown</strong>: counts of saved entries attributed to barrier, damage reduction, negated damage, and multi-source combinations.</li>
                            <li><strong>Top damage reduction effects</strong>: the most common tracked reduction effects that contributed to saved entries.</li>
                            <li><strong>Top negated damage effects</strong>: the most common negation effects that contributed to saved entries.</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Important caveats</div>
                        <ul class="combat-replay-overview-help-list">
                            <li>Saved-player counts are heuristic and are intended for comparison and investigation, not exact ground truth.</li>
                            <li>Barrier values can be incomplete if some players were missing the barrier/healing addon.</li>
                            <li>Damage reduction estimates currently only use the tracked reduction effects implemented in the mitigation calculation.</li>
                            <li>Negated-damage estimates are built from negated hits. When a matching landed hit for the same attacker and skill is unavailable, the estimate falls back to 50 damage.</li>
                            <li>Pet / minion absorption shows diverted pressure on owned pets and minions. It does not prove that the same damage would otherwise have hit a player.</li>
                        </ul>
                    </div>

            <div v-if="showMitigationCasesHelp" class="wvw-summary-modal-backdrop" @click.self="showMitigationCasesHelp = false">
                <div class="wvw-summary-modal combat-replay-overview-help-modal" role="dialog" aria-modal="true" aria-label="Mitigation cases help">
                    <button type="button" class="wvw-summary-modal-close" aria-label="Close mitigation cases help" @click="showMitigationCasesHelp = false">&times;</button>
                    <div class="wvw-summary-modal-title">Mitigation Cases Help</div>
                    <div class="wvw-summary-modal-subtitle">
                        Mitigation Cases lists recovery windows where a squad player dropped to or below the selected threshold, then returned to full health without going down or dying.
                    </div>
                    <div class="combat-replay-overview-help-text">
                        <strong>Saved player / saved case</strong> means a mitigation entry where barrier, estimated damage reduction, estimated negated damage, or any combination of those categories is large enough to cover the player's estimated remaining health at the lowest-health point.
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">How a case is built</div>
                        <ul class="combat-replay-overview-help-list">
                            <li>The case starts when the player first crosses the selected health threshold while alive and upright.</li>
                            <li>The case is anchored to the last full-health point before the drop when one can be found.</li>
                            <li>The case ends when the player returns to full health, or is discarded if the player goes down or dies first.</li>
                            <li>A player is not added again until they fully recover, go down, or die.</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Filters and links</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Health threshold</strong>: switches between precomputed threshold buckets.</li>
                            <li><strong>Effect</strong>: only shows cases where the selected mitigation effect appeared during the full-to-recover window.</li>
                            <li><strong>Saved only</strong>: after the effect filter is applied, keeps only entries where the selected effect, or barrier, was part of the current save estimate through damage reduction or negated damage.</li>
                            <li><strong>Player</strong>: after threshold, saved-only, and effect filters are applied, narrows the list to one selected player.</li>
                            <li><strong>Jump links</strong>: switch to Overview, move the replay to the selected moment, and select the player.</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Card fields</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Health pool</strong>: uses the player's real max-health pool when the log provides it, otherwise a spec-based estimate.</li>
                            <li><strong>Barrier absorbed</strong>: actual logged shield damage absorbed from the start of the case to the lowest-health point.</li>
                            <li><strong>Health at lowest point</strong>: lowest observed health percent in the case window.</li>
                            <li><strong>Estimated mitigation</strong>: estimated strike damage prevented by tracked damage-reduction effects during the case window.</li>
                            <li><strong>Estimated negated damage</strong>: estimated damage from Aegis, Distortion, Blur, and other tracked negated hits during the case window.</li>
                            <li><strong>Incoming damage / Incoming healing</strong>: totals across the full-to-recover window.</li>
                            <li><strong>Effect chips</strong>: mitigation effects active at some point in the window, with active duration shown on each chip.</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Saved highlighting</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Saved player</strong>: a case where barrier, estimated damage reduction, estimated negated damage, or any combination of those categories is large enough to cover the player's estimated remaining health at the lowest-health point.</li>
                            <li>The <strong>Barrier</strong> effect chip is highlighted when barrier alone meets the current save estimate.</li>
                            <li>Tracked damage-reduction effect chips are highlighted when those effects were part of the current estimated save check.</li>
                            <li>Tracked negation effect chips such as <strong>Aegis</strong>, <strong>Distortion</strong>, and <strong>Blur</strong> are highlighted when estimated negated damage was part of the current save check.</li>
                            <li>These highlights are heuristic and are intended to flag likely saves for review.</li>
                        </ul>
                    </div>
                </div>
            </div>
            <div v-if="negatedHitDetailModal" class="wvw-summary-modal-backdrop" @click.self="closeNegatedHitSummaryDetail">
                <div class="wvw-summary-modal combat-replay-player-evaluation-modal" role="dialog" aria-modal="true" :aria-label="negatedHitDetailModal.title">
