            },
            killSummary: function () {
                const summaries = {
                    combined: this.killAnalysis.combinedSummary,
                    squad: this.killAnalysis.squadSummary,
                    enemy: this.killAnalysis.enemySummary,
                };
                return summaries[this.summaryView] || {
                    squadKills: 0,
                    enemyKills: 0,
                    conditionImpactedKills: 0,
                    mysticRebukeKills: 0,
                    conditionMajorityKills: 0,
                    mysticRebukeHeavyKills: 0,
                    totalDamage: 0,
                    totalStrikeDamage: 0,
                    totalConditionDamage: 0,
                    totalBurningDamage: 0,
                    totalMysticRebukeDamage: 0,
                    totalBarrierDamage: 0,
                    averageKillTimeSeconds: 0,
                    averageMysticRebukeDamage: 0,
                    finishContributors: [],
                    mysticRebukeContributors: [],
                    conditionContributors: [],
                    topConditions: [],
                    takeaways: [],
                };
            },
            events: function () {
                return this.killAnalysis.events || [];
            },
            selectedEvent: function () {
                if (this.events.length === 0) {
                    return null;
                }
                if (!this.selectedEventKey) {
                    return this.events[0];
                }
                return this.events.find(event => this.getEventKey(event) === this.selectedEventKey) || this.events[0];
            },
        },
        activated: function () {
            this.restoreEventScroll();
        },
        deactivated: function () {
            this.captureEventScroll();
        },
        methods: {
            captureEventScroll: function () {
                if (this.$refs.eventList) {
                    this.eventListScrollTop = this.$refs.eventList.scrollTop;
                }
                if (this.$refs.eventDetail) {
                    this.eventDetailScrollTop = this.$refs.eventDetail.scrollTop;
                }
            },
            restoreEventScroll: function () {
                this.$nextTick(() => {
                    const applyScroll = () => {
                        if (this.$refs.eventList) {
                            this.$refs.eventList.scrollTop = this.eventListScrollTop || 0;
                        }
                        if (this.$refs.eventDetail) {
                            this.$refs.eventDetail.scrollTop = this.eventDetailScrollTop || 0;
                        }
                    };
                    applyScroll();
                    if (window.requestAnimationFrame) {
                        window.requestAnimationFrame(applyScroll);
                    }
                });
            },
            openEvent: function (event) {
                this.captureEventScroll();
                this.selectedEventKey = this.getEventKey(event);
                this.jumpToBurst(event.time);
                this.selectReplayActor(event.actorId);
            },
            focusContributor: function (contributor) {
                if (contributor && contributor.actorId) {
                    this.selectReplayActor(contributor.actorId);
                }
            },
            focusSummaryActor: function (entry) {
                if (entry && entry.actorId) {
                    this.selectReplayActor(entry.actorId);
                }
            },
            formatStrikeDamage: function (event) {
                if (!event) {
                    return this.formatCount(0);
                }
                const strikeDamage = this.formatCount(event.strikeDamageTaken);
                if (!event.mysticRebukeDamageTaken) {
                    return strikeDamage;
                }
                return strikeDamage + " (" + this.formatCount(event.mysticRebukeDamageTaken) + " MR)";
            },
            getContributorStrikeAmount: function (contributor) {
                if (!contributor || !contributor.details) {
                    return 0;
                }
                const strike = contributor.details.find(detail => detail.name === "Strike");
                return strike ? strike.amount : 0;
            },
            getContributorConditionAmount: function (contributor) {
                if (!contributor || !contributor.details) {
                    return 0;
                }
                const condition = contributor.details.find(detail => detail.name === "Condition");
                return condition ? condition.amount : 0;
            },
            hasContributorDamageSplit: function (contributor) {
                return this.getContributorStrikeAmount(contributor) > 0 || this.getContributorConditionAmount(contributor) > 0;
            },
            getEventKey: function (event) {
                return [event.time, event.actorId, event.side].join("-");
            },
            isSelectedEvent: function (event) {
                return this.selectedEvent && this.getEventKey(this.selectedEvent) === this.getEventKey(event);

                    ? "combat-replay-wvw-analysis-pill-weak"
                    : "combat-replay-wvw-analysis-pill-muted";
            },
        },
    });

                                };
                            }
                            summary.sourceMap[detailKey].amount += detail.amount || 0;
                        });
                        summary.topEvents.push({
                            time: event.time,
                            timeLabel: event.timeLabel,
                            targetId: event.targetId,
                            targetName: event.targetName,
                            outcome: event.outcome,
                            conditionDamageNecessary: !!event.conditionDamageNecessary,
                            amount: provider.amount || 0,
                            topConditionName: event.topConditionName,
                        });
                    });
                });
                return Object.values(summaries)
                    .map(summary => {
                        const amount = this.roundToTenth(summary.amount);
                        const sources = Object.values(summary.sourceMap)
                            .map(source => {
                                const sourceAmount = this.roundToTenth(source.amount);
                                return {
                                    name: source.name,
                                    icon: source.icon,
                                    amount: sourceAmount,
                                    percent: amount > 0 ? this.roundToTenth(sourceAmount * 100 / amount) : 0,
                                };
                            })
                            .sort((left, right) => right.amount - left.amount || left.name.localeCompare(right.name));
                        const topEvents = summary.topEvents
                            .sort((left, right) => right.amount - left.amount || left.time - right.time)
                            .slice(0, 5)
                            .map(providerEvent => ({
                                time: providerEvent.time,
                                timeLabel: providerEvent.timeLabel,
                                targetId: providerEvent.targetId,
                                targetName: providerEvent.targetName,
                                outcome: providerEvent.outcome,
                                conditionDamageNecessary: !!providerEvent.conditionDamageNecessary,
                                amount: this.roundToTenth(providerEvent.amount),
                                topConditionName: providerEvent.topConditionName,
                            }));
                        return {
                            key: summary.key,
                            actorId: summary.actorId,
                            name: summary.name,
                            icon: summary.icon,
                            amount: amount,
                            percent: totalAttributedValue > 0 ? this.roundToTenth(amount * 100 / totalAttributedValue) : 0,
                            eventCount: summary.eventCount,
                            convertedCount: summary.convertedCount,
                            recoveredCount: summary.recoveredCount,
                            downOnlyCount: summary.downOnlyCount,
                            sources: sources,
                            topEvents: topEvents,
                        };
                    })
                    .sort((left, right) => right.amount - left.amount || left.name.localeCompare(right.name));
            },
            selectedProviderSummary: function () {
                if (this.providers.length === 0) {
                    return null;
                }
                if (this.selectedactorid != null) {
                    const actorMatchedProvider = this.providers.find(provider => provider.actorId === this.selectedactorid);
                    if (actorMatchedProvider) {
                        return actorMatchedProvider;
                    }
                }
                const selectedKey = this.selectedProviderKey || this.providers[0].key;
                return this.providers.find(provider => provider.key === selectedKey) || this.providers[0];

                return Math.round((Number(value) || 0) * 10) / 10;

            formatProviderConditionBreakdown: function (details) {

                switch (this.selectedAnalysisView) {
                    case "squadConditions":
                        return this.crAnalysis.squadConditions || null;
                    case "enemyCrowdControl":
                        return this.crAnalysis.enemyCrowdControl || null;
                    case "squadCrowdControl":
                        return this.crAnalysis.squadCrowdControl || null;
                    default:
                        return this.crAnalysis.incomingConditions || null;
                }
            },
            isCrowdControl: function () {
                return this.selectedAnalysisView === "enemyCrowdControl" || this.selectedAnalysisView === "squadCrowdControl";
            },
            conditions: function () {
                return this.incomingConditionAnalysis && this.incomingConditionAnalysis.conditions
                    ? this.incomingConditionAnalysis.conditions
                    : [];
            },
            selectedCondition: function () {
                if (this.conditions.length === 0) {
                    return null;
                }
                if (this.selectedConditionId != null) {
                    const selected = this.conditions.find(condition => String(condition.buffId) === String(this.selectedConditionId));
                    if (selected) {
                        return selected;
                    }
                }
                return this.conditions[0];
            },
            maxConditionPressure: function () {
                return this.conditions.reduce((maxValue, condition) => Math.max(maxValue, this.effectMagnitude(condition)), 0);
            },
            maxSourcePressure: function () {
                return this.selectedCondition && this.selectedCondition.sources
                    ? this.selectedCondition.sources.reduce((maxValue, source) => Math.max(maxValue, this.actorMagnitude(source)), 0)
                    : 0;
            },
            maxRecipientPressure: function () {
                return this.selectedCondition && this.selectedCondition.recipients
                    ? this.selectedCondition.recipients.reduce((maxValue, recipient) => Math.max(maxValue, this.actorMagnitude(recipient)), 0)
                    : 0;
            },
            barOuterStyle: function () {
                return {
                    display: "block",
                    width: "100%",
                    height: "0.35rem",
                    gridColumn: "1 / -1",
                    borderRadius: "999px",
                    overflow: "hidden",
                    background: "rgba(255, 255, 255, 0.08)",
                };
            },
        },
        methods: {
            selectAnalysisView: function (viewKey) {
                this.selectedAnalysisView = viewKey;
                this.selectedConditionId = null;
            },
            selectCondition: function (condition) {
                this.selectedConditionId = condition ? condition.buffId : null;
            },
            focusActor: function (actorId) {
                if (actorId == null) {
                    return;
                }
                this.selectReplayActor(actorId);
            },
            isConditionSelected: function (condition) {
                return !!(this.selectedCondition && condition && String(this.selectedCondition.buffId) === String(condition.buffId));
            },
            conditionButtonStyle: function (condition) {
                const selected = this.isConditionSelected(condition);
                return {
                    borderColor: selected ? "rgba(127, 216, 170, 0.75)" : "rgba(124, 130, 136, 0.35)",
                    background: selected ? "rgba(127, 216, 170, 0.12)" : "rgba(0, 0, 0, 0.12)",
                };
            },
            barInnerStyle: function (value, maxValue) {
                const max = Number(maxValue || 0);
                const percent = max > 0 ? Math.max(2, Math.min(100, (Number(value || 0) * 100.0) / max)) : 0;
                return {
                    display: "block",
                    width: percent.toFixed(1) + "%",
                    height: "100%",
                    borderRadius: "999px",
                    background: "linear-gradient(90deg, rgba(127, 216, 170, 0.95), rgba(138, 200, 255, 0.9))",
                };
            },
            formatPressure: function (condition, value) {
                const amount = Number(value || 0);
                return condition && condition.stackBased
                    ? amount.toFixed(1)
                    : this.formatPercent(amount);
            },
            formatConditionMagnitude: function (condition, value) {

                return condition && condition.stackBased

                    : amount.toFixed(1) + " player-uptime pts";

            effectMagnitude: function (effect) {
                return this.isCrowdControl
                    ? Number(effect && effect.eventCount || 0)
                    : Number(effect && effect.totalPressure || 0);
            },
            actorMagnitude: function (actor) {
                return this.isCrowdControl

                    : Number(actor && actor.pressure || 0);
            },
            formatDuration: function (seconds) {
                return Number(seconds || 0).toFixed(1) + "s";

            effectivenessPercent: function (effect) {
                const total = Number(effect && effect.eventCount || 0);
                return total > 0 ? Number(effect.effectiveCount || 0) * 100.0 / total : 0;

            pressureTotalLabel: function (condition) {
                return condition && condition.stackBased ? "total stack pressure" : "total player uptime";
            },

                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Who gets evaluated</div>
                        <ul class="combat-replay-overview-help-list">
                            <li>Only squad players are considered, and the commander is excluded from scoring</li>
                            <li>A snapshot is only scored when at least one hostile player is within {{positioningAnalysis.engageRange}} of the commander</li>
                            <li>Players are excluded if they are downed, dead, disconnected, or more than {{positioningAnalysis.ignoreCommanderDistance}} from the commander</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">In-position rules</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>In position</strong> means the player is evaluated and not flagged as too far, overextended, or left/right exposed</li>
                            <li><strong>Too far</strong> means farther than {{positioningAnalysis.desiredCommanderDistance}} from the commander, or farther than {{positioningAnalysis.mingledCommanderDistance}} when the groups are mingled</li>
                            <li><strong>Mingled</strong> means more than {{positioningAnalysis.mingledEnemyThreshold}} hostile players are within {{positioningAnalysis.mingledRange}} of the commander</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Out-of-position rules</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Out of position</strong> means any evaluated player flagged as too far, overextended, or left/right exposed</li>
                            <li><strong>Overextended</strong> means the player is on the enemy side of the commander while the groups are not mingled, and it is only counted when fewer than {{positioningAnalysis.overextendedPlayerThreshold}} players are overextended in that snapshot</li>
                            <li><strong>Left/right exposed</strong> means more than {{positioningAnalysis.enemyCountThreshold}} hostile players are closer to the player than to the commander, unless the groups are mingled</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Not evaluated</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Not evaluated</strong> means the current snapshot is not scored for that player because the fight is not engaged yet or the player is excluded for that moment</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        `,
        computed: {
            positioningAnalysis: function () {
                return this.getPositioningAnalysis();
            },
            currentEngagedEnemies: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.engagedEnemyCount : null, this.snapshotIndex);
            },
            enemiesNearCommander: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.enemiesNearCommanderCount : null, this.snapshotIndex);
            },
            isMingled: function () {
                return !!this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.mingled : null, this.snapshotIndex);
            },
            eligiblePlayers: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.eligiblePlayerCount : null, this.snapshotIndex);
            },
            inPositionCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.inPositionCount : null, this.snapshotIndex);
            },
            outOfPositionCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.outOfPositionCount : null, this.snapshotIndex);
            },
            tooFarCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.tooFarCount : null, this.snapshotIndex);
            },
            overextendedCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.overextendedCount : null, this.snapshotIndex);
            },
            lateralRiskCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.lateralRiskCount : null, this.snapshotIndex);
            },
            inPositionRate: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.inPositionRate : null, this.snapshotIndex);
            },
            currentDesiredCommanderDistance: function () {
                if (!this.positioningAnalysis) {
                    return 0;
                }
                return this.isMingled ? this.positioningAnalysis.mingledCommanderDistance : this.positioningAnalysis.desiredCommanderDistance;
            },
            selectedPlayerTimeline: function () {
                if (!this.positioningAnalysis || this.selectedactorid == null) {
                    return null;
                }
                if (this.selectedactorid === this.positioningAnalysis.commanderId) {
                    return null;
                }
                return this.positioningAnalysis.players[this.selectedactorid] || null;
            },
            selectedPlayer: function () {
                return this.selectedPlayerTimeline ? this.getPlayerByUniqueId(this.selectedactorid) : null;
            },
            distanceToCommander: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.distanceToCommander, this.snapshotIndex) : 0;
            },
            enemiesCloserThanCommander: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.enemiesCloserThanCommander, this.snapshotIndex) : 0;
            },
            enemiesAheadOfCommander: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.enemiesAheadOfCommander, this.snapshotIndex) : 0;
            },
            runningInPositionRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningInPositionRate, this.snapshotIndex) : 0;
            },
            runningTooFarRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningTooFarRate, this.snapshotIndex) : 0;
            },
            runningOverextendedRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningOverextendedRate, this.snapshotIndex) : 0;
            },
            runningLateralRiskRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningLateralRiskRate, this.snapshotIndex) : 0;
            },
            playerStatusLabel: function () {
                if (!this.selectedPlayerTimeline) {
                    return "";
                }
                if (!this.getSeriesValue(this.selectedPlayerTimeline.eligible, this.snapshotIndex)) {
                    return "not currently evaluated";
                }
                const reasons = [];
                if (this.getSeriesValue(this.selectedPlayerTimeline.tooFar, this.snapshotIndex)) {
                    reasons.push("too far");
                }
                if (this.getSeriesValue(this.selectedPlayerTimeline.overextended, this.snapshotIndex)) {
                    reasons.push("overextended");
                }
                if (this.getSeriesValue(this.selectedPlayerTimeline.lateralRisk, this.snapshotIndex)) {
                    reasons.push("left/right exposed");
                }
                return reasons.length > 0 ? reasons.join(", ") : "in position";
            },
            positioningPlayers: function () {
                if (!this.positioningAnalysis) {
                    return [];
                }
                return logData.players
                    .filter(player => !player.isFake && !player.notInSquad && player.uniqueID !== this.positioningAnalysis.commanderId)
                    .map(player => {
                        const timeline = this.positioningAnalysis.players[player.uniqueID];
                        if (!timeline) {
                            return null;
                        }
                        const eligible = !!this.getSeriesValue(timeline.eligible, this.snapshotIndex);
                        const tooFar = !!this.getSeriesValue(timeline.tooFar, this.snapshotIndex);
                        const overextended = !!this.getSeriesValue(timeline.overextended, this.snapshotIndex);
                        const lateralRisk = !!this.getSeriesValue(timeline.lateralRisk, this.snapshotIndex);
                        const inPosition = !!this.getSeriesValue(timeline.inPosition, this.snapshotIndex);
                        let statusLabel = "not evaluated";
                        let statusClass = "normal";
                        let detail = "Excluded right now because the player is downed, dead, disconnected, or too far from the commander.";
                        if (eligible) {
                            if (inPosition) {
                                statusLabel = "in position";
                                statusClass = "success";
                                detail = "Close enough to the commander and not currently flagged as exposed.";
                            } else {
                                statusLabel = "out of position";
                                statusClass = "weak";
                                const reasons = [];
                                if (tooFar) {
                                    reasons.push("too far from commander");
                                }
                                if (overextended) {
                                    reasons.push("overextended ahead of the commander");
                                }
                                if (lateralRisk) {
                                    reasons.push("too far left/right of the commander");
                                }
                                detail = reasons.join(", ");
                            }
                        }
                        return {
                            player: player,
                            statusLabel: statusLabel,
                            compactStatusLabel: eligible ? (inPosition ? "IP" : "OOP") : "NE",
                            statusClass: statusClass,
                            detail: detail,
                            distanceToCommander: this.getSeriesValue(timeline.distanceToCommander, this.snapshotIndex),
                            enemiesCloserThanCommander: this.getSeriesValue(timeline.enemiesCloserThanCommander, this.snapshotIndex),
                            enemiesAheadOfCommander: this.getSeriesValue(timeline.enemiesAheadOfCommander, this.snapshotIndex),
                        };
                    })
                    .filter(playerState => playerState != null)
                    .sort((left, right) => left.player.name.localeCompare(right.player.name));
            },
            positioningPlayerSummaries: function () {
                if (!this.positioningAnalysis) {
                    return [];
                }
                return logData.players
                    .filter(player => !player.isFake && !player.notInSquad && player.uniqueID !== this.positioningAnalysis.commanderId)
                    .map(player => {
                        const timeline = this.positioningAnalysis.players[player.uniqueID];
                        if (!timeline) {
                            return null;
                        }
                        const evaluatedSamples = timeline.eligible.reduce((total, sample) => total + (sample ? 1 : 0), 0);
                        const inPositionSamples = timeline.inPosition.reduce((total, sample, index) => total + (timeline.eligible[index] && sample ? 1 : 0), 0);
                        return {
                            player: player,
                            evaluatedSamples: evaluatedSamples,
                            inPositionRate: evaluatedSamples > 0 ? Math.round((inPositionSamples * 1000.0) / evaluatedSamples) / 10.0 : 0,
                        };
                    })
                    .filter(playerSummary => playerSummary != null)
                    .sort((left, right) => {
                        if (right.inPositionRate !== left.inPositionRate) {
                            return right.inPositionRate - left.inPositionRate;
                        }
                        return left.player.name.localeCompare(right.player.name);
                    });
            },
        },
        data: function () {
            return {
                positioningMode: 0,
                showPositioningHelp: false,
            };
        },
        methods: {
            selectPositioningPlayer: function (uniqueId) {
                if (!animator) {
                    return;
                }
                animator.selectActor(uniqueId);
            },
        },
    });

    Vue.component("combat-replay-status-data-component", {
        template: `${template}`,
        props: ["time", "selectedactorid", "light"],
        data: function() {
            return {
                mode: 0,
                showTabs: graphData.mechanics.length > 0,
                hasMechanics: graphData.mechanics.length > 0,
            };
        },
    });
</script>
