<template>
    <div class="d-flex flex-column justify-content-center">
        <ul class="nav nav-pills d-flex flex-row justify-content-center mb-1">
            <li class="nav-item">
                <a class="nav-link" :class="{active: mode === 0}" @click="mode = 0">Players</a>
            </li>
            <li v-if="!targetless" class="nav-item">
                <a class="nav-link" :class="{active: mode === 1}" @click="mode = 1">Targets</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" :class="{active: mode === 2}" @click="mode = 2">Mechanics</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" :class="{active: mode === 3}" @click="mode = 3">Overview</a>
            </li>
        </ul>
        <div class="squad-details">
            <keep-alive>
                <combat-replay-players-stats-component v-if="mode === 0" :key="'players-cr-details'" :time="time" :selectedplayerid="selectedactorid"></combat-replay-players-stats-component>
                <combat-replay-targets-stats-component v-if="mode === 1" :key="'targets-cr-details'" :time="time" :selectedtargetid="selectedactorid"></combat-replay-targets-stats-component>
                <combat-replay-mechanics-list-component v-if="mode === 2" :key="'mechanics-cr-details'" :selectedplayerid="selectedactorid"></combat-replay-mechanics-list-component>
                <combat-replay-overview-panel-component
                    v-if="mode === 3"
                    :key="'overview-cr-details'"
                    :time="time"
                    :selectedactorid="selectedactorid"
                    :targetless="targetless"
                    :hasanalysis="hasAnalysis">
                </combat-replay-overview-panel-component>
            </keep-alive>
        </div>
    </div>
</template>

<script>
    const combatReplayWvWAnalysisMixin = {
        computed: {
            crAnalysis: function () {
                return crData && crData.analysis ? crData.analysis : null;
            },
            snapshotIndex: function () {
                if (!this.crAnalysis || !this.crAnalysis.times || this.crAnalysis.times.length === 0) {
                    return -1;
                }
                return this.findNearestSnapshotIndex(this.crAnalysis.times, this.time);
            },
        },
        methods: {
            findNearestSnapshotIndex: function (times, time) {
                let low = 0;
                let high = times.length - 1;
                while (low < high) {
                    const mid = Math.floor((low + high) / 2);
                    if (times[mid] < time) {
                        low = mid + 1;
                    } else {
                        high = mid;
                    }
                }
                if (low === 0) {
                    return 0;
                }
                return Math.abs(times[low] - time) < Math.abs(times[low - 1] - time) ? low : low - 1;
            },
            getPlayerByUniqueId: function (uniqueId) {
                return logData.players.find(player => player.uniqueID === uniqueId) || null;
            },
            getTargetByUniqueId: function (uniqueId) {
                return logData.targets.find(target => target.uniqueID === uniqueId) || null;
            },
            getActorByUniqueId: function (uniqueId) {
                return this.getPlayerByUniqueId(uniqueId) || this.getTargetByUniqueId(uniqueId);
            },
            getSeriesValue: function (series, index) {
                if (!series || index < 0 || index >= series.length) {
                    return 0;
                }
                return series[index];
            },
            getSeriesArrayValue: function (series, index) {
                if (!series || index < 0 || index >= series.length || !series[index]) {
                    return [];
                }
                return series[index];
            },
            formatCount: function (value) {
                return Number(value || 0).toLocaleString();
            },
            formatPercent: function (value) {
                return (Number(value || 0)).toFixed(1) + "%";
            },
            formatTime: function (time) {
                return (Number(time || 0) / 1000.0).toFixed(3) + "s";
            },
            jumpToBurst: function (time) {
                if (!animator) {
                    return;
                }
                animator.stopAnimate(true);
                animator.updateTime(time);
                animator.updateTextInput();
            },
            isPlayerActor: function (actor) {
                return !!(actor && logData.players.some(player => player.uniqueID === actor.uniqueID));
            },
            getTeamAnalysis: function (teamKey) {
                if (!this.crAnalysis) {
                    return null;
                }
                return teamKey === "enemy" ? this.crAnalysis.enemy : this.crAnalysis.squad;
            },
        }
    };

    Vue.component("combat-replay-overview-stats-component", {
        props: ["time", "selectedactorid", "targetless"],
        template: `
        <div class="d-flex flex-column">
            <combat-replay-players-stats-component :time="time" :selectedplayerid="selectedactorid" :analysis="true"></combat-replay-players-stats-component>
            <combat-replay-targets-stats-component v-if="!targetless" :time="time" :selectedtargetid="selectedactorid" :analysis="true"></combat-replay-targets-stats-component>
        </div>
        `,
    });

    Vue.component("combat-replay-overview-panel-component", {
        props: ["time", "selectedactorid", "targetless", "hasanalysis"],
        template: `
        <div class="d-flex flex-column">
            <ul v-if="hasanalysis" class="nav nav-pills d-flex flex-row justify-content-center mb-2 scale85 combat-replay-wvw-analysis-subtabs">
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 0}" @click="overviewMode = 0">Overview</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: overviewMode === 1}" @click="overviewMode = 1">Burst</a>
                </li>
            </ul>
            <combat-replay-overview-stats-component v-if="!hasanalysis || overviewMode === 0" :time="time" :selectedactorid="selectedactorid" :targetless="targetless"></combat-replay-overview-stats-component>
            <combat-replay-wvw-analysis-component v-else :time="time" :selectedactorid="selectedactorid"></combat-replay-wvw-analysis-component>
        </div>
        `,
        data: function () {
            return {
                overviewMode: 0,
            };
        },
    });

    Vue.component("combat-replay-wvw-analysis-squad-card", {
        mixins: [combatReplayWvWAnalysisMixin],
        props: ["time", "teamkey"],
        template: `
        <div class="combat-replay-wvw-analysis-card">
            <ul class="nav nav-pills d-flex flex-row justify-content-center mb-2 scale85 combat-replay-wvw-team-subtabs">
                <li class="nav-item">
                    <a class="nav-link" :class="{active: teamkey === 'squad'}" @click="$emit('update:teamkey', 'squad')">My Squad</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" :class="{active: teamkey === 'enemy'}" @click="$emit('update:teamkey', 'enemy')">Enemy Team</a>
                </li>
            </ul>
            <div v-if="topBursts.length > 0" class="combat-replay-wvw-analysis-bursts">
                <div class="combat-replay-wvw-analysis-card-title">Top 5 {{teamLabel}} Bursts</div>
                <button v-for="(burst, index) in topBursts" :key="teamkey + '-burst-' + burst.time + '-' + index" type="button" class="combat-replay-wvw-analysis-burst-entry" @click="jumpToBurst(burst.time)">
                    <span class="combat-replay-wvw-analysis-burst-rank">{{index + 1}}.</span>
                    <span class="combat-replay-wvw-analysis-burst-time">{{formatTime(burst.time)}}</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{formatCount(burst.damage)}} damage</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{burst.downs}} ({{burst.downsTotal}}) downs</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{burst.kills}} ({{burst.killsTotal}}) kills</span>
                    <span class="combat-replay-wvw-analysis-burst-detail">{{burst.strips}} strips</span>
                </button>
            </div>
            <div class="combat-replay-wvw-analysis-card-title">{{teamLabel}} Now (last 3s)</div>
            <div class="combat-replay-wvw-analysis-grid">
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Burst strength</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{formatCount(damage)}} damage
                        <span class="combat-replay-wvw-analysis-pill" :class="'combat-replay-wvw-analysis-pill-' + burstStrength">{{burstStrength}}</span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">{{downs}} ({{downsTotal}}) downs, {{kills}} ({{killsTotal}}) kills</div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Strip to burst</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{formatCount(strips)}} strips
                        <span class="combat-replay-wvw-analysis-pill" :class="stripSynced ? 'combat-replay-wvw-analysis-pill-success' : 'combat-replay-wvw-analysis-pill-muted'">
                            {{stripSynced ? "synced" : "not synced"}}
                        </span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">Peak gap {{stripPeakGap}} ms</div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Focus fire</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{topTargetName}}
                        <span class="combat-replay-wvw-analysis-pill" :class="focused ? 'combat-replay-wvw-analysis-pill-success' : 'combat-replay-wvw-analysis-pill-muted'">
                            {{focused ? "focused" : "spread"}}
                        </span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">
                        {{formatPercent(topTargetShare)}} top target, {{formatPercent(topThreeShare)}} top 3, {{contributors}} contributors
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Target saturation</div>
                    <div class="combat-replay-wvw-analysis-value">
                        {{formatCount(targetCount)}} targets
                        <span class="combat-replay-wvw-analysis-pill" :class="'combat-replay-wvw-analysis-pill-' + targetSaturation">{{targetSaturation}}</span>
                    </div>
                    <div class="combat-replay-wvw-analysis-detail">Counts players hit in the current 3s window</div>
                </div>
            </div>
        </div>
        `,
        computed: {
            currentTeam: function () {
                return this.getTeamAnalysis(this.teamkey);
            },
            teamLabel: function () {
                return this.currentTeam && this.currentTeam.label ? this.currentTeam.label : (this.teamkey === "enemy" ? "Enemy Team" : "My Squad");
            },
            topBursts: function () {
                return this.currentTeam && this.currentTeam.topBursts ? this.currentTeam.topBursts : [];
            },
            damage: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.damage : null, this.snapshotIndex);
            },
            downs: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.downs : null, this.snapshotIndex);
            },
            downsTotal: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.downsTotal : null, this.snapshotIndex);
            },
            kills: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.kills : null, this.snapshotIndex);
            },
            killsTotal: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.killsTotal : null, this.snapshotIndex);
            },
            burstStrength: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.burstStrength : null, this.snapshotIndex) || "normal";
            },
            strips: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.strips : null, this.snapshotIndex);
            },
            stripPeakGap: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.stripPeakGap : null, this.snapshotIndex);
            },
            stripSynced: function () {
                return !!this.getSeriesValue(this.currentTeam ? this.currentTeam.stripSynced : null, this.snapshotIndex);
            },
            topTargetId: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.topTargetIds : null, this.snapshotIndex);
            },
            topTargetName: function () {
                const actor = this.getActorByUniqueId(this.topTargetId);
                return actor ? actor.name : "No focus target";
            },
            topTargetShare: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.topTargetShare : null, this.snapshotIndex);
            },
            topThreeShare: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.topThreeTargetShare : null, this.snapshotIndex);
            },
            contributors: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.topTargetContributors : null, this.snapshotIndex);
            },
            focused: function () {
                return !!this.getSeriesValue(this.currentTeam ? this.currentTeam.focused : null, this.snapshotIndex);
            },
            targetCount: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.targetSaturationCount : null, this.snapshotIndex);
            },
            targetSaturation: function () {
                return this.getSeriesValue(this.currentTeam ? this.currentTeam.targetSaturation : null, this.snapshotIndex) || "optimal";
            },
        },
    });

    Vue.component("combat-replay-wvw-analysis-selected-card", {
        mixins: [combatReplayWvWAnalysisMixin],
        props: ["time", "selectedactorid", "teamkey"],
        template: `
        <div class="combat-replay-wvw-analysis-card">
            <div class="combat-replay-wvw-analysis-card-title">Selected Actor (last 3s)</div>
            <div v-if="selectedAttacker && selectedAttackerTimeline" class="combat-replay-wvw-analysis-selected">
                <div class="combat-replay-wvw-analysis-selected-header">
                    <img :src="selectedAttacker.icon" :alt="selectedAttacker.profession || selectedAttacker.name" class="combat-replay-wvw-analysis-selected-icon">
                    <div>
                        <div class="combat-replay-wvw-analysis-selected-name">{{selectedAttacker.name}}</div>
                        <div class="combat-replay-wvw-analysis-selected-type">{{attackerTypeLabel}}</div>
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-grid">
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Outgoing damage</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(attackerDamage)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Outgoing boon strips</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(attackerStrips)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Current focus contribution</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatPercent(attackerTopTargetContribution)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Targets hit</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(attackerTargetsHit)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Targets within 1200</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(attackerNearbyTargets)}}</div>
                    </div>
                </div>
            </div>
            <div v-else-if="selectedTarget && selectedTargetTimeline" class="combat-replay-wvw-analysis-selected">
                <div class="combat-replay-wvw-analysis-selected-header">
                    <img :src="selectedTarget.icon" :alt="selectedTarget.name" class="combat-replay-wvw-analysis-selected-icon">
                    <div>
                        <div class="combat-replay-wvw-analysis-selected-name">{{selectedTarget.name}}</div>
                        <div class="combat-replay-wvw-analysis-selected-type">{{targetTypeLabel}}</div>
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-grid">
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Incoming damage</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(targetDamageTaken)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Incoming boon strips</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(targetStripsTaken)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Attackers</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(targetAttackers)}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Attackers within 1200</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(targetNearbyAttackers)}}</div>
                    </div>
                </div>
                <div class="combat-replay-wvw-analysis-attackers" v-if="topAttackers.length > 0">
                    <div class="combat-replay-wvw-analysis-label">Top attackers</div>
                    <div v-for="attacker in topAttackers" :key="'top-attacker-' + attacker.actor.uniqueID" class="combat-replay-wvw-analysis-attacker-row">
                        <div class="combat-replay-wvw-analysis-attacker-name">
                            <img :src="attacker.actor.icon" :alt="attacker.actor.profession || attacker.actor.name" class="combat-replay-wvw-analysis-attacker-icon">
                            {{attacker.actor.name}}
                        </div>
                        <div class="combat-replay-wvw-analysis-attacker-damage">{{formatCount(attacker.damage)}}</div>
                    </div>
                </div>
            </div>
            <div v-else class="combat-replay-wvw-analysis-helper">
                Select a player on either team in the replay to view burst details for the current side.
            </div>
        </div>
        `,
        computed: {
            currentTeam: function () {
                return this.getTeamAnalysis(this.teamkey);
            },
            selectedAttackerTimeline: function () {
                return this.currentTeam && this.selectedactorid != null ? this.currentTeam.attackers[this.selectedactorid] : null;
            },
            selectedTargetTimeline: function () {
                return this.currentTeam && this.selectedactorid != null ? this.currentTeam.targets[this.selectedactorid] : null;
            },
            selectedAttacker: function () {
                return this.selectedAttackerTimeline ? this.getActorByUniqueId(this.selectedactorid) : null;
            },
            selectedTarget: function () {
                return this.selectedTargetTimeline ? this.getActorByUniqueId(this.selectedactorid) : null;
            },
            attackerTypeLabel: function () {
                if (!this.selectedAttacker) {
                    return "";
                }
                return this.teamkey === "enemy" ? "Enemy player" : "Squad player";
            },
            targetTypeLabel: function () {
                if (!this.selectedTarget) {
                    return "";
                }
                return this.teamkey === "enemy" ? "Squad player" : "Hostile player";
            },
            attackerDamage: function () {
                return this.selectedAttackerTimeline ? this.getSeriesValue(this.selectedAttackerTimeline.damage, this.snapshotIndex) : 0;
            },
            attackerStrips: function () {
                return this.selectedAttackerTimeline ? this.getSeriesValue(this.selectedAttackerTimeline.strips, this.snapshotIndex) : 0;
            },
            attackerTopTargetContribution: function () {
                return this.selectedAttackerTimeline ? this.getSeriesValue(this.selectedAttackerTimeline.topTargetContribution, this.snapshotIndex) : 0;
            },
            attackerTargetsHit: function () {
                return this.selectedAttackerTimeline ? this.getSeriesValue(this.selectedAttackerTimeline.targetsHit, this.snapshotIndex) : 0;
            },
            attackerNearbyTargets: function () {
                return this.selectedAttackerTimeline ? this.getSeriesValue(this.selectedAttackerTimeline.nearbyTargets, this.snapshotIndex) : 0;
            },
            targetDamageTaken: function () {
                return this.selectedTargetTimeline ? this.getSeriesValue(this.selectedTargetTimeline.damageTaken, this.snapshotIndex) : 0;
            },
            targetStripsTaken: function () {
                return this.selectedTargetTimeline ? this.getSeriesValue(this.selectedTargetTimeline.stripsTaken, this.snapshotIndex) : 0;
            },
            targetAttackers: function () {
                return this.selectedTargetTimeline ? this.getSeriesValue(this.selectedTargetTimeline.attackers, this.snapshotIndex) : 0;
            },
            targetNearbyAttackers: function () {
                return this.selectedTargetTimeline ? this.getSeriesValue(this.selectedTargetTimeline.nearbyAllies, this.snapshotIndex) : 0;
            },
            topAttackers: function () {
                if (!this.selectedTargetTimeline) {
                    return [];
                }
                const attackerIds = this.getSeriesArrayValue(this.selectedTargetTimeline.topAttackerIds, this.snapshotIndex);
                const attackerDamage = this.getSeriesArrayValue(this.selectedTargetTimeline.topAttackerDamage, this.snapshotIndex);
                const result = [];
                for (let index = 0; index < attackerIds.length; index++) {
                    const actor = this.getActorByUniqueId(attackerIds[index]);
                    if (!actor) {
                        continue;
                    }
                    result.push({
                        actor: actor,
                        damage: attackerDamage[index] || 0,
                    });
                }
                return result;
            },
        },
    });

    Vue.component("combat-replay-wvw-analysis-component", {
        mixins: [combatReplayWvWAnalysisMixin],
        props: ["time", "selectedactorid"],
        template: `
        <div v-if="crAnalysis" class="combat-replay-wvw-analysis-panel">
            <combat-replay-wvw-analysis-squad-card :time="time" :teamkey="teamKey" @update:teamkey="teamKey = $event"></combat-replay-wvw-analysis-squad-card>
            <combat-replay-wvw-analysis-selected-card :time="time" :selectedactorid="selectedactorid" :teamkey="teamKey"></combat-replay-wvw-analysis-selected-card>
        </div>
        `,
        data: function () {
            return {
                teamKey: "squad",
            };
        },
    });

    Vue.component("combat-replay-status-data-component", {
        template: `${template}`,
        props: ["time", "selectedactorid"],
        data: function() {
            return {
                targetless: logData.targetless,
                mode: 0,
            };
        },
        computed: {
            hasAnalysis: function () {
                return !!(crData && crData.analysis);
            },
        },
    });
</script>
