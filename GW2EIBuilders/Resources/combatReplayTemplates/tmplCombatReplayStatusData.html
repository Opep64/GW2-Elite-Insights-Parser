                                <div class="wvw-summary-modal-skill">
                                    <div class="wvw-summary-modal-skill-name">{{occurrence.effectName}}</div>
                                    <div class="wvw-summary-modal-secondary">{{occurrence.skillName}}</div>
                                    <div class="wvw-summary-modal-secondary">{{occurrence.timeLabel}} · {{occurrence.playerName}}</div>
                                </div>
                                <div class="wvw-summary-modal-values">
                                    <span class="wvw-summary-modal-count">{{formatAmount(occurrence.estimatedPreventedDamage)}}</span>
                                    <span v-if="occurrence.usedFallbackEstimate" class="wvw-summary-modal-secondary">fallback 50</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        `,
        computed: {
            defenseAnalysis: function () {
                return this.getDefenseAnalysis();
            },
            burstBarrier: function () {
                return this.defenseAnalysis && this.defenseAnalysis.burstBarrier ? this.defenseAnalysis.burstBarrier : null;
            },
            mitigationThresholds: function () {
                return this.defenseAnalysis && this.defenseAnalysis.mitigation && this.defenseAnalysis.mitigation.thresholds
                    ? this.defenseAnalysis.mitigation.thresholds
                    : [];
            },
            selectedMitigation: function () {
                if (this.mitigationThresholds.length === 0) {
                    return null;
                }
                return this.mitigationThresholds.find(threshold => threshold.thresholdPercent === this.selectedMitigationThreshold) || this.mitigationThresholds[this.mitigationThresholds.length - 1];
            },
            allSelectedMitigationEvents: function () {
                return this.selectedMitigation && this.selectedMitigation.events ? this.selectedMitigation.events : [];
            },
            mitigationSavedFilteredEvents: function () {
                return this.allSelectedMitigationEvents.filter(event => {
                    if (!this.mitigationSavedOnly) {
                        return true;
                    }
                    if (this.selectedMitigationEffect === "Barrier") {
                        return !!event.barrierSavedPlayer;
                    }
                    if (this.selectedMitigationEffect) {
                        return (!!event.estimatedMitigationSavedPlayer
                            && !!event.estimatedMitigationSavedEffects
                            && event.estimatedMitigationSavedEffects.includes(this.selectedMitigationEffect))
                            || (!!event.estimatedNegatedDamageSavedPlayer
                                && !!event.estimatedNegatedDamageSavedEffects
                                && event.estimatedNegatedDamageSavedEffects.includes(this.selectedMitigationEffect));
                    }
                    return !!event.barrierSavedPlayer || !!event.estimatedMitigationSavedPlayer || !!event.estimatedNegatedDamageSavedPlayer;
                });
            },
            mitigationEffectFilteredEvents: function () {
                return this.mitigationSavedFilteredEvents.filter(event =>
                    !this.selectedMitigationEffect
                    || (event.effects && event.effects.some(effect => effect && effect.name === this.selectedMitigationEffect))
                );
            },
            mitigationPlayers: function () {
                const playersById = new Map();
                for (const event of this.mitigationEffectFilteredEvents) {
                    if (event && event.actorId != null && !playersById.has(event.actorId)) {
                        playersById.set(event.actorId, {
                            uniqueID: event.actorId,
                            name: event.name,
                            icon: event.icon,
                            profession: "",
                        });
                    }
                }
                return Array.from(playersById.values()).sort((left, right) => left.name.localeCompare(right.name));
            },
            filteredMitigationPlayers: function () {
                const query = this.normalizeSearchValue(this.mitigationPlayerSearchQuery);
                const players = query
                    ? this.mitigationPlayers.filter(player => this.normalizeSearchValue(player.name).includes(query))
                    : this.mitigationPlayers;
                return players.slice(0, 12);
            },
            selectedMitigationPlayer: function () {
                if (this.selectedMitigationPlayerId == null) {
                    return null;
                }
                return this.mitigationPlayers.find(player => String(player.uniqueID) === String(this.selectedMitigationPlayerId)) || null;
            },
            mitigationEffectOptions: function () {
                const effectNames = new Set();
                for (const event of this.allSelectedMitigationEvents) {
                    if (!event.effects) {
                        continue;
                    }
                    for (const effect of event.effects) {
                        if (effect && effect.name) {
                            effectNames.add(effect.name);
                        }
                    }
                }
                return Array.from(effectNames).sort((left, right) => left.localeCompare(right));
            },
            selectedMitigationEvents: function () {
                if (this.selectedMitigationPlayerId == null) {
                    return this.mitigationEffectFilteredEvents;
                }
                const selectedId = String(this.selectedMitigationPlayerId);
                return this.mitigationEffectFilteredEvents.filter(event => String(event.actorId) === selectedId);
            },
            selectedMitigationCount: function () {
                return this.selectedMitigationEvents.length;
            },
        },
        watch: {
            mitigationPlayerSearchQuery: function (newQuery) {
                if (newQuery) {
                    this.mitigationPlayerSearchOpen = true;
                }
            },
            mitigationEffectOptions: function (newOptions) {
                if (this.selectedMitigationEffect && newOptions.indexOf(this.selectedMitigationEffect) === -1) {
                    this.selectedMitigationEffect = "";
                }
            },
            mitigationPlayers: function (newPlayers) {
                if (this.selectedMitigationPlayerId != null && !newPlayers.some(player => String(player.uniqueID) === String(this.selectedMitigationPlayerId))) {
                    this.selectedMitigationPlayerId = null;
                    this.mitigationPlayerSearchQuery = "";
                }
            },
            selectedMitigationEvents: function () {
                this.scheduleMitigationScrollRestore();
            },
        },
        activated: function () {
            this.scheduleMitigationScrollRestore();
        },
        updated: function () {
            this.applyMitigationScrollRestore();
        },
        deactivated: function () {
            this.captureMitigationScroll();
        },
        methods: {
            focusProvider: function (entry) {
                if (!entry || !entry.actorId) {
                    return;
                }
                this.selectReplayActor(entry.actorId);
            },
            captureMitigationScroll: function () {
                if (this.$refs.mitigationList) {
                    this.mitigationListScrollTop = this.$refs.mitigationList.scrollTop;
                }
                this.pendingMitigationScrollRestore = this.mitigationListScrollTop > 0;
            },
            openMitigationPlayerSearch: function () {
                this.mitigationPlayerSearchOpen = true;
            },
            handleMitigationPlayerSearchInput: function () {
                this.mitigationPlayerSearchOpen = true;
            },
            handleMitigationPlayerSearchBlur: function () {
                setTimeout(() => {
                    this.mitigationPlayerSearchQuery = "";
                    this.mitigationPlayerSearchOpen = false;
                }, 120);
            },
            chooseMitigationPlayer: function (player) {
                this.captureMitigationScroll();
                this.selectedMitigationPlayerId = player.uniqueID;
                this.mitigationPlayerSearchQuery = "";
                this.mitigationPlayerSearchOpen = false;
            },
            clearMitigationPlayerFilter: function () {
                this.captureMitigationScroll();
                this.selectedMitigationPlayerId = null;
                this.mitigationPlayerSearchQuery = "";
                this.mitigationPlayerSearchOpen = false;
            },
            applyMitigationScrollRestore: function () {
                if (!this.pendingMitigationScrollRestore || !this.$refs.mitigationList) {
                    return;
                }
                this.$refs.mitigationList.scrollTop = this.mitigationListScrollTop || 0;
                if (Math.abs(this.$refs.mitigationList.scrollTop - (this.mitigationListScrollTop || 0)) <= 1) {
                    this.pendingMitigationScrollRestore = false;
                }
            },
            scheduleMitigationScrollRestore: function () {
                if (!(this.mitigationListScrollTop > 0)) {
                    return;
                }
                this.pendingMitigationScrollRestore = true;
                this.$nextTick(() => {
                    this.applyMitigationScrollRestore();
                    if (window.requestAnimationFrame) {
                        window.requestAnimationFrame(() => this.applyMitigationScrollRestore());
                    }
                    setTimeout(() => this.applyMitigationScrollRestore(), 0);
                    setTimeout(() => this.applyMitigationScrollRestore(), 50);
                    setTimeout(() => this.applyMitigationScrollRestore(), 150);
                });
            },
            setOverviewMode: function () {
                var current = this.$parent;
                while (current) {
                    if (current.$data && Object.prototype.hasOwnProperty.call(current.$data, "overviewMode")) {
                        current.overviewMode = 0;
                        return;
                    }
                    current = current.$parent;
                }
            },
            openMitigationEventAt: function (event, time) {
                if (!event) {
                    return;
                }
                this.captureMitigationScroll();
                this.setOverviewMode();
                this.jumpToBurst(time);
                this.selectReplayActor(event.actorId);
            },
            openNegatedHitSummaryDetail: function (summary) {
                if (!summary || !summary.occurrences || summary.occurrences.length === 0) {
                    return;
                }
                this.negatedHitDetailModal = {
                    title: summary.label + " Occurrences",
                    subtitle: "Each occurrence shows the matched effect, the skill that was negated, and the estimated prevented damage.",
                    occurrences: summary.occurrences,
                };
            },
            closeNegatedHitSummaryDetail: function () {
                this.negatedHitDetailModal = null;
            },
            formatMitigationSeconds: function (seconds) {
                return this.formatAmount(seconds) + "s";
            },
            formatMitigationWindowDuration: function (event) {
                if (!event || !event.previousFullHealthTime || !event.recoveryTime || event.recoveryTime <= event.previousFullHealthTime) {
                    return "";
                }
                return "Full to Recover " + this.formatAmount((event.recoveryTime - event.previousFullHealthTime) / 1000.0) + "s";
            },
            getMitigationEffectTooltip: function (effect) {
                if (!effect || !effect.name) {
                    return "";
                }
                const tooltips = {
                    "Barrier": "Barrier absorbs incoming damage before it reaches health.",

                    "Invulnerability": "Invulnerability prevents incoming damage from affecting the actor while active.",
                    "Spawn Protection": "Spawn Protection prevents incoming damage from affecting the actor while active.",
                    "Strength in Numbers": "Strength in Numbers is a Guardian defensive buff that reduces incoming damage while active.",
                    "Obsidian Flesh": "Obsidian Flesh grants invulnerability while active.",
                    "Rebound": "Rebound is a defensive effect that can prevent a death while active.",
                    "Spectrum Shield": "Spectrum Shield reduces incoming strike and condition damage while active.",
                    "Barrier Signet": "Barrier Signet reduces incoming strike and condition damage while active.",
                    "Renewed Focus": "Renewed Focus grants invulnerability while active.",
                    "Death Shroud": "Death Shroud reduces incoming damage while active.",
                    "Signet of Stone": "Signet of Stone is a defensive signet state while active.",

                    "Shielding Hands": "Shielding Hands reduces incoming damage while active.",
                    "Shadow Shroud": "Shadow Shroud reduces incoming damage while active.",
                };
                return tooltips[effect.name] || "";
            },
        },
    });

                            : null;

                            evaluation: evaluation,

                    })

            filteredPlayers: function () {
                const query = this.normalizeSearchValue(this.playerSearchQuery);

                return player ? player.name : "no player match";

                const player = this.debugStickyActorId != null ? this.getPlayerByUniqueId(this.debugStickyActorId) : null;
                return player ? player.name : "no player match";
            },
            debugRequestedReplayActorState: function () {
                if (this.debugRequestedActorId == null) {
                    return "no replay request";
                }
                if (!animator || typeof animator.getActorData !== "function") {
                    return "animator unavailable";
                }
                return animator.getActorData(this.debugRequestedActorId) ? "replay actor ready" : "replay actor missing";
            },
            debugPendingReplayActorState: function () {
                if (this.debugPendingActorId == null) {
                    return "no pending actor";
                }
                if (!animator || typeof animator.getActorData !== "function") {
                    return "animator unavailable";
                }
                return animator.getActorData(this.debugPendingActorId) ? "replay actor ready" : "replay actor missing";
            },
            debugReactiveReplayActorState: function () {
                if (this.debugReactiveSelectedActorId == null) {
                    return "no reactive actor";

            debugPropReplayActorState: function () {

                    return this.selectedactorid;

                    return this.debugPendingActorId;
                }
                if (this.debugRequestedActorId != null && this.getPlayerByUniqueId(this.debugRequestedActorId)) {
                    return this.debugRequestedActorId;
                }
                if (this.debugStickyActorId != null && this.getPlayerByUniqueId(this.debugStickyActorId)) {
                    return this.debugStickyActorId;
                }

                }
                return this.crAnalysis.playerEvaluations[this.selectedPlayer.uniqueID] || null;

            commanderSelected: function () {
                return !!(this.selectedPlayer && this.positioningAnalysis && this.selectedPlayer.uniqueID === this.positioningAnalysis.commanderId);

            selectedBurstTimeline: function () {

            selectedThreatTimeline: function () {
                return this.selectedPlayer && this.threatAnalysis ? this.threatAnalysis.players[this.selectedPlayer.uniqueID] || null : null;
            },
            selectedPositioningTimeline: function () {
                if (!this.selectedPlayer || !this.positioningAnalysis || this.commanderSelected) {
                    return null;
                }
                return this.positioningAnalysis.players[this.selectedPlayer.uniqueID] || null;
            },
            playerDamage: function () {
                return this.selectedBurstTimeline ? this.getSeriesValue(this.selectedBurstTimeline.damage, this.snapshotIndex) : 0;

            playerStrips: function () {
                return this.selectedBurstTimeline ? this.getSeriesValue(this.selectedBurstTimeline.strips, this.snapshotIndex) : 0;

            },
            playerCleanses: function () {
                return this.selectedBurstTimeline ? this.getSeriesValue(this.selectedBurstTimeline.cleanses, this.snapshotIndex) : 0;
            },
            playerTargetsHit: function () {
                return this.selectedBurstTimeline ? this.getSeriesValue(this.selectedBurstTimeline.targetsHit, this.snapshotIndex) : 0;
            },
            playerNearbyTargets: function () {
                return this.selectedBurstTimeline ? this.getSeriesValue(this.selectedBurstTimeline.nearbyTargets, this.snapshotIndex) : 0;

            playerTopTargetContribution: function () {
                return this.selectedBurstTimeline ? this.getSeriesValue(this.selectedBurstTimeline.topTargetContribution, this.snapshotIndex) : 0;
            },
            nearbyEnemies: function () {
                return this.selectedThreatTimeline ? this.getSeriesValue(this.selectedThreatTimeline.nearbyEnemies, this.snapshotIndex) : 0;
            },
            runningThreatTime: function () {
                return this.selectedThreatTimeline ? this.getSeriesValue(this.selectedThreatTimeline.runningThreatTime, this.snapshotIndex) : 0;
            },
            currentThreatened: function () {
                return !!(this.selectedThreatTimeline && this.getSeriesValue(this.selectedThreatTimeline.threatened, this.snapshotIndex));
            },
            currentThreatStatus: function () {
                if (!this.selectedThreatTimeline) {
                    return "threat status unavailable";
                }
                return this.currentThreatened ? "currently threatened" : "not currently threatened";
            },
            selectedPlayerBoons: function () {
                if (!this.selectedThreatTimeline || !this.selectedThreatTimeline.boons) {
                    return [];
                }
                return this.selectedThreatTimeline.boons.map(boon => ({
                    id: boon.id,
                    name: boon.name,
                    icon: boon.icon,
                    stackBased: boon.stackBased,
                    tracksOverapplication: boon.tracksOverapplication,
                    currentStacks: this.getSeriesValue(boon.currentStacks, this.snapshotIndex),
                    runningCoverage: this.getSeriesValue(boon.runningCoverage, this.snapshotIndex),
                    runningOverapplication: this.getSeriesValue(boon.runningOverapplication, this.snapshotIndex),
                }));
            },
            distanceToCommander: function () {
                return this.selectedPositioningTimeline ? this.getSeriesValue(this.selectedPositioningTimeline.distanceToCommander, this.snapshotIndex) : 0;
            },
            enemiesCloserThanCommander: function () {
                return this.selectedPositioningTimeline ? this.getSeriesValue(this.selectedPositioningTimeline.enemiesCloserThanCommander, this.snapshotIndex) : 0;
            },
            enemiesAheadOfCommander: function () {
                return this.selectedPositioningTimeline ? this.getSeriesValue(this.selectedPositioningTimeline.enemiesAheadOfCommander, this.snapshotIndex) : 0;
            },
            runningInPositionRate: function () {
                return this.selectedPositioningTimeline ? this.getSeriesValue(this.selectedPositioningTimeline.runningInPositionRate, this.snapshotIndex) : 0;
            },
            runningOverextendedRate: function () {
                return this.selectedPositioningTimeline ? this.getSeriesValue(this.selectedPositioningTimeline.runningOverextendedRate, this.snapshotIndex) : 0;
            },
            runningLateralRiskRate: function () {
                return this.selectedPositioningTimeline ? this.getSeriesValue(this.selectedPositioningTimeline.runningLateralRiskRate, this.snapshotIndex) : 0;
            },
            currentPositionStatus: function () {
                if (this.commanderSelected) {
                    return "commander anchor";
                }
                if (!this.selectedPositioningTimeline) {
                    return "position unavailable";
                }
                if (!this.getSeriesValue(this.selectedPositioningTimeline.eligible, this.snapshotIndex)) {
                    return "not currently evaluated";
                }
                const reasons = [];
                if (this.getSeriesValue(this.selectedPositioningTimeline.tooFar, this.snapshotIndex)) {
                    reasons.push("too far");
                }
                if (this.getSeriesValue(this.selectedPositioningTimeline.overextended, this.snapshotIndex)) {
                    reasons.push("overextended");
                }
                if (this.getSeriesValue(this.selectedPositioningTimeline.lateralRisk, this.snapshotIndex)) {
                    reasons.push("left/right exposed");
                }
                return reasons.length > 0 ? reasons.join(", ") : "in position";
            },
        },
        methods: {
            openPlayerSearch: function () {
                this.playerSearchOpen = true;
            },
            handlePlayerSearchBlur: function () {
                window.setTimeout(() => {
                    this.playerSearchOpen = false;

            choosePlayer: function (player) {

                navigationState.stickySelectedActorId = player.uniqueID;

            openPlayerEvaluationCompare: function () {

                this.comparisonSelectedPlayerIds = this.selectedPlayer ? [this.selectedPlayer.uniqueID] : [];
            },
            closePlayerEvaluationCompare: function () {
                this.showPlayerEvaluationCompare = false;
            },
            isComparisonPlayerSelected: function (uniqueId) {
                return this.comparisonSelectedPlayerIds.includes(uniqueId);
            },
            toggleComparisonPlayer: function (uniqueId) {
                if (this.isComparisonPlayerSelected(uniqueId)) {
                    this.comparisonSelectedPlayerIds = this.comparisonSelectedPlayerIds.filter(id => id !== uniqueId);
                    return;
                }
                if (this.comparisonSelectedPlayerIds.length >= this.maxPlayerComparisonCount) {
                    return;
                }
                this.comparisonSelectedPlayerIds = [...this.comparisonSelectedPlayerIds, uniqueId];
            },
            openPlayerEvaluationAreaDetail: function (area) {

                this.playerEvaluationDetailModal = {
                    title: area.drilldownTitle || area.label,
                    subtitle: area.drilldownSubtitle || "",
                    sections: area.detailSections,
                };
            },
            closePlayerEvaluationAreaDetail: function () {
                this.playerEvaluationDetailModal = null;
            },
        },
    });

                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Distance to commander</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatCount(distanceToCommander)}}</div>
                                </div>
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Enemies closer than commander</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatCount(enemiesCloserThanCommander)}}</div>
                                </div>
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Enemies ahead of commander</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatCount(enemiesAheadOfCommander)}}</div>
                                </div>
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Running in position</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatPercent(runningInPositionRate)}}</div>
                                </div>
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Running too far</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatPercent(runningTooFarRate)}}</div>
                                </div>
                                <div class="combat-replay-wvw-analysis-metric">
                                    <div class="combat-replay-wvw-analysis-label">Running exposure</div>
                                    <div class="combat-replay-wvw-analysis-value">{{formatPercent(runningOverextendedRate)}} overextended</div>
                                    <div class="combat-replay-wvw-analysis-detail">{{formatPercent(runningLateralRiskRate)}} left/right exposed</div>
                                </div>
                            </div>
                        </div>
                        <div v-else class="combat-replay-wvw-analysis-helper">
                            Select a non-commander squad player in the replay to view positioning details.
                        </div>
                    </div>
                </template>
                <div v-else-if="positioningMode === 1" class="combat-replay-wvw-analysis-card">
                    <div class="combat-replay-wvw-analysis-card-title">Squad Players Now</div>
                    <div class="combat-replay-positioning-player-grid">
                        <div v-for="playerState in positioningPlayers" :key="'positioning-player-' + playerState.player.uniqueID" class="combat-replay-positioning-player-card" :class="{active: selectedactorid === playerState.player.uniqueID}" @click="selectPositioningPlayer(playerState.player.uniqueID)">
                            <div class="combat-replay-positioning-player-compact">
                                <img :src="playerState.player.icon" :alt="playerState.player.profession || playerState.player.name" class="combat-replay-threat-boon-icon">
                                <span class="combat-replay-positioning-player-name">{{playerState.player.name}}</span>
                                <span class="combat-replay-wvw-analysis-pill" :class="'combat-replay-wvw-analysis-pill-' + playerState.statusClass">{{playerState.compactStatusLabel}}</span>
                            </div>
                            <div class="combat-replay-positioning-player-tooltip">
                                <div class="combat-replay-positioning-player-tooltip-title">{{playerState.player.name}}</div>
                                <div class="combat-replay-positioning-player-values">
                                    <span>{{formatCount(playerState.distanceToCommander)}} from commander</span>
                                    <span>{{formatCount(playerState.enemiesCloserThanCommander)}} closer-than-tag enemies</span>
                                    <span>{{formatCount(playerState.enemiesAheadOfCommander)}} ahead-of-tag enemies</span>
                                </div>
                                <div class="combat-replay-wvw-analysis-detail">{{playerState.detail}}</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div v-else class="combat-replay-wvw-analysis-card">
                    <div class="combat-replay-wvw-analysis-card-title">Player In-Position Summary</div>
                    <div class="combat-replay-positioning-summary-grid">
                        <div v-for="playerSummary in positioningPlayerSummaries" :key="'positioning-summary-' + playerSummary.player.uniqueID" class="combat-replay-positioning-summary-card" :class="{active: selectedactorid === playerSummary.player.uniqueID}" @click="selectPositioningPlayer(playerSummary.player.uniqueID)">
                            <div class="combat-replay-positioning-player-compact">
                                <img :src="playerSummary.player.icon" :alt="playerSummary.player.profession || playerSummary.player.name" class="combat-replay-threat-boon-icon">
                                <span class="combat-replay-positioning-player-name">{{playerSummary.player.name}}</span>
                            </div>
                            <div class="combat-replay-positioning-summary-value">{{formatPercent(playerSummary.inPositionRate)}}</div>
                            <div class="combat-replay-wvw-analysis-detail">{{formatCount(playerSummary.evaluatedSamples)}} evaluated snapshots</div>
                        </div>
                    </div>
                </div>
            </template>
            <div v-if="showPositioningHelp" class="wvw-summary-modal-backdrop" @click.self="showPositioningHelp = false">
                <div class="wvw-summary-modal combat-replay-overview-help-modal" role="dialog" aria-modal="true" aria-label="Combat replay positioning help">
                    <button type="button" class="wvw-summary-modal-close" aria-label="Close positioning help" @click="showPositioningHelp = false">&times;</button>
                    <div class="wvw-summary-modal-title">Positioning Help</div>
                    <div class="wvw-summary-modal-subtitle">
                        The Positioning tab scores squad spacing around the commander during engaged moments, with the commander acting as the anchor instead of a scored player.
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Sub-tabs</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Group Summary</strong> shows the full-fight positioning rates, the current replay snapshot, and a selected-player drilldown</li>
                            <li><strong>Players</strong> shows each squad player's current positioning state at the replay time</li>
                            <li><strong>Player Summary</strong> ranks squad players by their full-fight in-position percentage</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Who gets evaluated</div>
                        <ul class="combat-replay-overview-help-list">
                            <li>Only squad players are considered, and the commander is excluded from scoring</li>
                            <li>A snapshot is only scored when at least one hostile player is within {{positioningAnalysis.engageRange}} of the commander</li>
                            <li>Players are excluded if they are downed, dead, disconnected, or more than {{positioningAnalysis.ignoreCommanderDistance}} from the commander</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">In-position rules</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>In position</strong> means the player is evaluated and not flagged as too far, overextended, or left/right exposed</li>
                            <li><strong>Too far</strong> means farther than {{positioningAnalysis.desiredCommanderDistance}} from the commander, or farther than {{positioningAnalysis.mingledCommanderDistance}} when the groups are mingled</li>
                            <li><strong>Mingled</strong> means more than {{positioningAnalysis.mingledEnemyThreshold}} hostile players are within {{positioningAnalysis.mingledRange}} of the commander</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Out-of-position rules</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Out of position</strong> means any evaluated player flagged as too far, overextended, or left/right exposed</li>
                            <li><strong>Overextended</strong> means the player is on the enemy side of the commander while the groups are not mingled, and it is only counted when fewer than {{positioningAnalysis.overextendedPlayerThreshold}} players are overextended in that snapshot</li>
                            <li><strong>Left/right exposed</strong> means more than {{positioningAnalysis.enemyCountThreshold}} hostile players are closer to the player than to the commander, unless the groups are mingled</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Not evaluated</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Not evaluated</strong> means the current snapshot is not scored for that player because the fight is not engaged yet or the player is excluded for that moment</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        `,
        computed: {
            positioningAnalysis: function () {
                return this.getPositioningAnalysis();
            },
            currentEngagedEnemies: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.engagedEnemyCount : null, this.snapshotIndex);
            },
            enemiesNearCommander: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.enemiesNearCommanderCount : null, this.snapshotIndex);
            },
            isMingled: function () {
                return !!this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.mingled : null, this.snapshotIndex);
            },
            eligiblePlayers: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.eligiblePlayerCount : null, this.snapshotIndex);
            },
            inPositionCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.inPositionCount : null, this.snapshotIndex);
            },
            outOfPositionCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.outOfPositionCount : null, this.snapshotIndex);
            },
            tooFarCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.tooFarCount : null, this.snapshotIndex);
            },
            overextendedCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.overextendedCount : null, this.snapshotIndex);
            },
            lateralRiskCount: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.lateralRiskCount : null, this.snapshotIndex);
            },
            inPositionRate: function () {
                return this.getSeriesValue(this.positioningAnalysis ? this.positioningAnalysis.inPositionRate : null, this.snapshotIndex);
            },
            currentDesiredCommanderDistance: function () {
                if (!this.positioningAnalysis) {
                    return 0;
                }
                return this.isMingled ? this.positioningAnalysis.mingledCommanderDistance : this.positioningAnalysis.desiredCommanderDistance;
            },
            selectedPlayerTimeline: function () {
                if (!this.positioningAnalysis || this.selectedactorid == null) {
                    return null;
                }
                if (this.selectedactorid === this.positioningAnalysis.commanderId) {
                    return null;
                }
                return this.positioningAnalysis.players[this.selectedactorid] || null;
            },
            selectedPlayer: function () {
                return this.selectedPlayerTimeline ? this.getPlayerByUniqueId(this.selectedactorid) : null;
            },
            distanceToCommander: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.distanceToCommander, this.snapshotIndex) : 0;
            },
            enemiesCloserThanCommander: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.enemiesCloserThanCommander, this.snapshotIndex) : 0;
            },
            enemiesAheadOfCommander: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.enemiesAheadOfCommander, this.snapshotIndex) : 0;
            },
            runningInPositionRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningInPositionRate, this.snapshotIndex) : 0;
            },
            runningTooFarRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningTooFarRate, this.snapshotIndex) : 0;
            },
            runningOverextendedRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningOverextendedRate, this.snapshotIndex) : 0;
            },
            runningLateralRiskRate: function () {
                return this.selectedPlayerTimeline ? this.getSeriesValue(this.selectedPlayerTimeline.runningLateralRiskRate, this.snapshotIndex) : 0;
            },
            playerStatusLabel: function () {
                if (!this.selectedPlayerTimeline) {
                    return "";
                }
                if (!this.getSeriesValue(this.selectedPlayerTimeline.eligible, this.snapshotIndex)) {
                    return "not currently evaluated";
                }
                const reasons = [];
                if (this.getSeriesValue(this.selectedPlayerTimeline.tooFar, this.snapshotIndex)) {
                    reasons.push("too far");
                }
                if (this.getSeriesValue(this.selectedPlayerTimeline.overextended, this.snapshotIndex)) {
                    reasons.push("overextended");
                }
                if (this.getSeriesValue(this.selectedPlayerTimeline.lateralRisk, this.snapshotIndex)) {
                    reasons.push("left/right exposed");
                }
                return reasons.length > 0 ? reasons.join(", ") : "in position";
            },
            positioningPlayers: function () {
                if (!this.positioningAnalysis) {
                    return [];
                }
                return logData.players
                    .filter(player => !player.isFake && !player.notInSquad && player.uniqueID !== this.positioningAnalysis.commanderId)
                    .map(player => {
                        const timeline = this.positioningAnalysis.players[player.uniqueID];
                        if (!timeline) {
                            return null;
                        }
                        const eligible = !!this.getSeriesValue(timeline.eligible, this.snapshotIndex);
                        const tooFar = !!this.getSeriesValue(timeline.tooFar, this.snapshotIndex);
                        const overextended = !!this.getSeriesValue(timeline.overextended, this.snapshotIndex);
                        const lateralRisk = !!this.getSeriesValue(timeline.lateralRisk, this.snapshotIndex);
                        const inPosition = !!this.getSeriesValue(timeline.inPosition, this.snapshotIndex);
                        let statusLabel = "not evaluated";
                        let statusClass = "normal";
                        let detail = "Excluded right now because the player is downed, dead, disconnected, or too far from the commander.";
                        if (eligible) {
                            if (inPosition) {
                                statusLabel = "in position";
                                statusClass = "success";
                                detail = "Close enough to the commander and not currently flagged as exposed.";
                            } else {
                                statusLabel = "out of position";
                                statusClass = "weak";
                                const reasons = [];
                                if (tooFar) {
                                    reasons.push("too far from commander");
                                }
                                if (overextended) {
                                    reasons.push("overextended ahead of the commander");
                                }
                                if (lateralRisk) {
                                    reasons.push("too far left/right of the commander");
                                }
                                detail = reasons.join(", ");
                            }
                        }
                        return {
                            player: player,
                            statusLabel: statusLabel,
                            compactStatusLabel: eligible ? (inPosition ? "IP" : "OOP") : "NE",
                            statusClass: statusClass,
                            detail: detail,
                            distanceToCommander: this.getSeriesValue(timeline.distanceToCommander, this.snapshotIndex),
                            enemiesCloserThanCommander: this.getSeriesValue(timeline.enemiesCloserThanCommander, this.snapshotIndex),
                            enemiesAheadOfCommander: this.getSeriesValue(timeline.enemiesAheadOfCommander, this.snapshotIndex),
                        };
                    })
                    .filter(playerState => playerState != null)
                    .sort((left, right) => left.player.name.localeCompare(right.player.name));
            },
            positioningPlayerSummaries: function () {
                if (!this.positioningAnalysis) {
                    return [];
                }
                return logData.players
                    .filter(player => !player.isFake && !player.notInSquad && player.uniqueID !== this.positioningAnalysis.commanderId)
                    .map(player => {
                        const timeline = this.positioningAnalysis.players[player.uniqueID];
                        if (!timeline) {
                            return null;
                        }
                        const evaluatedSamples = timeline.eligible.reduce((total, sample) => total + (sample ? 1 : 0), 0);
                        const inPositionSamples = timeline.inPosition.reduce((total, sample, index) => total + (timeline.eligible[index] && sample ? 1 : 0), 0);
                        return {
                            player: player,
                            evaluatedSamples: evaluatedSamples,
                            inPositionRate: evaluatedSamples > 0 ? Math.round((inPositionSamples * 1000.0) / evaluatedSamples) / 10.0 : 0,
                        };
                    })
                    .filter(playerSummary => playerSummary != null)
                    .sort((left, right) => {
                        if (right.inPositionRate !== left.inPositionRate) {
                            return right.inPositionRate - left.inPositionRate;
                        }
                        return left.player.name.localeCompare(right.player.name);
                    });
            },
        },
        data: function () {
            return {
                positioningMode: 0,
                showPositioningHelp: false,
            };
        },
        methods: {
            selectPositioningPlayer: function (uniqueId) {
                if (!animator) {
                    return;
                }
                animator.selectActor(uniqueId);
            },
        },
    });

    Vue.component("combat-replay-status-data-component", {
        template: `${template}`,
        props: ["time", "selectedactorid"],
        data: function() {
            return {
                targetless: logData.targetless,
                mode: 0,
            };
        },
    });
</script>
