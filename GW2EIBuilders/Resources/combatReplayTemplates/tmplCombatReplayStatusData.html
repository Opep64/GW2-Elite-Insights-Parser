<template>
    <div class="d-flex flex-column justify-content-center">
        <ul v-if="showTabs" class="nav nav-pills d-flex flex-row justify-content-center mb-1">
            <li class="nav-item">
                <a class="nav-link" :class="{active: mode === 0}" @click="mode = 0">Actors</a>
            </li>
            <li v-if="hasMechanics" class="nav-item">
                <a class="nav-link" :class="{active: mode === 1}" @click="mode = 1">Mechanics</a>
            </li>
        </ul>
        <div class="squad-details">
            <keep-alive>
                <combat-replay-actors-stats-component v-if="mode === 0" :key="'actors-cr-details'" :time="time" :selectedactorid="selectedactorid"></combat-replay-actors-stats-component>
                <combat-replay-mechanics-list-component v-if="mode === 1" :key="'mechanics-cr-details'" :time="time" :light="light" :selectedactorid="selectedactorid"></combat-replay-mechanics-list-component>
            </keep-alive>
        </div>
    </div>
</template>

<script>
    const combatReplayWvWAnalysisMixin = {
        computed: {
            crAnalysis: function () {
                return crData && crData.analysis ? crData.analysis : null;
            },
            snapshotIndex: function () {
                if (!this.crAnalysis || !this.crAnalysis.times || this.crAnalysis.times.length === 0) {
                    return -1;
                }
                return this.findNearestSnapshotIndex(this.crAnalysis.times, this.time);
            },
        },
        methods: {
            normalizeSearchValue: function (value) {
                return String(value || "").toLowerCase();
            },
            findNearestSnapshotIndex: function (times, time) {
                let low = 0;
                let high = times.length - 1;
                while (low < high) {
                    const mid = Math.floor((low + high) / 2);
                    if (times[mid] < time) {
                        low = mid + 1;
                    } else {
                        high = mid;
                    }
                }
                if (low === 0) {
                    return 0;
                }
                return Math.abs(times[low] - time) < Math.abs(times[low - 1] - time) ? low : low - 1;
            },
            getPlayerByUniqueId: function (uniqueId) {
                return logData.players.find(player => String(player.uniqueID) === String(uniqueId)) || null;
            },
            getTargetByUniqueId: function (uniqueId) {
                return logData.targets.find(target => String(target.uniqueID) === String(uniqueId)) || null;
            },
            getActorByUniqueId: function (uniqueId) {
                return this.getPlayerByUniqueId(uniqueId) || this.getTargetByUniqueId(uniqueId);
            },
            getSeriesValue: function (series, index) {
                if (!series || index < 0 || index >= series.length) {
                    return 0;
                }
                return series[index];
            },
            getSeriesArrayValue: function (series, index) {
                if (!series || index < 0 || index >= series.length || !series[index]) {
                    return [];
                }
                return series[index];
            },
            formatCount: function (value) {
                return Number(value || 0).toLocaleString();
            },
            formatStripCount: function (strips, corrupts) {
                return this.formatCount(strips) + " (" + this.formatCount(corrupts) + ")";
            },
            formatPercent: function (value) {
                return (Number(value || 0)).toFixed(1) + "%";
            },
            formatTime: function (time) {
                return (Number(time || 0) / 1000.0).toFixed(3) + "s";
            },
            formatDurationSeconds: function (time) {
                return (Number(time || 0) / 1000.0).toFixed(1) + "s";
            },
            jumpToBurst: function (time) {
                if (!animator) {
                    return;
                }
                animator.stopAnimate(true);
                animator.updateTime(time);
                animator.updateTextInput();
            },
            selectReplayActor: function (uniqueId) {
                if (!animator || uniqueId == null) {
                    return;
                }
                if (this.$root && this.$root.mode === 2 && animator.focusActorAtScale) {
                    animator.focusActorAtScale(uniqueId, 179.7);
                    return;
                }
                animator.selectActor(uniqueId);
            },
            isPlayerActor: function (actor) {
                return !!(actor && logData.players.some(player => player.uniqueID === actor.uniqueID));
            },
            getTeamAnalysis: function (teamKey) {
                if (!this.crAnalysis) {
                    return null;
                }
                return teamKey === "enemy" ? this.crAnalysis.enemy : this.crAnalysis.squad;
            },
            getThreatAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.threatBoons ? this.crAnalysis.threatBoons : null;
            },
            getPositioningAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.positioning ? this.crAnalysis.positioning : null;
            },
            getEnemyAnchorAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.enemyAnchor ? this.crAnalysis.enemyAnchor : null;
            },
            getEventAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.events ? this.crAnalysis.events : null;
            },
            getDefenseAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.defense ? this.crAnalysis.defense : null;
            },
            getIncomingConditionAnalysis: function () {
                return this.crAnalysis && this.crAnalysis.incomingConditions ? this.crAnalysis.incomingConditions : null;
            },
            formatAmount: function (value) {
                return Number(value || 0).toLocaleString(undefined, {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 1,
                });
            },
            formatDamageShare: function (amount, total) {
                const denominator = Number(total || 0);
                if (denominator <= 0) {
                    return this.formatPercent(0);
                }
                return this.formatPercent((Number(amount || 0) * 100.0) / denominator);
            },
            getSummaryToggleGroupStyle: function () {
                return {
                    display: "inline-flex",
                    alignItems: "center",
                    gap: "0.25rem",
                    padding: "0.2rem",
                    borderRadius: "999px",
                    background: "rgba(255, 255, 255, 0.06)",
                    border: "1px solid rgba(255, 255, 255, 0.14)",
                    boxShadow: "0 10px 24px rgba(0, 0, 0, 0.18)",
                };
            },
            getSummaryToggleButtonStyle: function (isActive) {
                return {
                    minWidth: "5.75rem",
                    padding: "0.28rem 0.72rem",
                    borderRadius: "999px",
                    border: isActive ? "1px solid rgba(118, 182, 128, 0.95)" : "1px solid rgba(255, 255, 255, 0.08)",
                    background: isActive ? "linear-gradient(135deg, rgba(90, 146, 98, 0.94), rgba(114, 168, 118, 0.9))" : "rgba(255, 255, 255, 0.03)",
                    color: isActive ? "#08100a" : "#d9e4f2",
                    fontWeight: isActive ? "700" : "600",
                    fontSize: "0.82rem",
                    letterSpacing: "0.01em",
                    boxShadow: isActive ? "0 8px 18px rgba(84, 130, 92, 0.24)" : "none",
                };
            },
        }
    };

    Vue.component("combat-replay-overview-stats-component", {
        props: ["time", "selectedactorid", "targetless"],
        template: `
        <div class="d-flex flex-column">
            <combat-replay-players-stats-component :time="time" :selectedplayerid="selectedactorid" :analysis="true"></combat-replay-players-stats-component>
            <combat-replay-targets-stats-component v-if="!targetless" :time="time" :selectedtargetid="selectedactorid" :analysis="true"></combat-replay-targets-stats-component>
        </div>
        `,
    });

    Vue.component("combat-replay-enemy-anchor-overview-component", {
        mixins: [combatReplayWvWAnalysisMixin],
        props: ["time"],
        template: `
        <div v-if="hasAnchor" class="combat-replay-wvw-analysis-card combat-replay-enemy-anchor-overview mb-2">
            <div class="combat-replay-enemy-anchor-header">
                <div class="combat-replay-wvw-analysis-card-title">Enemy Anchor</div>
                <span class="combat-replay-wvw-analysis-pill" :class="candidatePillClass">{{enemyAnchor.confidenceLabel || "Low"}}</span>
            </div>
            <div class="combat-replay-wvw-analysis-grid">
                <button v-if="enemyAnchor.topCandidateId" type="button" class="combat-replay-wvw-analysis-metric combat-replay-wvw-analysis-metric-button" title="Select inferred anchor candidate" @click="selectReplayActor(enemyAnchor.topCandidateId)">
                    <div class="combat-replay-wvw-analysis-label">Likely Anchor</div>
                    <div class="combat-replay-wvw-analysis-value">{{topCandidateLabel}}</div>
                    <div class="combat-replay-wvw-analysis-detail">{{topCandidateDetail}}</div>
                </button>
                <div v-else class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Likely Anchor</div>
                    <div class="combat-replay-wvw-analysis-value">No standout candidate</div>
                    <div class="combat-replay-wvw-analysis-detail">Anchor path was detected, but no tracked player dominated it.</div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Current Core</div>
                    <div class="combat-replay-wvw-analysis-value">{{currentCoreCount}} / {{currentActiveCount}}</div>
                    <div class="combat-replay-wvw-analysis-detail">{{currentAnchorDetail}}</div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Anchor Radius</div>
                    <div class="combat-replay-wvw-analysis-value">{{formatAmount(enemyAnchor.averageRadius)}} units</div>
                    <div class="combat-replay-wvw-analysis-detail">{{formatPercent(enemyAnchor.stabilityRate)}} stable core snapshots.</div>
                </div>
                <div class="combat-replay-wvw-analysis-metric">
                    <div class="combat-replay-wvw-analysis-label">Coverage</div>
                    <div class="combat-replay-wvw-analysis-value">{{formatCount(enemyAnchor.anchorSamples)}} / {{formatCount(enemyAnchor.evaluatedSamples)}}</div>
                    <div class="combat-replay-wvw-analysis-detail">Snapshots with enough grouped enemy positions.</div>
                </div>
            </div>
            <div v-if="enemyAnchor.summary" class="combat-replay-wvw-analysis-detail combat-replay-enemy-anchor-summary">{{enemyAnchor.summary}}</div>
            <div v-if="enemyAnchor.detail" class="combat-replay-wvw-analysis-detail">{{enemyAnchor.detail}}</div>
            <div class="combat-replay-enemy-anchor-actions">
                <button v-if="hasOverlay" type="button" class="btn btn-sm" :class="overlayEnabled ? 'btn-primary' : 'btn-secondary'" @click="toggleEnemyAnchorOverlay">{{overlayEnabled ? "Hide Paths" : "Show Paths"}}</button>
            </div>
        </div>
        `,
        data: function () {
            return {
                overlayEnabled: false,
            };
        },
        computed: {
            enemyAnchor: function () {
                return this.getEnemyAnchorAnalysis();
            },
            hasAnchor: function () {
                return !!(this.enemyAnchor && this.enemyAnchor.available);
            },
            hasOverlay: function () {
                return !!(animator && animator.hasEnemyPositionOverlay && animator.hasEnemyPositionOverlay());
            },
            candidatePillClass: function () {
                const label = this.enemyAnchor && this.enemyAnchor.confidenceLabel ? this.enemyAnchor.confidenceLabel.toLowerCase() : "";
                if (label === "clear") {
                    return "combat-replay-wvw-analysis-pill-success";
                }
                if (label === "medium") {
                    return "combat-replay-wvw-analysis-pill-normal";
                }
                return "combat-replay-wvw-analysis-pill-muted";
            },
            topCandidate: function () {
                if (!this.enemyAnchor || !this.enemyAnchor.candidates || this.enemyAnchor.candidates.length === 0) {
                    return null;
                }
                return this.enemyAnchor.candidates.find(candidate => String(candidate.id) === String(this.enemyAnchor.topCandidateId)) || this.enemyAnchor.candidates[0];
            },
            topCandidateLabel: function () {
                if (!this.enemyAnchor) {
                    return "";
                }
                return this.enemyAnchor.topCandidateName || this.getActorLabel(this.enemyAnchor.topCandidateId);
            },
            topCandidateDetail: function () {
                if (!this.topCandidate) {
                    return "";
                }
                return "Core " + this.formatPercent(this.topCandidate.coreRate) +
                    ", nearest " + this.formatPercent(this.topCandidate.nearestRate) +
                    ", avg distance " + this.formatAmount(this.topCandidate.averageDistance);
            },
            currentHasAnchor: function () {
                return !!(this.enemyAnchor &&
                    this.snapshotIndex >= 0 &&
                    this.enemyAnchor.hasAnchor &&
                    this.enemyAnchor.hasAnchor[this.snapshotIndex]);
            },
            currentActiveCount: function () {
                return this.currentHasAnchor ? Number(this.enemyAnchor.activeEnemyCount[this.snapshotIndex] || 0) : 0;
            },
            currentCoreCount: function () {
                return this.currentHasAnchor ? Number(this.enemyAnchor.coreEnemyCount[this.snapshotIndex] || 0) : 0;
            },
            currentAnchorDetail: function () {
                if (!this.currentHasAnchor) {
                    return "No anchor sample at the current replay time.";
                }
                const radius = Number(this.enemyAnchor.radius[this.snapshotIndex] || 0);
                return "Radius " + this.formatAmount(radius) + " around the inferred enemy group center.";
            },
        },
        mounted: function () {
            this.overlayEnabled = !!(animator && animator.displaySettings && animator.displaySettings.displayEnemyPositionOverlay);
            this._enemyPositionOverlayChangedHandler = (event) => {
                this.overlayEnabled = !!(event && event.detail && event.detail.enabled);
            };
            window.addEventListener("combatReplayEnemyPositionOverlayChanged", this._enemyPositionOverlayChangedHandler);
        },
        beforeDestroy: function () {
            if (this._enemyPositionOverlayChangedHandler) {
                window.removeEventListener("combatReplayEnemyPositionOverlayChanged", this._enemyPositionOverlayChangedHandler);
            }
        },
        methods: {
            getActorLabel: function (uniqueId) {
                if (!uniqueId) {
                    return "";
                }
                const actor = this.getActorByUniqueId(uniqueId);
                if (actor && actor.name) {
                    return actor.name;
                }
                return "Actor " + uniqueId;
            },
            toggleEnemyAnchorOverlay: function () {
                if (!animator || !animator.toggleEnemyPositionOverlay) {
                    return;
                }
                this.overlayEnabled = animator.toggleEnemyPositionOverlay();
            },
        },
    });

    Vue.component("combat-replay-fight-diagnosis-component", {
        mixins: [combatReplayWvWAnalysisMixin],
        props: ["time", "selectedactorid"],
        template: `
        <div class="combat-replay-wvw-analysis-card combat-replay-fight-diagnosis">
            <div class="combat-replay-wvw-analysis-card-title">Fight Diagnosis</div>
            <div v-if="!diagnosis || !diagnosis.available" class="combat-replay-wvw-analysis-detail">
                No fight diagnosis was generated for this replay.
            </div>
            <div v-else-if="!revealed" class="combat-replay-fight-diagnosis-reveal">
                <div class="combat-replay-fight-diagnosis-reveal-copy">
                    <div class="combat-replay-fight-diagnosis-kicker">
                        <span class="combat-replay-wvw-analysis-label">Replay diagnosis</span>
                        <span class="combat-replay-wvw-analysis-pill" :class="diagnosisPillClass">{{diagnosis.confidenceLabel}}</span>
                    </div>
                    <div class="combat-replay-fight-diagnosis-title">{{diagnosis.title}}</div>
                    <div v-if="diagnosis.summary" class="combat-replay-wvw-analysis-detail">{{diagnosis.summary}}</div>
                </div>
                <button type="button" class="btn btn-sm btn-primary combat-replay-fight-diagnosis-button" @click="revealed = true">Explain fight</button>
            </div>
            <div v-else class="combat-replay-fight-diagnosis-body">
                <div class="combat-replay-fight-diagnosis-summary">
                    <div class="combat-replay-fight-diagnosis-summary-header">
                        <div class="combat-replay-fight-diagnosis-summary-copy">
                            <div class="combat-replay-wvw-analysis-label">Diagnosis</div>
                            <div class="combat-replay-fight-diagnosis-title">{{diagnosis.title}}</div>
                        </div>
                        <div class="combat-replay-fight-diagnosis-pill-row">
                            <span class="combat-replay-wvw-analysis-pill" :class="diagnosisPillClass">{{diagnosis.confidenceLabel}}</span>
                            <span v-if="diagnosisTypeLabel" class="combat-replay-wvw-analysis-pill combat-replay-wvw-analysis-pill-muted">{{diagnosisTypeLabel}}</span>
                        </div>
                    </div>
                    <div v-if="diagnosis.summary" class="combat-replay-fight-diagnosis-lead">{{diagnosis.summary}}</div>
                    <div v-if="diagnosis.detail" class="combat-replay-wvw-analysis-detail">{{diagnosis.detail}}</div>
                </div>
                <div v-if="windows.length > 0" class="combat-replay-wvw-analysis-bursts combat-replay-fight-diagnosis-anchors">
                    <div class="combat-replay-wvw-analysis-card-title">Replay Anchors</div>
                    <button v-for="window in windows" :key="window.key + '-' + window.time" type="button" class="combat-replay-wvw-analysis-burst-entry combat-replay-fight-diagnosis-anchor" :class="getToneBlockClass(window.tone)" :title="'Jump to ' + windowRangeLabel(window)" @click="jumpToBurst(window.time)">
                        <span class="combat-replay-fight-diagnosis-anchor-time">{{windowRangeLabel(window)}}</span>
                        <span class="combat-replay-fight-diagnosis-anchor-copy">
                            <span class="combat-replay-fight-diagnosis-anchor-label">{{window.label}}</span>
                            <span class="combat-replay-fight-diagnosis-anchor-detail">{{window.summary}}</span>
                            <span v-if="window.detail && window.detail !== window.summary" class="combat-replay-fight-diagnosis-anchor-detail combat-replay-fight-diagnosis-anchor-extra">{{window.detail}}</span>
                        </span>
                    </button>
                </div>
                <div v-if="evidence.length > 0" class="combat-replay-wvw-analysis-grid combat-replay-fight-diagnosis-evidence-grid">
                    <component v-for="entry in evidence" :key="entry.label + '-' + entry.timeLabel" :is="entry.time == null ? 'div' : 'button'" :type="entry.time == null ? null : 'button'" class="combat-replay-wvw-analysis-metric combat-replay-fight-diagnosis-evidence" :class="[getToneBlockClass(entry.tone), {'combat-replay-wvw-analysis-metric-button combat-replay-fight-diagnosis-evidence-action': entry.time != null}]" :title="entry.time == null ? 'Context only' : 'Jump to ' + entry.timeLabel" @click="jumpToEvidence(entry)">
                        <div class="combat-replay-wvw-analysis-label">{{entry.label}}</div>
                        <div class="combat-replay-wvw-analysis-value">
                            {{entry.value}}
                            <span v-if="entry.timeLabel" class="combat-replay-wvw-analysis-pill" :class="getTonePillClass(entry.tone)">{{entry.timeLabel}}</span>
                        </div>
                        <div class="combat-replay-wvw-analysis-detail">{{entry.detail}}</div>
                    </component>
                </div>
                <div v-if="diagnosis.caveats && diagnosis.caveats.length > 0" class="combat-replay-fight-diagnosis-notes">
                    <div class="combat-replay-wvw-analysis-label">Reading Notes</div>
                    <ul class="combat-replay-fight-diagnosis-note-list">
                        <li v-for="caveat in diagnosis.caveats" :key="caveat">{{caveat}}</li>
                    </ul>
                </div>
            </div>
        </div>
        `,
        data: function () {
            return {
                revealed: false,
            };
        },
        computed: {
            diagnosis: function () {
                return this.crAnalysis && this.crAnalysis.diagnosis ? this.crAnalysis.diagnosis : null;
            },
            windows: function () {
                return this.diagnosis && this.diagnosis.windows ? this.diagnosis.windows : [];
            },
            evidence: function () {
                return this.diagnosis && this.diagnosis.evidence ? this.diagnosis.evidence : [];
            },
            diagnosisTypeLabel: function () {
                if (!this.diagnosis || !this.diagnosis.type) {
                    return "";
                }
                return this.diagnosis.type.split("-").map(function (part) {
                    return part.length > 0 ? part.charAt(0).toUpperCase() + part.slice(1) : part;
                }).join(" ");
            },
            diagnosisPillClass: function () {
                const label = this.diagnosis && this.diagnosis.confidenceLabel ? this.diagnosis.confidenceLabel.toLowerCase() : "";
                if (label === "clear") {
                    return "combat-replay-wvw-analysis-pill-success";
                }
                if (label === "medium") {
                    return "combat-replay-wvw-analysis-pill-normal";
                }
                return "combat-replay-wvw-analysis-pill-muted";
            },
        },
        methods: {
            getTonePillClass: function (tone) {
                if (tone === "danger" || tone === "warning") {
                    return "combat-replay-wvw-analysis-pill-weak";
                }
                if (tone === "success") {
                    return "combat-replay-wvw-analysis-pill-success";
                }
                return "combat-replay-wvw-analysis-pill-muted";
            },
            getToneBlockClass: function (tone) {
                if (tone === "danger" || tone === "warning") {
                    return "combat-replay-fight-diagnosis-tone-danger";
                }
                if (tone === "success") {
                    return "combat-replay-fight-diagnosis-tone-success";
                }
                return "combat-replay-fight-diagnosis-tone-normal";
            },
            windowRangeLabel: function (window) {
                if (!window) {
                    return "";
                }
                if (window.endTimeLabel && window.endTimeLabel !== window.timeLabel) {
                    return window.timeLabel + " - " + window.endTimeLabel;
                }
                return window.timeLabel || "";
            },
            jumpToEvidence: function (entry) {
                if (!entry || entry.time == null) {
                    return;
                }
                this.jumpToBurst(entry.time);
            },
        },
    });

    Vue.component("combat-replay-outcome-drivers-component", {
        mixins: [combatReplayWvWAnalysisMixin],
        props: ["time"],
        template: `
        <div class="combat-replay-wvw-analysis-panel combat-replay-outcome-drivers">
            <div class="combat-replay-wvw-analysis-card" style="position: relative;">
                <button type="button" class="combat-replay-overview-help-button" title="Outcome Drivers help" aria-label="Show Outcome Drivers help" @click="showHelp = true">?</button>
                <div class="combat-replay-wvw-analysis-card-title">Fight Outcome Drivers</div>
                <div class="combat-replay-wvw-analysis-detail text-center mb-2">
                    Descriptive evidence from the windows around this fight's outcomes. Rankings show repeated timing and lift inside this log; they do not claim universal causation.
                </div>
                <ul class="nav nav-pills d-flex flex-row justify-content-center mb-2 scale85 combat-replay-outcome-driver-tabs">
                    <li v-for="option in outcomeOptions" :key="option.key" class="nav-item">
                        <a class="nav-link" :class="{active: outcomeKey === option.key}" @click="outcomeKey = option.key">
                            {{option.label}} <span class="combat-replay-outcome-driver-tab-count">{{option.count}}</span>
                        </a>
                    </li>
                </ul>
                <div class="combat-replay-wvw-analysis-grid">
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Outcome</div>
                        <div class="combat-replay-wvw-analysis-value">{{activeAnalysis.label}}</div>
                        <div class="combat-replay-wvw-analysis-detail">{{activeAnalysis.description}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Recorded Outcomes</div>
                        <div class="combat-replay-wvw-analysis-value">{{formatCount(activeAnalysis.outcomeCount)}}</div>
                        <div class="combat-replay-wvw-analysis-detail">{{activeAnalysis.comparisonLabel}}</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Evidence Confidence</div>
                        <div class="combat-replay-wvw-analysis-value">
                            <span class="combat-replay-wvw-analysis-pill" :class="confidencePillClass(activeAnalysis.confidenceLabel)">{{activeAnalysis.confidenceLabel}}</span>
                        </div>
                        <div class="combat-replay-wvw-analysis-detail">Based on event count, comparison coverage, and observability.</div>
                    </div>
                    <div class="combat-replay-wvw-analysis-metric">
                        <div class="combat-replay-wvw-analysis-label">Strongest Signal</div>
                        <div class="combat-replay-wvw-analysis-value">{{topDriver ? topDriver.label : "Insufficient evidence"}}</div>
                        <div class="combat-replay-wvw-analysis-detail">{{topDriver ? topDriver.effectLabel : "No repeatable signal could be ranked."}}</div>
                    </div>
                </div>
            </div>

            <div v-if="activeAnalysis.eventCount === 0" class="combat-replay-wvw-analysis-card">
                <div class="combat-replay-wvw-analysis-card-title">No Outcomes Available</div>
                <div class="combat-replay-wvw-analysis-helper">This fight does not contain an event of the selected outcome type.</div>
            </div>

            <div v-else class="combat-replay-outcome-driver-layout">
                <div class="combat-replay-wvw-analysis-card">
                    <div class="combat-replay-wvw-analysis-card-title">Ranked Evidence</div>
                    <div class="combat-replay-wvw-analysis-detail mb-2">
                        {{activeAnalysis.rankingDescription}}
                        Select a row to inspect the strongest supporting moments.
                    </div>
                    <div v-if="activeAnalysis.drivers.length === 0" class="combat-replay-wvw-analysis-helper">
                        No observable driver had enough data to rank.
                    </div>
                    <div v-else class="combat-replay-outcome-driver-list">
                        <button v-for="(driver, index) in activeAnalysis.drivers"
                                :key="driver.key"
                                type="button"
                                class="combat-replay-outcome-driver-row"
                                :class="{active: selectedDriver && selectedDriver.key === driver.key}"
                                @click="selectedDriverKey = driver.key">
                            <span class="combat-replay-outcome-driver-rank">{{index + 1}}</span>
                            <span class="combat-replay-outcome-driver-copy">
                                <span class="combat-replay-outcome-driver-heading">
                                    <span>{{driver.label}}</span>
                                    <span class="combat-replay-outcome-driver-score">{{driver.score}}</span>
                                </span>
                                <span class="combat-replay-outcome-driver-pills">
                                    <span class="combat-replay-wvw-analysis-pill" :class="observabilityPillClass(driver.observability)">{{driver.observability}}</span>
                                    <span class="combat-replay-wvw-analysis-pill" :class="confidencePillClass(driver.confidenceLabel)">{{driver.confidenceLabel}}</span>
                                </span>
                                <span class="combat-replay-outcome-driver-bar"><span :style="{width: driver.score + '%'}"></span></span>
                                <span class="combat-replay-outcome-driver-effect">{{driver.effectLabel}}</span>
                            </span>
                        </button>
                    </div>
                </div>

                <div class="combat-replay-wvw-analysis-card combat-replay-outcome-driver-evidence-card">
                    <template v-if="selectedDriver">
                        <div class="combat-replay-outcome-driver-selected-header">
                            <div>
                                <div class="combat-replay-wvw-analysis-label">{{selectedDriver.category}}</div>
                                <div class="combat-replay-wvw-analysis-card-title">{{selectedDriver.label}}</div>
                            </div>
                            <div class="combat-replay-outcome-driver-selected-score">{{selectedDriver.score}}</div>
                        </div>
                        <div class="combat-replay-wvw-analysis-detail">{{selectedDriver.detail}}</div>
                        <div class="combat-replay-outcome-driver-selected-effect">{{selectedDriver.effectLabel}}</div>
                        <div class="combat-replay-wvw-analysis-label mt-3 mb-1">Strongest Event Evidence</div>
                        <div v-if="selectedDriver.evidence.length > 0" class="combat-replay-wvw-analysis-bursts">
                            <button v-for="entry in selectedDriver.evidence"
                                    :key="selectedDriver.key + '-' + entry.time + '-' + entry.actorName"
                                    type="button"
                                    class="combat-replay-wvw-analysis-burst-entry combat-replay-outcome-driver-evidence"
                                    :title="'Jump replay to ' + entry.timeLabel"
                                    @click="jumpToBurst(entry.time)">
                                <span class="combat-replay-wvw-analysis-burst-time">{{entry.timeLabel}}</span>
                                <span class="combat-replay-outcome-driver-evidence-copy">
                                    <span class="combat-replay-outcome-driver-evidence-name">{{entry.actorName}}</span>
                                    <span class="combat-replay-outcome-driver-evidence-detail">{{entry.valueLabel}} &middot; {{entry.detail}}</span>
                                </span>
                            </button>
                        </div>
                        <div v-else class="combat-replay-wvw-analysis-helper">No individual event met this signal's evidence threshold.</div>
                    </template>
                </div>
            </div>

            <div v-if="activeAnalysis.effectAudits && activeAnalysis.effectAudits.length > 0"
                 class="combat-replay-wvw-analysis-card combat-replay-outcome-driver-audit-card">
                <div class="combat-replay-outcome-driver-audit-header">
                    <div>
                        <div class="combat-replay-wvw-analysis-card-title">All Conditions/CCs</div>
                        <div class="combat-replay-wvw-analysis-detail">
                            Every named effect evaluated for this outcome, including effects that did not qualify for the ranked list.
                        </div>
                    </div>
                    <button type="button"
                            class="combat-replay-outcome-driver-audit-toggle"
                            :aria-expanded="showEffectAudit ? 'true' : 'false'"
                            @click="showEffectAudit = !showEffectAudit">
                        {{showEffectAudit ? "Hide all effects" : "Show all " + formatCount(activeAnalysis.effectAudits.length)}}
                    </button>
                </div>
                <div v-if="showEffectAudit" class="combat-replay-outcome-driver-audit-scroll">
                    <table class="combat-replay-outcome-driver-audit-table">
                        <thead>
                            <tr>
                                <th>Effect</th>
                                <th>Type</th>
                                <th>Outcome avg</th>
                                <th>Baseline avg</th>
                                <th>Lift</th>
                                <th>Coverage</th>
                                <th>Confidence</th>
                                <th>Ranking result</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="entry in activeAnalysis.effectAudits" :key="entry.key">
                                <td class="combat-replay-outcome-driver-audit-effect">{{entry.label}}</td>
                                <td>{{entry.type}}</td>
                                <td>{{formatEffectAverage(entry.eventMean)}}</td>
                                <td>{{formatEffectAverage(entry.controlMean)}}</td>
                                <td>{{entry.liftLabel}}</td>
                                <td>{{entry.coverageLabel}}</td>
                                <td>
                                    <span class="combat-replay-wvw-analysis-pill" :class="confidencePillClass(entry.confidenceLabel)">
                                        {{entry.confidenceLabel}}
                                    </span>
                                </td>
                                <td>
                                    <span class="combat-replay-wvw-analysis-pill" :class="effectAuditStatusClass(entry.status)">
                                        {{entry.status}}
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="combat-replay-wvw-analysis-card">
                <div class="combat-replay-wvw-analysis-card-title">Important Data Limits</div>
                <div class="combat-replay-outcome-driver-limit-grid">
                    <div v-for="limit in activeAnalysis.caveats" :key="limit.title" class="combat-replay-outcome-driver-limit">
                        <span class="combat-replay-wvw-analysis-pill" :class="observabilityPillClass(limit.observability)">{{limit.observability}}</span>
                        <span>
                            <strong>{{limit.title}}</strong>
                            <span>{{limit.detail}}</span>
                        </span>
                    </div>
                </div>
            </div>

            <div v-if="showHelp" class="wvw-summary-modal-backdrop" @click.self="showHelp = false">
                <div class="wvw-summary-modal combat-replay-overview-help-modal" role="dialog" aria-modal="true" aria-label="Outcome Drivers help">
                    <button type="button" class="wvw-summary-modal-close" aria-label="Close Outcome Drivers help" @click="showHelp = false">&times;</button>
                    <div class="wvw-summary-modal-title">Outcome Drivers Help</div>
                    <div class="wvw-summary-modal-subtitle">How the report ranks evidence without pretending incomplete combat data is exact.</div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Evidence score</div>
                        <ul class="combat-replay-overview-help-list">
                            <li>Down-creation signals group cascading downs into independent engagement windows, then compare their final three seconds with ordinary pressure from the same fight</li>
                            <li>The score combines percentile lift with how consistently the signal was elevated</li>
                            <li>Kill conversion compares enemy deaths with enemy downs that recovered; squad recovery compares successful recoveries with squad downs that ended in death</li>
                            <li>If a fight has no failed comparison outcomes, those modes fall back to direct coverage and say so explicitly</li>
                            <li>The All Conditions/CCs table shows every evaluated named effect and explains whether it ranked, missed the top-five cutoff, stayed at or below baseline, or lacked outcome evidence</li>
                            <li>A high score describes this fight only; it is not proof that the signal caused the outcome</li>
                        </ul>
                    </div>
                    <div class="combat-replay-overview-help-section">
                        <div class="combat-replay-overview-help-heading">Observability</div>
                        <ul class="combat-replay-overview-help-list">
                            <li><strong>Observed</strong> uses directly recorded events or replay positions</li>
                            <li><strong>Supporting</strong> combines observed signals into a plausible timing relationship</li>
                            <li><strong>Unavailable</strong> is shown as a limit and never treated as zero</li>
                            <li>Enemy condition entries describe applications or recorded damage, not exact current stacks or remaining duration</li>
                            <li>Vulnerability bonus damage is a supporting estimate reconstructed from recorded damage and source-attributed Vulnerability stacks</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        `,
        data: function () {
            return {
                outcomeKey: "enemy-downs",
                selectedDriverKey: null,
                showHelp: false,
                showEffectAudit: false,
            };
        },
        computed: {
            eventAnalysis: function () {
                return this.getEventAnalysis() || {};
            },
            outcomeOptions: function () {
                const downs = this.eventAnalysis.downs && this.eventAnalysis.downs.events ? this.eventAnalysis.downs.events : [];
                const kills = this.eventAnalysis.kills && this.eventAnalysis.kills.events ? this.eventAnalysis.kills.events : [];
                const recovered = this.eventAnalysis.recovered && this.eventAnalysis.recovered.events ? this.eventAnalysis.recovered.events : [];
                return [
                    { key: "enemy-downs", label: "Enemy Downs", count: downs.filter(event => event && event.isEnemy).length },
                    { key: "squad-downs", label: "Squad Downs", count: downs.filter(event => event && !event.isEnemy).length },
                    { key: "kill-conversion", label: "Kill Conversion", count: kills.filter(event => event && event.isEnemy).length },
                    { key: "squad-recovery", label: "Squad Recovery", count: recovered.filter(event => event && !event.isEnemy && event.usesSupportView).length },
                ];
            },
            activeAnalysis: function () {
                if (this.outcomeKey === "kill-conversion") {
                    return this.buildKillConversionAnalysis();
                }
                if (this.outcomeKey === "squad-recovery") {
                    return this.buildSquadRecoveryAnalysis();
                }
                return this.buildDownAnalysis(this.outcomeKey === "enemy-downs");
            },
            selectedDriver: function () {
                const drivers = this.activeAnalysis.drivers || [];
                return drivers.find(driver => driver.key === this.selectedDriverKey) || drivers[0] || null;
            },
            topDriver: function () {
                return this.activeAnalysis.drivers && this.activeAnalysis.drivers.length > 0
                    ? this.activeAnalysis.drivers[0]
                    : null;
            },
        },
        watch: {
            outcomeKey: function () {
                this.selectedDriverKey = null;
                this.showEffectAudit = false;
            },
        },
        methods: {
            buildDownAnalysis: function (againstEnemy) {
                const allEvents = this.eventAnalysis.downs && this.eventAnalysis.downs.events
                    ? this.eventAnalysis.downs.events
                    : [];
                const rawEvents = allEvents.filter(event => event && Boolean(event.isEnemy) === againstEnemy);
                const events = this.clusterOutcomeEvents(rawEvents);
                const team = this.getTeamAnalysis(againstEnemy ? "squad" : "enemy") || {};
                const conditionAnalysis = againstEnemy
                    ? this.crAnalysis && this.crAnalysis.squadConditions
                    : this.crAnalysis && this.crAnalysis.incomingConditions;
                const crowdControlAnalysis = againstEnemy
                    ? this.crAnalysis && this.crAnalysis.squadCrowdControl
                    : this.crAnalysis && this.crAnalysis.enemyCrowdControl;
                const times = this.crAnalysis && this.crAnalysis.times ? this.crAnalysis.times : [];
                const eventIndices = events.map(event => this.getTimelineIndex(times, event.time));
                const controlIndices = this.buildControlIndices(times, team.damage || [], events.map(event => Number(event.time || 0)));
                const conditionSeries = this.buildRollingBucketSeries(
                    times,
                    conditionAnalysis && conditionAnalysis.conditionTimeline ? conditionAnalysis.conditionTimeline : [],
                    "applyCount");
                const vulnerabilityBonusSeries = this.buildRollingBucketSeries(
                    times,
                    conditionAnalysis && conditionAnalysis.conditionTimeline ? conditionAnalysis.conditionTimeline : [],
                    "vulnerabilityBonusDamage");
                const crowdControlSeries = this.buildRollingBucketSeries(
                    times,
                    crowdControlAnalysis && crowdControlAnalysis.timeline ? crowdControlAnalysis.timeline : [],
                    "effectiveCount");
                const specificConditionAnalysis = this.buildSpecificTimelineDrivers({
                    times: times,
                    timeline: conditionAnalysis && conditionAnalysis.conditionTimeline ? conditionAnalysis.conditionTimeline : [],
                    entriesKey: "applications",
                    idKey: "buffId",
                    nameKey: "name",
                    valueKey: "applyCount",
                    category: "Specific Condition",
                    auditType: "Condition",
                    keyPrefix: "specific-condition",
                    valueLabel: "condition applications",
                    singularValueLabel: "condition application",
                    events: events,
                    eventIndices: eventIndices,
                    controlIndices: controlIndices,
                    detail: "Attributed applications of this condition in the final three seconds. This does not reconstruct exact active stacks, cleanses, or remaining duration.",
                });
                const specificCrowdControlAnalysis = this.buildSpecificTimelineDrivers({
                    times: times,
                    timeline: crowdControlAnalysis && crowdControlAnalysis.timeline ? crowdControlAnalysis.timeline : [],
                    entriesKey: "effects",
                    idKey: "skillId",
                    nameKey: "name",
                    valueKey: "effectiveCount",
                    category: "Specific CC",
                    auditType: "CC",
                    keyPrefix: "specific-cc",
                    valueLabel: "effective events",
                    singularValueLabel: "effective event",
                    events: events,
                    eventIndices: eventIndices,
                    controlIndices: controlIndices,
                    detail: "Directly recorded effective hard-control events in the final three seconds. Exact Stability state is not inferred.",
                });
                const vulnerabilityImpactDriver = this.buildSeriesDriver({
                    key: "vulnerability-impact",
                    label: "Vulnerability bonus damage",
                    category: "Condition Impact",
                    series: vulnerabilityBonusSeries,
                    eventIndices: eventIndices,
                    controlIndices: controlIndices,
                    events: events,
                    format: "count",
                    valueLabel: "estimated bonus damage",
                    observability: "Supporting",
                    detail: "Estimated recorded damage enabled by source-attributed Vulnerability stacks in the final three seconds. This reverses the Vulnerability modifier from observed damage and does not claim perfect enemy-state visibility.",
                });
                const vulnerabilityImpactAudit = this.buildEffectAuditEntry({
                    key: "vulnerability-impact",
                    label: "Vulnerability bonus damage",
                    type: "Condition impact",
                    series: vulnerabilityBonusSeries,
                    eventIndices: eventIndices,
                    controlIndices: controlIndices,
                    observability: "Supporting",
                    driver: vulnerabilityImpactDriver,
                    eligibleStatus: "Ranked",
                });
                const stripSeries = times.map((_, index) =>
                    Number(team.strips && team.strips[index] || 0) + Number(team.corrupts && team.corrupts[index] || 0));
                const damageSeries = (team.damage || []).map(value => Number(value || 0));
                const focusSeries = (team.topTargetShare || []).map(value => Number(value || 0));
                const contributorSeries = (team.topTargetContributors || []).map(value => Number(value || 0));
                const stripSyncSeries = times.map((_, index) => team.stripSynced && team.stripSynced[index] ? 1 : 0);
                const damageThreshold = this.percentile(controlIndices.map(index => damageSeries[index]), 0.75);
                const ccBurstSeries = times.map((_, index) =>
                    crowdControlSeries[index] > 0 && damageSeries[index] >= damageThreshold ? 1 : 0);
                const positioning = this.getPositioningAnalysis() || {};
                const positioningAvailable = Number(positioning.summaryEvaluatedSamples || 0) > 0;
                const positioningSeries = times.map((_, index) => {
                    if (!positioning.eligiblePlayerCount || Number(positioning.eligiblePlayerCount[index] || 0) <= 0) {
                        return 0;
                    }
                    const inPosition = Number(positioning.inPositionRate && positioning.inPositionRate[index] || 0);
                    return againstEnemy ? inPosition : Math.max(0, 100.0 - inPosition);
                });
                const drivers = [
                    this.buildSeriesDriver({
                        key: "burst-damage",
                        label: "Three-second burst damage",
                        category: "Pressure",
                        series: damageSeries,
                        eventIndices: eventIndices,
                        controlIndices: controlIndices,
                        events: events,
                        format: "count",
                        observability: "Observed",
                        detail: "Damage against living targets in the final three seconds before each down.",
                    }),
                    this.buildSeriesDriver({
                        key: "strips",
                        label: "Boon removal pressure",
                        category: "Boon Removal",
                        series: stripSeries,
                        eventIndices: eventIndices,
                        controlIndices: controlIndices,
                        events: events,
                        format: "count",
                        observability: "Observed",
                        detail: "Recorded strips and corrupts in the final three-second pressure window. Exact enemy boon identity is not assumed.",
                    }),
                    this.buildSeriesDriver({
                        key: "condition-applications",
                        label: "Condition applications",
                        category: "Conditions",
                        series: conditionSeries,
                        eventIndices: eventIndices,
                        controlIndices: controlIndices,
                        events: events,
                        format: "count",
                        observability: "Observed",
                        detail: "Attributed condition applications in the final three seconds. This does not claim exact active stacks or remaining duration.",
                    }),
                    this.buildSeriesDriver({
                        key: "hard-cc",
                        label: "Effective hard CC",
                        category: "Control",
                        series: crowdControlSeries,
                        eventIndices: eventIndices,
                        controlIndices: controlIndices,
                        events: events,
                        format: "count",
                        observability: "Observed",
                        detail: "Recorded effective hard-control events in the final three seconds before the down.",
                    }),
                    vulnerabilityImpactDriver,
                    this.buildSeriesDriver({
                        key: "focus-fire",
                        label: "Target focus",
                        category: "Coordination",
                        series: focusSeries,
                        eventIndices: eventIndices,
                        controlIndices: controlIndices,
                        events: events,
                        format: "percent",
                        observability: "Observed",
                        detail: "Share of team damage concentrated on the leading target during the pressure window.",
                    }),
                    this.buildSeriesDriver({
                        key: "burst-participation",
                        label: "Burst participation",
                        category: "Coordination",
                        series: contributorSeries,
                        eventIndices: eventIndices,
                        controlIndices: controlIndices,
                        events: events,
                        format: "count",
                        observability: "Observed",
                        detail: "Number of players contributing damage to the leading target in the final three seconds.",
                    }),
                    positioningAvailable ? this.buildSeriesDriver({
                        key: againstEnemy ? "squad-positioning" : "positioning-risk",
                        label: againstEnemy ? "Squad positioning" : "Squad positioning risk",
                        category: "Positioning",
                        series: positioningSeries,
                        eventIndices: eventIndices,
                        controlIndices: controlIndices,
                        events: events,
                        format: "percent",
                        observability: "Observed",
                        detail: againstEnemy
                            ? "Share of eligible squad players classified in position near the commander before enemy downs."
                            : "Share of eligible squad players classified outside the desired commander-relative position before squad downs.",
                    }) : null,
                    this.buildSeriesDriver({
                        key: "strip-burst",
                        label: "Strip-to-burst alignment",
                        category: "Interaction",
                        series: stripSyncSeries,
                        eventIndices: eventIndices,
                        controlIndices: controlIndices,
                        events: events,
                        format: "binary",
                        observability: "Supporting",
                        detail: "Observed strip pressure aligned with an elevated burst window. The timing relationship is descriptive, not proof of causation.",
                    }),
                    this.buildSeriesDriver({
                        key: "cc-burst",
                        label: "CC into burst",
                        category: "Interaction",
                        series: ccBurstSeries,
                        eventIndices: eventIndices,
                        controlIndices: controlIndices,
                        events: events,
                        format: "binary",
                        observability: "Supporting",
                        detail: "Effective hard CC and upper-quartile burst damage appeared in the same final three-second window.",
                    }),
                    ...specificConditionAnalysis.drivers,
                    ...specificCrowdControlAnalysis.drivers,
                ].filter(driver => driver != null && driver.score > 0)
                    .sort((left, right) => right.score - left.score || left.label.localeCompare(right.label));

                return {
                    label: againstEnemy ? "Enemy Downs Created" : "Squad Downs Taken",
                    description: againstEnemy
                        ? "Signals immediately preceding enemy players entering downstate."
                        : "Enemy pressure and squad-state signals immediately preceding squad downstate.",
                    outcomeCount: rawEvents.length,
                    eventCount: events.length,
                    controlCount: controlIndices.length,
                    confidenceLabel: this.confidenceForSampleCount(events.length, controlIndices.length),
                    comparisonLabel: `${this.formatCount(events.length)} independent engagement windows \u00b7 ${this.formatCount(controlIndices.length)} matched pressure samples`,
                    rankingDescription: "Evidence score combines engagement-window lift and consistency against ordinary pressure in this fight.",
                    drivers: drivers,
                    effectAudits: [
                        vulnerabilityImpactAudit,
                        ...specificConditionAnalysis.audits,
                        ...specificCrowdControlAnalysis.audits,
                    ].filter(entry => entry != null)
                        .sort(this.compareEffectAudits),
                    caveats: this.buildDriverCaveats(againstEnemy),
                };
            },
            buildKillConversionAnalysis: function () {
                const events = this.eventAnalysis.kills && this.eventAnalysis.kills.events
                    ? this.eventAnalysis.kills.events.filter(event => event && event.isEnemy)
                    : [];
                const failures = this.eventAnalysis.recovered && this.eventAnalysis.recovered.events
                    ? this.eventAnalysis.recovered.events.filter(event => event && event.isEnemy && !event.usesSupportView)
                    : [];
                const drivers = [
                    this.buildContrastDriver({
                        key: "conversion-damage",
                        label: "Damage on downed targets",
                        category: "Conversion",
                        events: events,
                        controls: failures,
                        value: event => Number(event.totalDamageTaken || 0),
                        format: "count",
                        comparisonName: "recovered enemy downs",
                        detail: "Recorded health damage between enemy downstate and its kill or recovery outcome.",
                    }),
                    this.buildContrastDriver({
                        key: "finish-participation",
                        label: "Finish participation",
                        category: "Coordination",
                        events: events,
                        controls: failures,
                        value: event => Number(event.contributorCount || 0),
                        format: "count",
                        comparisonName: "recovered enemy downs",
                        detail: "Recorded damage contributors during successful and failed enemy-down conversions.",
                    }),
                    this.buildCoverageDriver({
                        key: "conversion-speed",
                        label: "Fast conversion",
                        category: "Timing",
                        events: events,
                        value: event => Math.max(0, Number(event.time || 0) - Number(event.windowStart || 0)) / 1000.0,
                        present: value => value > 0 && value <= 5.0,
                        format: "seconds",
                        lowerBetter: true,
                        observability: "Supporting",
                        scoreCap: 85,
                        detail: "Enemy downs converted within five seconds, limiting the recovery opportunity.",
                    }),
                    this.buildContrastDriver({
                        key: "conversion-condition-damage",
                        label: "Condition damage during conversion",
                        category: "Conditions",
                        events: events,
                        controls: failures,
                        value: event => Number(event.conditionDamageTaken || 0),
                        format: "count",
                        comparisonName: "recovered enemy downs",
                        detail: "Directly recorded condition-damage ticks after downstate; exact condition stacks are not inferred.",
                    }),
                    this.buildContrastDriver({
                        key: "conversion-barrier-pressure",
                        label: "Barrier pressure during conversion",
                        category: "Pressure",
                        events: events,
                        controls: failures,
                        value: event => Number(event.barrierDamageTaken || 0),
                        format: "count",
                        comparisonName: "recovered enemy downs",
                        detail: "Recorded damage absorbed by barrier while the enemy was downed.",
                    }),
                    this.buildSpecificConditionDriver(events),
                ].filter(driver => driver != null && driver.score > 0)
                    .sort((left, right) => right.score - left.score || left.label.localeCompare(right.label));
                return {
                    label: "Enemy Kill Conversion",
                    description: "Successful enemy-down conversions compared with enemy downs that recovered.",
                    outcomeCount: events.length,
                    eventCount: events.length,
                    controlCount: failures.length,
                    confidenceLabel: this.confidenceForSampleCount(events.length, failures.length),
                    comparisonLabel: failures.length > 0
                        ? `${this.formatCount(failures.length)} recovered enemy downs for comparison`
                        : "No recovered enemy downs available for comparison",
                    rankingDescription: failures.length > 0
                        ? "Evidence score compares successful kill conversions with enemy downs that recovered."
                        : "Only direct coverage can be ranked because this fight has no failed enemy-down conversions.",
                    drivers: drivers,
                    caveats: this.buildDriverCaveats(true),
                };
            },
            buildSquadRecoveryAnalysis: function () {
                const events = this.eventAnalysis.recovered && this.eventAnalysis.recovered.events
                    ? this.eventAnalysis.recovered.events.filter(event => event && !event.isEnemy && event.usesSupportView)
                    : [];
                const failures = this.eventAnalysis.kills && this.eventAnalysis.kills.events
                    ? this.eventAnalysis.kills.events.filter(event => event && !event.isEnemy)
                    : [];
                const drivers = [
                    this.buildContrastDriver({
                        key: "downed-healing",
                        label: "Downed healing",
                        category: "Recovery",
                        events: events,
                        controls: failures,
                        value: event => Number(event.totalDownedHealing || 0),
                        format: "count",
                        comparisonName: "squad deaths",
                        detail: "Directly recorded healing delivered during successful recoveries and failed recovery attempts.",
                    }),
                    this.buildContrastDriver({
                        key: "rez-casts",
                        label: "Resurrection casts",
                        category: "Recovery",
                        events: events,
                        controls: failures,
                        value: event => Number(event.rezCastCount || 0),
                        format: "count",
                        comparisonName: "squad deaths",

                    " (" + this.formatCount(bucket && bucket.extensionCount || 0) + " extensions)";
            },
            formatCrowdControlBucket: function (bucket) {
                return this.formatCount(bucket && bucket.eventCount || 0) +
                    " (" + this.formatCount(bucket && bucket.effectiveCount || 0) + " effective)";
            },
            buildConditionBarTrace: function (timeline, isSquadEvent, color) {
                const sideLabel = isSquadEvent ? "Squad" : "Enemy";
                const bucketsBySecond = new Map();
                (timeline || []).forEach(bucket => {
                    const second = Math.max(0, Math.floor(Number(bucket && bucket.time || 0) / 1000.0));
                    bucketsBySecond.set(second, bucket);
                });
                const fightEnd = this.crAnalysis && this.crAnalysis.times && this.crAnalysis.times.length > 0
                    ? Number(this.crAnalysis.times[this.crAnalysis.times.length - 1] || 0)
                    : 0;
                const bucketCount = Math.max(1, Math.ceil(fightEnd / 1000.0));
                const x = [];
                const y = [];
                const customdata = [];
                for (let second = 0; second < bucketCount; second++) {
                    const bucket = bucketsBySecond.get(second) || null;
                    const applyCount = Number(bucket && bucket.applyCount || 0);
                    x.push(second + 0.5);
                    y.push(applyCount > 0 ? applyCount : null);
                    customdata.push([
                        applyCount,
                        Number(bucket && bucket.extensionCount || 0),
                        bucket && bucket.topConditionName ? bucket.topConditionName : "None",
                        bucket && bucket.topSourceName ? bucket.topSourceName : "None",
                        second.toFixed(0) + ".0\u2013" + (second + 1).toFixed(0) + ".0s",
                    ]);
                }
                return {
                    type: "bar",
                    name: sideLabel + " Conditions Applied",
                    x: x,
                    y: y,
                    yaxis: "y2",
                    customdata: customdata,
                    marker: { color: color },
                    opacity: 0.38,
                    hovertemplate:
                        "<b>" + sideLabel + " conditions applied</b><br>" +
                        "%{customdata[4]}<br>" +
                        "%{customdata[0]} applications \u00b7 %{customdata[1]} extensions<br>" +
                        "Top condition: %{customdata[2]}<br>" +
                        "Top source: %{customdata[3]}" +
                        "<extra></extra>",
                };
            },
            buildCrowdControlBarTrace: function (timeline, isSquadEvent, color) {
                const sideLabel = isSquadEvent ? "Squad" : "Enemy";
                const bucketsBySecond = new Map();
                (timeline || []).forEach(bucket => {
                    const second = Math.max(0, Math.floor(Number(bucket && bucket.time || 0) / 1000.0));
                    bucketsBySecond.set(second, bucket);
                });
                const fightEnd = this.crAnalysis && this.crAnalysis.times && this.crAnalysis.times.length > 0
                    ? Number(this.crAnalysis.times[this.crAnalysis.times.length - 1] || 0)
                    : 0;
                const bucketCount = Math.max(1, Math.ceil(fightEnd / 1000.0));
                const x = [];
                const y = [];
                const customdata = [];
                for (let second = 0; second < bucketCount; second++) {
                    const bucket = bucketsBySecond.get(second) || null;
                    const eventCount = Number(bucket && bucket.eventCount || 0);
                    x.push(second + 0.5);
                    y.push(eventCount > 0 ? eventCount : null);
                    customdata.push([
                        eventCount,
                        Number(bucket && bucket.effectiveCount || 0),
                        Number(bucket && bucket.totalDuration || 0),
                        bucket && bucket.topSkillName ? bucket.topSkillName : "None",
                        bucket && bucket.topSourceName ? bucket.topSourceName : "None",
                        second.toFixed(0) + ".0\u2013" + (second + 1).toFixed(0) + ".0s",
                    ]);
                }
                return {
                    type: "bar",
                    name: sideLabel + " Hard CC",
                    x: x,
                    y: y,
                    yaxis: "y2",
                    customdata: customdata,
                    marker: { color: color },
                    opacity: 0.38,
                    hovertemplate:
                        "<b>" + sideLabel + " hard CC</b><br>" +
                        "%{customdata[5]}<br>" +
                        "%{customdata[0]} events \u00b7 %{customdata[1]} effective<br>" +
                        "%{customdata[2]:.1f}s recorded duration<br>" +
                        "Top skill: %{customdata[3]}<br>" +
                        "Top source: %{customdata[4]}" +
                        "<extra></extra>",
                };
            },
            buildEventTrace: function (events, isSquadEvent, eventType, color) {
                const matchingEvents = (events || []).filter(event => Boolean(event && event.isEnemy) === isSquadEvent);
                const sideLabel = isSquadEvent ? "Squad" : "Enemy";
                const eventLabel = eventType === "kill" ? "Kill" : "Down";
                return {
                    type: "scatter",
                    mode: "markers",
                    name: sideLabel + " " + eventLabel,
                    x: matchingEvents.map(event => Number(event.time || 0) / 1000.0),
                    y: matchingEvents.map(() => isSquadEvent ? 1 : 0),
                    yaxis: "y3",
                    customdata: matchingEvents.map(event => [
                        event.actorName || "Unknown player",
                        event.timeLabel || this.formatTime(event.time),
                        event.outcomeDurationLabel || "",
                    ]),
                    marker: {
                        color: color,
                        size: eventType === "kill" ? 13 : 12,
                        symbol: eventType === "kill" ? "diamond" : "circle-open",
                        line: {
                            color: color,
                            width: eventType === "kill" ? 1 : 2.5,
                        },
                    },
                    hovertemplate:
                        "<b>" + sideLabel + " " + eventLabel + "</b><br>" +
                        "%{customdata[1]}<br>" +
                        "Victim: %{customdata[0]}" +
                        (eventType === "kill" ? "<br>Down-to-kill: %{customdata[2]}" : "") +
                        "<extra></extra>",
                    cliponaxis: false,
                };
            },
            replayCursorShape: function () {
                const replaySeconds = Number(this.time || 0) / 1000.0;
                return {
                    type: "line",
                    xref: "x",
                    yref: "paper",
                    x0: replaySeconds,
                    x1: replaySeconds,
                    y0: 0,
                    y1: 1,
                    line: {
                        color: "#ffd166",
                        width: 2,
                        dash: "dot",
                    },
                };
            },
            updateReplayCursor: function () {
                if (typeof Plotly === "undefined" || !this.$refs || !this.$refs.chart) {
                    return;
                }
                Plotly.relayout(this.$refs.chart, {
                    shapes: [this.replayCursorShape()],
                });
            },
            scheduleReplayCursorUpdate: function () {
                if (this.cursorUpdateTimer != null) {
                    return;
                }
                this.cursorUpdateTimer = setTimeout(() => {
                    this.cursorUpdateTimer = null;
                    this.updateReplayCursor();
                }, 100);
            },
            handleChartClick: function (eventData) {
                if (!eventData || !eventData.points || eventData.points.length === 0) {
                    return;
                }
                const seconds = Number(eventData.points[0].x);
                if (!Number.isFinite(seconds)) {
                    return;
                }
                this.jumpToBurst(Math.round(seconds * 1000.0));
            },
            handleResize: function () {
                if (typeof Plotly !== "undefined" && Plotly.Plots && this.$refs && this.$refs.chart) {
                    Plotly.Plots.resize(this.$refs.chart);
                }
            },
        },
    });

                    combined: this.downAnalysis.combinedSummary,
                    squad: this.downAnalysis.squadSummary,

                    squadDowns: 0,
                    enemyDowns: 0,
                    ccImpactedDowns: 0,
                    conditionImpactedDowns: 0,
                    mysticRebukeDowns: 0,

                return "Strike " + this.formatAmount(strike ? strike.amount : 0) + ", Condition " + this.formatAmount(condition ? condition.amount : 0);
            },

                if (!contributor || !contributor.details) {
                    return 0;
                }
                const strike = contributor.details.find(detail => detail.name === "Strike");
                return strike ? strike.amount : 0;
            },
            getContributorConditionAmount: function (contributor) {
                if (!contributor || !contributor.details) {
                    return 0;

                const condition = contributor.details.find(detail => detail.name === "Condition");
                return condition ? condition.amount : 0;

                    : "combat-replay-wvw-analysis-pill-muted";
            },
        },
    });
