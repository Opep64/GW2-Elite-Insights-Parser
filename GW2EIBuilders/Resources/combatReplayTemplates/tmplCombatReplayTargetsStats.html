<template>
    <div>
        <div v-if="analysis" class="combat-replay-analysis-section-label">Targets</div>
        <ul v-if="!analysis" class="nav nav-pills d-flex flex-row justify-content-center mb-1 scale65">
            <li v-for="(buffType, index) in possibleBuffs" class="ml-1 mr-1">
                <input :id="'crtar-possibleBuffs-' + index" type="checkbox" :value="buffType" v-model="buffsToShow" />
                <label :for="'crtar-possibleBuffs-' + index">{{buffType}}</label>
            </li>
        </ul>
        <div class="mt-1 combat-actor-status-container scrollable-y" :class="{'combat-actor-status-container-analysis': analysis}">
            <div class="d-flex justify-content-center" :class="targetLayoutClass">
                <div v-for="targetData in targets" v-if="render(targetData)" class="target-data" :class="[targetDataClass, {active: selectedtargetid === targetData.target.uniqueID}]">
                    <combat-replay-target-stats-component :time="time" :targetindex="targetData.target.id" :buffstoshow="buffsToShow" :analysis="analysis"/>
                </div>
            </div>
        </div>
    </div>
</template>

<script>
    Vue.component("combat-replay-targets-stats-component", {
        props: {
            time: Number,
            selectedtargetid: Number,
            analysis: {
                type: Boolean,
                default: false,
            },
        },
        template: `${template}`,
        data: function () {
            return {
                buffsToShow: ["Others", "Boons", "Encounter Specifics", "Conditions"]
            }
        },
        methods: {
            render: function (targetData) {
                var crTarget = targetData.crTarget;
                return crTarget.canDraw() && ((crTarget.start === -1 && crTarget.end === -1) || crTarget.start <= this.time && crTarget.end >= this.time);
            }
        },
        computed: {
            possibleBuffs: function() {
                return [ "Boons", "Conditions", "Encounter Specifics","Shared", "Others"];
            },
            targetLayoutClass: function () {
                return this.analysis ? "flex-row flex-wrap align-items-start combat-replay-analysis-target-grid" : "flex-column align-items-center";
            },
            targetDataClass: function () {
                return this.analysis ? "combat-replay-analysis-target-data" : "ml-1 mr-1";
            },
            targets: function () {
                var res = [];
                for (var i = 0; i < logData.targets.length; i++) {
                    var target = logData.targets[i];
                    var crTarget = animator.getActorData(target.uniqueID);
                    if (crTarget) {
                        res.push({
                            target: target,
                            crTarget: crTarget,
                        });
                    }
                }
                return res;
            },
        }
    });
</script>
