<template>
    <div v-if="analysisview" class="d-flex mt-2 justify-content-center align-items-start">
        <div class="d-flex flex-column align-items-center mr-3" style="flex: 0 0 34%; max-width: 34%; min-width: 760px; margin-left: auto;">
            <combat-replay-animation-control-component :key="'analysis-animation-control'" :light="light" :range="animationStatus.range" :animated="animationStatus.animated">
            </combat-replay-animation-control-component>
            <combat-replay-extra-decorations-component :light="light"></combat-replay-extra-decorations-component>
        </div>
        <div class="d-flex flex-column align-items-stretch ml-3" style="flex: 1 1 66%; min-width: 480px; max-width: 1280px; margin-right: auto;">
            <combat-replay-analysis-panel-component
                ref="analysisPanel"
                :time="animationStatus.time"
                :selectedactorid="animationStatus.selectedActorID"
                :targetless="targetless"
                :hasanalysis="hasAnalysis">
            </combat-replay-analysis-panel-component>
        </div>
    </div>
    <div v-else class="d-flex mt-2 justify-content-center align-items-start">
        <div class="d-flex flex-column align-items-center mr-2" style="margin-left: auto; width:620px;">
            <combat-replay-damage-data-component :time="animationStatus.time" :selectedplayerid="animationStatus.selectedActorID">
            </combat-replay-damage-data-component>
            <combat-replay-extra-decorations-component :light="light"></combat-replay-extra-decorations-component>
        </div>
        <combat-replay-animation-control-component :key="'combat-replay-animation-control'" :light="light" :range="animationStatus.range" :animated="animationStatus.animated">
        </combat-replay-animation-control-component>
        <div class="d-flex flex-column align-items-center ml-2" style="margin-right: auto;width:500px;">
            <combat-replay-status-data-component :time="animationStatus.time" :selectedactorid="animationStatus.selectedActorID">
            </combat-replay-status-data-component>
        </div>
    </div>
</template>

<script>
    Vue.component("combat-replay-ui-component", {
        props: ["mode", "light", "analysisview"],
        template: `${template}`,
        data: function () {
            return {
                animationStatus: reactiveAnimationData,
                analysisFocusUnits: 179.7,
                selectionMode: 0,
                targetless: logData.targetless,
                pendingAnalysisPlayerId: null,
            };
        },
        computed: {
            hasAnalysis: function () {
                return !!(crData && crData.analysis);
            },
        },
        methods: {
            getWindowPendingAnalysisPlayerId: function () {
                if (typeof window === "undefined") {
                    return null;
                }
                return window.pendingCombatReplayAnalysisPlayerId != null
                    ? window.pendingCombatReplayAnalysisPlayerId
                    : null;
            },
            clearWindowPendingAnalysisPlayerId: function (actorId) {
                if (typeof window === "undefined") {
                    return;
                }
                if (actorId == null || String(window.pendingCombatReplayAnalysisPlayerId) === String(actorId)) {
                    window.pendingCombatReplayAnalysisPlayerId = null;
                }
            },
            syncWindowPendingAnalysisPlayer: function () {
                const actorId = this.getWindowPendingAnalysisPlayerId();
                if (actorId == null) {
                    return;
                }
                const navigationState = typeof getCombatReplayAnalysisNavigationState === "function"
                    ? getCombatReplayAnalysisNavigationState()
                    : null;
                if (navigationState) {
                    navigationState.overviewMode = 6;
                    navigationState.selectedActorId = actorId;
                    navigationState.stickySelectedActorId = actorId;
                }
                this.pendingAnalysisPlayerId = actorId;
                this.animationStatus.selectedActorID = actorId;
            },
            applyPendingAnalysisPlayer: function (remainingAttempts) {
                this.syncWindowPendingAnalysisPlayer();
                if (!this.analysisview || this.pendingAnalysisPlayerId == null) {
                    return;
                }
                const actorId = this.pendingAnalysisPlayerId;
                this.animationStatus.selectedActorID = actorId;
                if (this.$refs.analysisPanel && this.$refs.analysisPanel.navigateToPlayer) {
                    this.$refs.analysisPanel.navigateToPlayer(actorId);
                    if (this.$refs.analysisPanel.selectedPlayer && String(this.$refs.analysisPanel.selectedPlayer.uniqueID) === String(actorId)) {
                        this.pendingAnalysisPlayerId = null;
                        this.clearWindowPendingAnalysisPlayerId(actorId);
                        return;
                    }
                }
                if (remainingAttempts > 0) {
                    setTimeout(() => {
                        this.applyPendingAnalysisPlayer(remainingAttempts - 1);
                    }, 50);
                }
            },
            navigateToAnalysisPlayer: function (actorId) {
                if (actorId == null) {
                    return;
                }
                const navigationState = typeof getCombatReplayAnalysisNavigationState === "function"
                    ? getCombatReplayAnalysisNavigationState()
                    : null;
                if (navigationState) {
                    navigationState.stickySelectedActorId = actorId;
                }
                if (typeof window !== "undefined") {
                    window.pendingCombatReplayAnalysisPlayerId = actorId;
                }
                this.pendingAnalysisPlayerId = actorId;
                this.animationStatus.selectedActorID = actorId;
                this.$nextTick(() => this.applyPendingAnalysisPlayer(30));
            },
        },
        watch: {
            analysisview: function (value) {
                if (value) {
                    this.syncWindowPendingAnalysisPlayer();
                }
                if (value && this.pendingAnalysisPlayerId != null) {
                    this.$nextTick(() => this.applyPendingAnalysisPlayer(30));
                    return;
                }
                if (value && this.animationStatus.selectedActorID != null && animator != null) {
                    animator.focusActorAtScale(this.animationStatus.selectedActorID, this.analysisFocusUnits);
                }
            },
            'animationStatus.selectedActorID': function (actorId) {
                if (this.animationStatus.selectedActorSource === "map") {
                    this.animationStatus.selectedActorSource = null;
                    return;
                }
                this.animationStatus.selectedActorSource = null;
                if (this.analysisview && actorId != null && animator != null) {
                    animator.focusActorAtScale(actorId, this.analysisFocusUnits);
                }
            },
        },
        created() {
            animator = new Animator(crData);
            this.syncWindowPendingAnalysisPlayer();
        },
        activated() {
            this.syncWindowPendingAnalysisPlayer();
            if (this.animationStatus.animated && animator != null) {
                animator.startAnimate(false);
            }
            if (this.analysisview && this.pendingAnalysisPlayerId != null) {
                this.$nextTick(() => this.applyPendingAnalysisPlayer(30));
                return;
            }
            if (this.analysisview && this.animationStatus.selectedActorID != null && animator != null) {
                animator.focusActorAtScale(this.animationStatus.selectedActorID, this.analysisFocusUnits);
            }
        },
        deactivated() {
            if (this.animationStatus.animated && animator != null) {
                animator.stopAnimate(false);
            }
        },
    });
</script>
